<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 20' fill='none' stroke='%231B6A72' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M1 4c4 0 5 3 9 3s5-3 9-3'/%3E%3Cpath d='M4 10c3 0 4 3 8 3s6-3 9-3'/%3E%3Cpath d='M1 16c4 0 6 3 10 3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<header class="site-header">
<a class="wordmark" href="./">
<svg class="creek-mark" aria-hidden="true" viewBox="0 0 28 20" width="28" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
<path d="M1 4c4 0 5 3 9 3s5-3 9-3"/>
<path d="M4 10c3 0 4 3 8 3s6-3 9-3"/>
<path d="M1 16c4 0 6 3 10 3"/>
</svg>
<span data-site-name></span>
</a>
<nav><a href="about.html">About</a></nav>
</header>

<main class="page">
<h1 class="mission" data-mission>Find who sells it near you or online, ranked by how they treat people and the planet, never Amazon.</h1>

<form id="search" class="search" method="post" action="#" novalidate>
<div class="field field-product">
<label for="product">What are you looking for</label>
<input id="product" type="text" required maxlength="120" autocomplete="off" autocapitalize="off" aria-describedby="product-help">
<p id="product-help" class="field-help" hidden></p>
</div>
<div class="field field-zip">
<label for="zip">Zip code</label>
<input id="zip" type="text" required inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="postal-code" aria-describedby="zip-help">
<p id="zip-help" class="field-help" hidden></p>
</div>
<button type="submit" class="button-primary">Search</button>
</form>

<p id="status" class="status" role="status" aria-live="polite" data-status></p>

<div id="results" class="results-wrap" hidden>
<div class="controls">
<label for="sort">Sort by</label>
<select id="sort">
<option value="score" selected>Score</option>
<option value="distance">Distance</option>
<option value="name">Name</option>
</select>
<label><input type="checkbox" id="show-near" checked> Near you</label>
<label><input type="checkbox" id="show-online" checked> Online</label>
<label><input type="checkbox" id="certified-only"> Has certification</label>
</div>
<div id="result-sections"></div>
<p class="coverage-note">Results come from Brave Search's index; shops that block search crawlers may be missing. <a href="about.html#coverage">Coverage and quality</a></p>
</div>
</main>

<footer class="site-footer">
<p>
<span data-cost hidden></span>
<a href="about.html">About</a>
<span>Zip data: US Census ZCTA Gazetteer and <a href="https://www.geonames.org" rel="noopener noreferrer">GeoNames</a> (<a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener noreferrer">CC BY 4.0</a>).</span>
</p>
</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
