name: Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the Pages site first; that needs pages: read on a private repo.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      # No npm cache here: the deploy build should not restore a cache other runs wrote.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v6
      # The workers.dev host carries the account name; mask it before any step
      # that could echo it. It is still public in the built bundle.
      - name: Mask Worker URL
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          : "${WORKER_URL:?set the WORKER_URL repository Actions variable}"
          echo "::add-mask::$WORKER_URL"
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm run scan:bundle
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
