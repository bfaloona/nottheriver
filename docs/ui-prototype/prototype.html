  ['amazon', 'Why Amazon never appears'], ['cost', 'Cost'], ['dispute', 'Disputing'], ['credits', 'Source and credits'],

function renderAbout(st, search) {
  const curSec = st.sec || 'order';
  // At narrow the index is one native select, sticky under the top bar.
  const sel = '<div class="aselwrap"><label class="vh" for="aboutsel">About section</label><select id="aboutsel" class="asel">'
    + ABOUT_SECS.map(([k, t]) => `<option value="${k}"${k === curSec ? ' selected' : ''}>${t}</option>`).join('') + '</select></div>';
  return `<div class="about">${sel}<h1 class="vh">About nottheriver</h1>${aboutBody(search.response.usage)}</div>`;
}

function scrollAboutTo(key) {
  const h = document.getElementById('ab-' + key);
  if (!h) return;
  const col = document.getElementById('col');
  if (layout() === 'narrow') {
    const sel = document.querySelector('.aselwrap');
    const above = document.getElementById('topbar').offsetHeight + (sel ? sel.offsetHeight : 0);
    window.scrollTo(0, key === 'order' ? 0 : Math.max(0, h.getBoundingClientRect().top + window.scrollY - above - 8));
  } else {
    col.scrollTop = key === 'order' ? 0 : col.scrollTop + h.getBoundingClientRect().top - col.getBoundingClientRect().top - 16;
  }
}

/* ======================================================================
   Render: one entry point that redraws from state
   ====================================================================== */
const form = { q: '', z: '' };   // in memory only; never written to the hash, storage or a URL
let lastView = null;
let lastKey = null;
let searchTimer = null;
let searchStarted = false;

function linkFor(patch) { return '#' + serialize(Object.assign({}, state, patch)); }

// The normalized state of the last render. Handlers build patches from it, so an id the
// fallbacks dropped never counts toward the compare limit or comes back.
let cur = state;
// What to focus once the next render is done: a selector, or a list tried in turn. Close renders
// later, on the hashchange that history.go brings, so this outlives the call that sets it.
let pendingFocus = null;
// True when focus must not scroll the list (a ticked box that moved into "To compare").
let pendingFocusStill = false;
// A row to hold at its screen position across the next render: { id, top }.
let pendingAnchor = null;
let lastPanel = null;
let lastSheet = '';
let listScroll = { y: 0, col: 0 };
let lastSecKey = '';
let lastDisputeKey = '';
let lastRowKey = '';
let lastAboutKey = '';
let lastStartState = '';
// Narrow compare: the shopper opened the whole gap sentence. Not a place, so not in the hash.
let gapOpen = false;

function render() {
  const search = getSearch(state);
  const st = normalize(state, search);
  // A fallback (a bad value, or an id that does not fit) is written back to the hash, so the address
  // and the next change build on what shows. A reference left implicit stays implicit.
  const fixedHash = '#' + serialize(Object.assign({}, st, { ref: st.cmp.includes(state.ref) ? state.ref : '' }));
  if (fixedHash !== (location.hash || '#')) {
    history.replaceState(history.state, '', fixedHash);
    state = parseHash(fixedHash);
  }
  cur = st;
  document.documentElement.setAttribute('data-theme', st.theme);

  const lay = layout();
  const app = document.getElementById('app');
  const col = document.getElementById('col');
  // The list's place is kept while no panel is open, and given back whenever the panel goes away.
  if (!lastPanel) listScroll = { y: window.scrollY, col: col.scrollTop };
  const hasPanel = renderPanel(st, search);
  app.className = 'app view-' + st.view + ' lay-' + lay + (hasPanel ? ' has-panel panel-' + st.panel : '')
    + (hasPanel && st.panel === 'compare' ? ' has-cmp' : '') + (st.marks === '1' ? ' marks' : '');

  const tq = document.getElementById('tq');
  const tz = document.getElementById('tz');
  if (st.view !== lastView || search.key !== lastKey) {
    if (st.view === 'results') tq.value = search.query.product;
    else if (st.view === 'searching') tq.value = form.q || search.query.product;
    tz.value = form.z;
    clearErrors();
  }
  document.getElementById('tform').hidden = !(st.view === 'results' || st.view === 'searching');
  const leave = { sec: '', state: '', panel: 'none', shop: '', dispute: 'none', sheet: 'none' };
  document.getElementById('wordmark').setAttribute('href', linkFor(Object.assign({ view: 'start' }, leave)));
  ['aboutlink', 'footabout'].forEach((id) => document.getElementById(id)
    .setAttribute('href', linkFor(Object.assign({ view: 'about' }, leave))));

  renderTop(st, search);
  renderFacts(st, search);
  renderChips(st, search);
  renderRail(st, search);

  const start = document.getElementById('v-start');
  const dyn = document.getElementById('v-dyn');
  start.hidden = st.view !== 'start';
  if (st.view === 'start') {
    dyn.innerHTML = '';
    if (lastView !== 'start') {
      document.getElementById('sq').value = form.q;
      document.getElementById('sz').value = form.z;
    }
    renderStartState(st, search);
  } else if (st.view === 'searching') {
    dyn.innerHTML = renderSearching(st, search);
  } else if (st.view === 'results') {
    // Beside a docked panel the table narrows; a drawer or sheet leaves the full columns.
    const mode = !hasPanel || lay === 'narrow' ? '' : st.panel === 'compare' ? (lay === 'wide' ? 'cmp' : '') : 'shop';
    const q = search.query;
    // The view's own heading, for heading navigation and as a place to put focus.
    dyn.innerHTML = `<h1 class="vh" id="results-h" tabindex="-1">Shops for ${esc(q.product)} near ${esc(q.city)}, ${esc(q.state)}</h1>`
      + (isMessage(search) ? renderMessage(st, search) : renderResults(st, search, mode));
  } else {
    dyn.innerHTML = renderAbout(st, search);
  }
  if (st.view !== 'start') lastStartState = '';

  const shell = document.getElementById('shell');
  shell.classList.toggle('with-panel', hasPanel);
  shell.classList.toggle('with-compare', hasPanel && st.panel === 'compare');
  renderSheet(st, search);
  const skipF = document.getElementById('skip-filters');
  skipF.hidden = !(st.view === 'start' || (st.view === 'results' && search.response)) || (lay === 'narrow' && hasPanel);

  if (hasPanel && !lastPanel && lay === 'narrow') window.scrollTo(0, 0);
  // Back or Forward opened or closed a layer without a control asking for focus: put it where the
  // control would have (the panel's heading, or the sheet's opener), never on the page body.
  const lost = () => { const a = document.activeElement; return !a || a === document.body || !document.contains(a) || a.closest('[hidden]'); };
  if (hasPanel && !lastPanel && lastView !== null && !pendingFocus && lost()) pendingFocus = '#panel-h';
  // Back or Forward changed the view: focus goes to the new view's start, as a link to it would.
  if (st.view !== lastView && lastView !== null && !pendingFocus && lost()) {
    pendingFocus = { start: '#sq', searching: '#qcard-h', about: `#abh-${st.sec || 'order'}`,
      results: ['#grid .srow .name', '#results-h'] }[st.view];
  }
  const sheetOpen = !document.getElementById('sheet').hidden;
  if (lastSheet && !sheetOpen && !pendingFocus && lost()) pendingFocus = sheetOpener(lastSheet);
  lastSheet = sheetOpen ? st.sheet : '';
  if (!hasPanel && lastPanel) {
    if (lay === 'narrow') window.scrollTo(0, listScroll.y);
    else col.scrollTop = listScroll.col;
    // Back or Forward closed the panel: focus goes where Close would have sent it.
    if (!pendingFocus && lost()) pendingFocus = closeFocus(lastPanel, search);
  }
  if (pendingAnchor) {
    const row = document.querySelector(`#grid tr.srow:not(.pcopy)[data-id="${pendingAnchor.id}"]`);
    if (row) {
      const d = row.getBoundingClientRect().top - pendingAnchor.top;
      if (lay === 'narrow') window.scrollBy(0, d);
      else col.scrollTop += d;
    }
    pendingAnchor = null;
  }
  if (pendingFocus) {
    const el = [].concat(pendingFocus).map((s) => document.querySelector(s)).find(Boolean);
    const opts = pendingFocusStill ? { preventScroll: true } : undefined;
    pendingFocus = null;
    pendingFocusStill = false;
    if (el) el.focus(opts);
  }
  lastPanel = hasPanel ? { panel: st.panel, shop: st.shop } : null;
  if (st.panel !== 'compare') gapOpen = false;
  const gl = document.querySelector('#panel .gapline.clamp');
  if (gl) { const t = gl.querySelector('.gtext'); gl.classList.toggle('long', t.scrollHeight > t.clientHeight + 1); }
  updateStuck();
  // sec and dispute scroll once when they change, including on a cold hash load; a redraw leaves the reader's place alone.
  const secKey = hasPanel && st.panel === 'shop' && st.sec ? [search.key, st.shop, st.sec].join('|') : '';
  if (secKey && secKey !== lastSecKey) {
    const target = st.sec === 'record' ? (document.querySelector('#p-record .fcard') || document.getElementById('p-record'))
      : document.getElementById(st.sec === 'where' ? 'p-where' : 'p-score');
    if (target) scrollPanelTo(target, true);
  }
  lastSecKey = secKey;
  const dKey = hasPanel && st.dispute !== 'none' ? [search.key, st.shop, st.dispute].join('|') : '';
  if (dKey && dKey !== lastDisputeKey) {
    const note = document.getElementById('dn-' + st.dispute);
    if (note) scrollPanelTo(note, false);
  }
  lastDisputeKey = dKey;
  // Keep the opened shop's row on screen in the list when the shop changes (a hash load, Next shop).
  const rowKey = hasPanel && (st.panel === 'shop' || st.panel === 'chosen') ? search.key + '|' + st.shop : '';
  if (rowKey && rowKey !== lastRowKey) {
    const col = document.getElementById('col');
    const row = col.querySelector(`tr.srow:not(.pcopy)[data-id="${st.shop}"]`) || col.querySelector(`tr.srow[data-id="${st.shop}"]`);
    if (row && col.clientHeight) {
      const cr = col.getBoundingClientRect(), rr = row.getBoundingClientRect();
      if (rr.top < cr.top + 60 || rr.bottom > cr.bottom) col.scrollTop += rr.top - cr.top - cr.height / 2 + rr.height / 2;
    }
  }
  lastRowKey = rowKey;
  // About: sec scrolls its heading to the top once per change, like the panel's sec.
  const aboutKey = st.view === 'about' ? st.sec || 'order' : '';
  if (aboutKey && aboutKey !== lastAboutKey) scrollAboutTo(aboutKey);
  lastAboutKey = aboutKey;

  if (st.view === 'searching' && searchStarted && !searchTimer) {
    // Only a search started by the Search button moves on; a searching view loaded by hash holds still.
    searchTimer = setTimeout(() => {
      searchTimer = null;
      searchStarted = false;
      if (state.view !== 'searching') return;
      pendingFocus = ['#grid .srow .name', '#grid button', '#v-dyn h2'];
      setState({ view: 'results' }, false);
      const r = getSearch(state).response;
      announce(`Found ${r.local.length} shops near you, ${(r.local_farther || []).length} farther away and ${r.online.length} online.`);
    }, 1200);
  }
  lastView = st.view;
  lastKey = search.key;
}

// The panel bar names the shop once the shop's own heading has scrolled under the bar.
function updateStuck() {
  const nav = document.querySelector('#panel .pnav');
  if (!nav) return;
  const h = document.querySelector('#panel .ptitle');
  nav.classList.toggle('stuck', !!h && h.getBoundingClientRect().bottom <= nav.getBoundingClientRect().bottom);
}
document.addEventListener('scroll', updateStuck, true);

function announce(msg) {
  const s = document.getElementById('status');
  s.textContent = '';
  setTimeout(() => { s.textContent = msg; }, 30);
}

/* ======================================================================
   Events: search form
   ====================================================================== */
const ERR = {
  product: 'Type what you are looking for.',
  zip: 'Enter a five-digit zip code.',
  zipUnknown: "That zip code isn't in our list. Check the five digits and try again.",
};

function validate(q, z) {
  const e = {};
  const t = q.trim();
  if (t.length < 1 || t.length > 120) e.q = ERR.product;
  const zt = z.trim();
  if (!/^\d{5}$/.test(zt)) e.z = ERR.zip;
  else if (zt === '00000') e.z = ERR.zipUnknown;
  return e;
}

function setFieldError(input, errEl, msg) {
  if (msg) {
    input.setAttribute('aria-invalid', 'true');
    input.setAttribute('aria-describedby', errEl.id);
    errEl.textContent = msg;
    errEl.hidden = false;
  } else {
    input.removeAttribute('aria-invalid');
    input.removeAttribute('aria-describedby');
    errEl.textContent = '';
    errEl.hidden = true;
  }
}

function clearErrors() {
  [['sq', 'sq-err'], ['sz', 'sz-err'], ['tq', 'tq-err'], ['tz', 'tz-err'], ['eq', 'eq-err'], ['ez', 'ez-err']].forEach(([i, e]) => {
    const input = document.getElementById(i);
    if (input) setFieldError(input, document.getElementById(e), '');
  });
}

function submitSearch(qId, zId) {
  const qi = document.getElementById(qId);
  const zi = document.getElementById(zId);
  const e = validate(qi.value, zi.value);
  setFieldError(qi, document.getElementById(qId + '-err'), e.q);
  setFieldError(zi, document.getElementById(zId + '-err'), e.z);
  if (e.q) { qi.focus(); return; }
  if (e.z) { zi.focus(); return; }
  form.q = qi.value.trim();
  form.z = zi.value.trim();
  startSearch();
}

// Search and Try again: the searching view takes focus at its card and says so; results take it at the first row.
function startSearch() {
  searchStarted = true;
  if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
  pendingFocus = '#qcard-h';
  setState({ view: 'searching', state: '', panel: 'none', shop: '', sec: '', dispute: 'none', sheet: 'none' }, true);
  const q = getSearch(cur).query;
  announce(`Searching for shops near ${q.city}, ${q.state}`);
}

document.addEventListener('submit', (ev) => {
  if (ev.target.id === 'sform') { ev.preventDefault(); submitSearch('sq', 'sz'); }
  else if (ev.target.id === 'tform') { ev.preventDefault(); submitSearch('tq', 'tz'); }
  else if (ev.target.id === 'eform') { ev.preventDefault(); submitSearch('eq', 'ez'); }
});

document.addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (['sq', 'sz', 'tq', 'tz', 'eq', 'ez'].includes(id)) {
    if (id === 'sq' || id === 'tq' || id === 'eq') form.q = ev.target.value;
    else form.z = ev.target.value;
    if (ev.target.getAttribute('aria-invalid')) setFieldError(ev.target, document.getElementById(id + '-err'), '');
    // A canned start state is a picture of one moment; typing moves past it.
    if (cur.view === 'start' && cur.state) setState({ state: '' });
  }
});

/* ======================================================================
   Events: navigation links and the list
   ====================================================================== */
document.addEventListener('click', (ev) => {
  const a = ev.target.closest('#wordmark, #aboutlink, #footabout');
  if (a) {
    ev.preventDefault();
    const leave = { state: '', panel: 'none', shop: '', dispute: 'none', sheet: 'none' };
    if (a.id === 'wordmark') setState(Object.assign({ view: 'start', sec: '' }, leave), true);
    else setState(Object.assign({ view: 'about', sec: '' }, leave), true);
    return;
  }
  // In-page About links keep data, place and theme, which a bare hash link would drop.
  const al = ev.target.closest('a[href^="#view=about"]');
  if (al) {
    ev.preventDefault();
    const sec = parseHash(al.getAttribute('href')).sec || 'order';
    lastAboutKey = '';
    if (al.closest('.aindex')) pendingFocus = `#abh-${sec}`;
    setState({ view: 'about', sec, state: '', panel: 'none', shop: '', dispute: 'none', sheet: 'none' });
    return;
  }
  if (ev.target.closest('#skip-results')) { skipTo('results'); return; }
  if (ev.target.closest('#skip-filters')) { skipTo('filters'); return; }
  if (ev.target.closest('#aboutsearch, #chip-about, #facts-about')) { pendingFocus = '#panel-h'; searchOpener = ev.target.closest('#facts-about') ? '#facts-about' : ''; setState({ panel: 'search' }, true); return; }
  if (ev.target.closest('#filtersbtn, #chip-filters, #sfilters')) { pendingFocus = '#sheet-h'; setState({ sheet: 'filters' }); return; }
  if (ev.target.closest('#tedit')) { pendingFocus = '#eq'; setState({ sheet: 'edit' }); return; }
  // The whole compare cell is the target, not only the 16 px box.
  const cmpCell = ev.target.closest('td.c-cmp');
  if (cmpCell && !ev.target.closest('.cmpbox')) {
    const b = cmpCell.querySelector('.cmpbox');
    if (b && !b.disabled) b.click();
    return;
  }
  const sb = ev.target.closest('button[data-sort]');
  if (sb) {
    const s = sb.dataset.sort;
    pendingFocus = `button[data-sort="${s}"]`;
    setState({ sort: s });
    announce(`Sorted by ${SORT_NAME[s].toLowerCase()}`);
    return;
  }
  if (ev.target.closest('.scrim[data-act="sheetclose"]')) { closeSheet(); return; }
  const out = ev.target.closest('.out[data-href]');
  if (out) {
    toast(`Prototype: this would open ${hostOf(out.dataset.href)} in a new tab.`);
    return;
  }
  const act = ev.target.closest('button[data-act]');
  if (act) { doAct(act); return; }
  const box = ev.target.closest('.cmpbox');
  if (box) return;
  const row = ev.target.closest('tr.srow');
  if (row && !ev.target.closest('td.c-cmp')) openShop(row.dataset.id);
});

/* ======================================================================
   Events: panel, compare and chosen actions
   ====================================================================== */
// from: 'compare' when a compare column's name opened the shop; its panel then offers the way back.
function openShop(id, from) {
  pendingFocus = '#panel-h';
  setState({ panel: 'shop', shop: id, sec: '', dispute: 'none' }, undefined, { from: from || '' });
}

// Where focus goes when a panel closes: the row's name (or, when its row is folded, the fold's
// button), the Compare button, or the control that opened About this search.
function closeFocus(p, search) {
  if (p.panel === 'shop' || p.panel === 'chosen') {
    const vm = byIdOf(search)[p.shop];
    return [`#grid tr:not(.pcopy) .name[data-open="${p.shop}"]`, `.name[data-open="${p.shop}"]`]
      .concat(vm ? [`.tiebtn[data-tie="${vm.sec}|${vm.score.toFixed(3)}"]`] : []);
  }
  if (p.panel === 'compare') return ['#grid [data-act="cmpopen"]:not([disabled])', '#grid .srow .cmpbox'];
  if (p.panel === 'search') return [searchOpener, layout() === 'narrow' ? '#chip-about' : '#aboutsearch'].filter(Boolean);
  return null;
}
// About this search has two openers at narrow in the thin state; closing returns to the one used.
let searchOpener = '';

// Close steps back to the plain list when that is the entry under the panel, so the next
// browser Back does not reopen what was just closed.
function closePanel() {
  pendingFocus = closeFocus({ panel: cur.panel, shop: cur.shop }, getSearch(cur));
  const hs = histState();
  if (hs && hs.ov > 0 && hs.clean && cur.sheet === 'none') { history.go(-hs.ov); return; }
  setState({ panel: 'none', shop: '', sec: '', dispute: 'none' });
}

function setPicks(cmp, focusSel) {
  // Only a reference someone set stays in the hash; the default (the first pick) is left implicit.
  const patch = { cmp, ref: cmp.includes(state.ref) ? state.ref : '' };
  // Removing down to one shop closes compare and keeps the pick; focus goes to that shop's box.
  const closing = cur.panel === 'compare' && cmp.length < 2;
  if (closing) patch.panel = 'none';
  pendingFocus = closing && cmp.length ? [`#grid tr:not(.pcopy) .cmpbox[data-cmp="${cmp[0]}"]`, '#grid .srow .cmpbox'] : focusSel || null;
  if (closing && stepBackWith(patch)) return;
  setState(patch);
}

function toggleCmp(id, focusSel) {
  const search = getSearch(cur);
  const vm = byIdOf(search)[id];
  if (cur.cmp.includes(id)) {
    const cmp = cur.cmp.filter((x) => x !== id);
    setPicks(cmp, focusSel);
    announce(`${vm.name} removed from compare, ${cmp.length} of 4`);
    return;
  }
  if (cur.cmp.length >= 4) { pendingAnchor = null; pendingFocusStill = false; toast(CMP_FULL); return; }
  const cmp = cur.cmp.concat(id);
  setPicks(cmp, focusSel);
  announce(`${vm.name} added to compare, ${cmp.length} of 4`);
}

// The toast reports what happened: success only once the write is done.
const COPY_FAILED = 'Copy did not work. The address is shown above.';
function copyAddress(text) {
  if (!navigator.clipboard || !navigator.clipboard.writeText) { toast(COPY_FAILED); return; }
  navigator.clipboard.writeText(text).then(() => toast('Address copied.'), () => toast(COPY_FAILED));
}

function doAct(el) {
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'close': closePanel(); break;
    case 'go':
      pendingFocus = `.pnav [data-dir="${el.dataset.dir}"]:not([disabled]), #panel-h`;
      setState({ shop: id, sec: '', dispute: 'none' });
      break;
    case 'open': openShop(id, el.dataset.from); break;
    case 'tocompare':
      pendingFocus = '#panel-h';
      if (curOv() > 0) history.back();
      else setState({ panel: 'compare', shop: '', sec: '', dispute: 'none' });
      break;
    case 'choose':
      pendingFocus = '#panel-h';
      setState({ panel: 'chosen', shop: id, sec: '', dispute: 'none' });
      break;
    case 'togglecmp': toggleCmp(id, `[data-act="togglecmp"][data-id="${id}"]`); break;
    case 'dispute': {
      const key = el.dataset.key;
      pendingFocus = `[data-act="dispute"][data-key="${key}"]`;
      setState({ dispute: cur.dispute === key ? 'none' : key });
      break;
    }
    case 'copy': copyAddress(el.dataset.addr); break;
    case 'cmpopen': pendingFocus = '#panel-h'; setState({ panel: 'compare' }); break;
    case 'cmpclear':
      // The band and its buttons go away, so focus moves to the first row's compare box.
      pendingFocus = '#grid .srow .cmpbox';
      setState(Object.assign({ cmp: [], ref: '' }, cur.panel === 'compare' ? { panel: 'none' } : {}));
      announce('Compare cleared');
      break;
    case 'setref': pendingFocus = '#panel-h'; setState({ ref: id }); break;
    case 'remove': toggleCmp(id, '#panel-h'); break;
    case 'back': closePanel(); break;
    case 'newsearch': setState({ view: 'start', state: '', panel: 'none', shop: '', sec: '', dispute: 'none', sheet: 'none' }); break;
    case 'unfilter': {
      const a = activeFilters(cur)[Number(el.dataset.idx)];
      if (a) { pendingFocus = '#grid button[data-act="unfilter"], #grid .srow .name'; applyFilters(a.patch); }
      break;
    }
    case 'clearfilters':
      // The pressed button is now disabled, so focus goes to the list it just widened.
      pendingFocus = el.closest('#sheet') ? '#sheet-h' : ['#grid .srow .name', '#rail input:not([disabled])'];
      applyFilters(CLEAR_FILTERS);
      break;
    case 'sheetclose': closeSheet(); break;
    // Try again runs the search once more; the form keeps its text.
    case 'retry': startSearch(); break;
    case 'thin': pendingFocus = '#panel-h'; searchOpener = '#grid [data-act="thin"]'; setState({ panel: 'search' }); break;
    case 'ties': {
      // Focus lands on the first row the fold was hiding.
      const prev = el.closest('tr').previousElementSibling;
      const after = prev ? prev.dataset.id : '';
      setState({ ties: 'open' });
      const row = after && document.querySelector(`tr.srow:not(.pcopy)[data-id="${after}"]`);
      const nx = row && row.nextElementSibling;
      const nb = nx && nx.querySelector('.name');
      if (nb) nb.focus();
      break;
    }
    case 'tiesfold':
      pendingFocus = `.tiebtn[data-tie="${el.dataset.tie}"]`;
      setState({ ties: 'fold' });
      break;
    case 'sources':
      lastSecKey = '';
      setState({ sec: 'record' });
      break;
    case 'filters': pendingFocus = '#sheet-h'; setState({ sheet: 'filters' }); break;
    case 'gapmore': gapOpen = true; pendingFocus = '#panel .gtext'; render(); break;
    default: break;
  }
}

// Skip links: results lands on the list; filters opens the rail, or its sheet where it is folded.
function skipTo(where) {
  if (where === 'results') {
    // At narrow an open panel is the page and the list is not drawn, so the panel's heading is the result.
    const covered = layout() === 'narrow' && cur.panel !== 'none' && !document.getElementById('panel').hidden;
    // Tried in turn: one comma list would return #list, the ancestor of the rest.
    const t = (covered ? ['#panel-h'] : []).concat(['#grid .srow .name', '#grid button', '#v-dyn h2', '#list'])
      .map((s) => document.querySelector(s)).find(Boolean);
    if (!t) return;
    if (!t.matches('button, a, input, select')) t.setAttribute('tabindex', '-1');
    t.focus();
    return;
  }
  const rail = document.getElementById('rail');
  if (getComputedStyle(rail).display !== 'none' && !document.querySelector('.app.has-cmp')) {
    const f = rail.querySelector('input, select, button, a');
    if (f) f.focus();
    return;
  }
  if (cur.view === 'results' || cur.view === 'start') { pendingFocus = '#sheet-h'; setState({ sheet: 'filters' }); }
}

/* ======================================================================
   Events: rail and sheet
   ====================================================================== */
function applyFilters(patch) {
  setState(patch);
  if (cur.view !== 'results') return;
  // No search came back, or it found nothing: a count of shown shops would say nothing true.
  if (isMessage(getSearch(cur))) { announce('Saved for your next search.'); return; }
  const all = shopsOf(getSearch(cur));
  announce(`${all.filter((vm) => passes(vm, cur)).length} of ${all.length} shops shown`);
}

// The control that opens a sheet, as it exists at this width.
function sheetOpener(kind) {
  if (kind === 'edit') return '#tedit';
  if (cur.view === 'start') return '#sfilters';
  if (layout() !== 'narrow') return '#filtersbtn';
  return cur.panel === 'shop' ? ['.pnav [data-act="filters"]', '#panel-h'] : '#chip-filters';
}

function closeSheet() {
  pendingFocus = sheetOpener(cur.sheet);
  // A sheet opened here is its own history entry; stepping back closes it the same way Back does.
  const hs = histState();
  if (hs && hs.sheet && hs.ov > 0) { history.back(); return; }
  setState({ sheet: 'none' });
}

function railChange(el) {
  const rk = el.dataset.rk;
  const v = el.value;
  pendingFocus = '#' + el.id;
  if (rk === 'group') { setState({ group: v }); announceGroup(v); return; }
  if (rk === 'kind' || rk === 'f') {
    const list = cur[rk].includes(v) ? cur[rk].filter((x) => x !== v) : cur[rk].concat(v);
    applyFilters({ [rk]: LISTS[rk].filter((x) => list.includes(x)) });
    return;
  }
  applyFilters({ [rk]: v });
}

function announceGroup(v) { announce(v === 'none' ? 'One list' : 'Grouped by kind'); }

// Keeps Tab inside the open sheet.
function trapTab(ev) {
  const box = document.querySelector('#sheet .sheetbox');
  if (!box) return;
  const items = Array.from(box.querySelectorAll('button, input, select, a[href]')).filter((x) => !x.disabled && x.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (!box.contains(document.activeElement)) { ev.preventDefault(); first.focus(); return; }
  if (ev.shiftKey && (document.activeElement === first || document.activeElement.id === 'sheet-h')) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
}

document.addEventListener('mouseover', (ev) => {
  const row = ev.target.closest && ev.target.closest('tr.srow');
  ringDot(row ? row.dataset.id : '');
});
document.addEventListener('focusin', (ev) => {
  const row = ev.target.closest && ev.target.closest('tr.srow');
  ringDot(row ? row.dataset.id : '');
});

document.addEventListener('change', (ev) => {
  if (ev.target.dataset && ev.target.dataset.rk) { railChange(ev.target); return; }
  if (ev.target.dataset && ev.target.dataset.pk) {
    pendingFocus = '#' + ev.target.id;
    switchProto(ev.target.dataset.pk, ev.target.value);
    return;
  }
  if (ev.target.dataset && ev.target.dataset.chip) {
    const k = ev.target.dataset.chip;
    pendingFocus = '#' + ev.target.id;
    setState({ [k]: ev.target.value });
    if (k === 'sort') announce(`Sorted by ${SORT_NAME[ev.target.value].toLowerCase()}`);
    if (k === 'group') announceGroup(ev.target.value);
    return;
  }
  if (ev.target.id === 'aboutsel') {
    lastAboutKey = '';
    pendingFocus = '#aboutsel';
    setState({ sec: ev.target.value });
    return;
  }
  if (ev.target.matches('input[data-act="only"]')) {
    pendingFocus = 'input[data-act="only"]';
    setState({ only: ev.target.checked ? 'diff' : 'all' });
    return;
  }
  const box = ev.target.closest('.cmpbox');
  if (!box) return;
  const id = box.dataset.cmp;
  // Undo the native toggle; the redraw from the hash sets the box.
  box.checked = cur.cmp.includes(id);
  // The ticked row stays in its band while its copy comes or goes in "To compare" above. The row
  // holds its place on screen, so the list does not jump and the shop under the pointer stays there.
  // Unticked from its copy, the shop's own row holds still instead.
  const own = document.querySelector(`#grid tr.srow:not(.pcopy)[data-id="${id}"]`);
  const tr = box.closest('tr');
  const hold = tr.classList.contains('pcopy') ? null : own;
  if (hold) pendingAnchor = { id, top: hold.getBoundingClientRect().top };
  pendingFocusStill = true;
  toggleCmp(id, [`#grid tr:not(.pcopy) .cmpbox[data-cmp="${id}"]`, '#grid .srow .cmpbox']);
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Tab' && sheetVisible()) { trapTab(ev); return; }
  // Up and Down move between rows, staying in the same control (name or compare box).
  if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && !ev.altKey && !ev.metaKey && !ev.ctrlKey) {
    const ctl = ev.target.closest && ev.target.closest('#grid .srow .name, #grid .srow .cmpbox');
    if (ctl) {
      const sel = ctl.classList.contains('name') ? '.name' : '.cmpbox';
      const rows = Array.from(document.querySelectorAll('#grid tr.srow'));
      const i = rows.indexOf(ctl.closest('tr'));
      const to = rows[i + (ev.key === 'ArrowDown' ? 1 : -1)];
      ev.preventDefault();
      const t = to && to.querySelector(sel);
      if (t) { t.focus(); t.closest('tr').scrollIntoView({ block: 'nearest' }); }
      return;
    }
  }
  if (ev.key !== 'Escape') return;
  // The toast goes with the same press, so closing a panel never takes two.
  if (toastOn()) hideToast();
  if (sheetVisible()) { closeSheet(); return; }
  if (cur.panel !== 'none' && cur.view === 'results') closePanel();
});

window.addEventListener('hashchange', onHashChange);
// Wording, table mode and focus targets depend on the layout, so crossing a breakpoint redraws.
[MQ_WIDE, MQ_NARROW].forEach((m) => m.addEventListener('change', () => render()));

/* ======================================================================
   Boot
   ====================================================================== */
// The panel's generated sentences against the worked strings in the design spec.
function textCheck() {
  const vms = (key) => byIdOf({ response: SEARCHES[key].response, request: SEARCHES[key].request });
  const sm = vms('sparse-metro'), fm = vms('filled-metro');
  const pick = (m, ids) => ids.split(',').map((id) => m[id]);
  const want = [
    [sumLine(sm.n4), '0.250 + 0.075 + 0.150 + 0.145 = 0.620, shown as 0.62.'],
    [sumLine(fm.n3), '0.250 + 0.206 + 0.150 + 0.132 = 0.738. The score is 0.739, shown as 0.74: each part is rounded, so the sum misses by 0.001.'],
    [gapSentence(pick(sm, 'n1,n4,o1'), sm.n1), 'Largest gap from N1 Example Kitchen Supply: N4 Example Home Center is 0.078 lower, nearly all of it People (N4 has a Governance finding).'],
    [gapSentence(pick(sm, 'n5,n6'), sm.n5), 'Against N5 Example Hardware Dealers: N6 Example Hardware Dealers is 0.010 lower, all of it Distance (1.7 mi farther).'],
    [gapSentence(pick(sm, 'o2,o3'), sm.o2), 'O3 Example Kitchen Online has the same score and the same four parts as O2 Example Cast Iron Works.'],
    [gapSentence(pick(sm, 'n1,o1'), sm.n1), 'Against N1 Example Kitchen Supply: O1 Example Trail Outfitters is 0.002 higher. Planet 0.075 higher (O1 is Climate Label certified) and Distance 0.073 lower (online against 0.4 mi) nearly cancel.'],
    [gapSentence(pick(sm, 'n4,o9'), sm.n4), 'Against N4 Example Home Center: O9 Example Big Box Online is 0.070 lower. People 0.075 higher (N4 has a Governance finding) and Planet 0.075 lower (O9 has an Environmental finding) cancel; the 0.070 is Distance (online against 0.8 mi).'],
    [gapSentence(pick(fm, 'n1,n6'), fm.n1), 'Against N1 Example Kitchen Supply: N6 Example Home Center is 0.359 lower, mostly People (0.262 lower: N6 has 2 findings, N1 has 2 certifications), then Planet (0.094 lower: N6 has an Environmental finding, N1 is a 1% for the Planet member).'],
    [gapSentence(pick(fm, 'o2,o3'), fm.o2), 'O3 Example Kitchen Online has the same score as O2 Example Cast Iron Works. People 0.075 higher (O3 is a B Corp) and Planet 0.075 lower (O2 is a 1% for the Planet member) cancel.'],
    [gapSentence(pick(fm, 'n1,n6,o1,o10'), fm.n1), 'Largest gap from N1 Example Kitchen Supply: O10 Example Big Box Online is 0.523 lower, mostly People (0.300 lower: O10 has 2 findings, N1 has 2 certifications), then Planet (0.150 lower: O10 has an Environmental finding, N1 is a 1% for the Planet member).'],
    [unknownSentence(pick(sm, 'o2,o3'), sm.o2), 'Nothing is on file for people or planet for any of these 2.'],
  ];
  ['n2 -0.006 Dist.', 'n3 -0.011 Dist.', 'n4 -0.078 People', 'n5 -0.135 Sells', 'o1 +0.002 mixed'].forEach((s) => {
    const [id, num, tag] = s.split(' ');
    const g = gap(sm[id], sm.n1);
    want.push([`${id} ${fmtSigned3(g.score)} ${againstTag(g).tag}`, `${id} ${num} ${tag}`]);
  });
  // Against N4, O9's gap is all Distance and O2 to O8 are a near-cancel of People and Distance.
  ['o9 -0.070 mixed', 'o2 +0.005 mixed'].forEach((s) => {
    const [id, num, tag] = s.split(' ');
    const g = gap(sm[id], sm.n4);
    want.push([`${id} ${fmtSigned3(g.score)} ${againstTag(g).tag}`, `${id} ${num} ${tag}`]);
  });
  // "Why here" against the spec's worked line, and the sparse metro counts the header notes and rail print.
  const smSearch = { key: 'sparse-metro', response: SEARCHES['sparse-metro'].response, request: SEARCHES['sparse-metro'].request };
  const base = parseHash('#view=results');
  want.push([whyHereLine2(base, smSearch, sm.n4),
    'Against N3 Example Cookware and Cutlery Supply - Example City, the shop above in Near you (sorted by score): score 0.067 lower. People 0.075 lower (N4 has a Governance finding). Distance 0.008 higher (1.4 mi closer).']);
  const wh = (h) => whyHereLine2(parseHash(h), smSearch, sm.n4);
  const o8 = 'Against O8 Example Chef Supply, the shop above in this list (sorted by score): score 0.005 lower. People 0.075 lower (N4 has a Governance finding). Distance 0.070 higher (0.8 mi against online).';
  want.push([wh('#view=results&group=none'), o8]);
  want.push([whyHereLine2(base, smSearch, sm.n1), 'Against N2 Example Restaurant Supply, the shop below in Near you (sorted by score): score 0.006 higher. Distance 0.006 higher (0.9 mi closer).']);
  want.push([wh('#view=results&f=finding&kind=near'), 'The only shop shown in Near you.']);
  want.push([wh('#view=results&group=none&within=3&people=down'), 'The only shop shown.']);
  want.push([wh('#view=results&f=nofinding'), 'With filters off: Against N3 Example Cookware and Cutlery Supply - Example City, the shop above in Near you (sorted by score): score 0.067 lower. People 0.075 lower (N4 has a Governance finding). Distance 0.008 higher (1.4 mi closer).']);
  want.push([wh('#view=results&group=none&f=nofinding'), 'With filters off: ' + o8]);
  const savedCtx = rowCtx;
  rowCtx = { mode: '', ref: null, full: false };
  const bands = getRows(base, smSearch);
  const notes = ['sells', 'dist', 'people', 'planet', 'score', 'record'].map((k) => headerNote(k, bands).text).join(' | ');
  rowCtx = savedCtx;
  want.push([notes, '13 likely or named | 0.4 to 6.3 mi | 18 unknown | 17 unknown | 7 tied at 0.63 | unknown for 16 of 19']);
  const all = shopsOf(smSearch);
  const counts = ['cert', 'finding', 'nofinding', 'chain', 'nochain', 'sure'].map((f) => countWith(all, base, { f: [f] }))
    .concat(['up', 'down'].map((v) => countWith(all, base, { people: v })), ['up', 'down'].map((v) => countWith(all, base, { planet: v })));
  want.push([counts.join(','), '1,2,17,6,13,13,0,1,1,1']);
  // The Data switch carries ids by domain (spec section 10's sparse-to-filled table).
  const carry = (ids) => carryIds('sparse-metro', 'filled-metro', ids.split(',')).join(',');
  want.push([carry('n1,n4,o1'), 'n1,n6,o1']);
  want.push([carry('n5,n6'), 'n7,n8']);
  want.push([carry('n2,n3,n7,n8,n10,o9,o10'), 'n5,n2,n11,n10,o10,o9']);
  want.push([carryIds('filled-metro', 'sparse-metro', ['n6', 'n3', 'f12', 'o10']).join(','), 'n4,o9']);
  want.forEach(([got, exp]) => { if (got !== exp) console.error(`text check: got "${got}", spec says "${exp}"`); });
}

buildShell();
// The data and wording checks run only with marks=1, the view that shows the departures, so a plain load does no extra work.
if (state.marks === '1') { selfCheck(); textCheck(); }
// The entry the page loads on is a plain place to return to; a reload keeps its own history state.
if (!histState()) history.replaceState({ ov: 0, clean: true }, '');
render();</script>
