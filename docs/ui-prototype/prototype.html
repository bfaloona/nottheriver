// Data keeps every key but a numbered dispute, and carries shop, cmp and ref to the same shops; Place changes the search
// itself, so it clears them and closes a panel that showed one of them.
function switchProto(key, value) {
  if (key === 'theme') { setState({ theme: value }); return; }
  if (key === 'data') {
    const from = state.data + '-' + state.place, to = value + '-' + state.place;
    if (from === to) return;
    const patch = Object.assign({ data: value, cmp: carryIds(from, to, state.cmp),
      ref: state.ref ? carryId(from, to, state.ref) : '' }, carryOpen(state, from, to));
    const closes = ((cur.panel === 'shop' || cur.panel === 'chosen') && !patch.shop)
      || (cur.panel === 'compare' && patch.cmp.length < 2);
    if (!(closes && stepBackWith(patch))) setState(patch);
    return;
  }
  if (key === 'place' && value !== state.place) {
    // On About, sec is the section being read; only a shop panel's sec belongs to the old search.
    const patch = { place: value, shop: '', cmp: [], ref: '', dispute: 'none', sec: SECS.shop.includes(state.sec) ? '' : state.sec };
    if (['shop', 'chosen', 'compare'].includes(state.panel)) {
      patch.panel = 'none';
      if (stepBackWith(patch)) return;
    }
    setState(patch);
  }
}

// A switch or a removal that closes the open panel steps back to the plain list under it, as Close
// does, so no entry for a panel that can no longer show is left above the list. The list entry
// takes the patch through the Back carry. False when there is no such entry to step back to.
function stepBackWith(patch) {
  const hs = histState();
  if (!(hs && hs.ov > 0 && hs.clean && cur.sheet === 'none')) return false;
  state = Object.assign({}, state, patch);
  history.go(-hs.ov);
  return true;
}

// Narrow only: the sticky row of four chips under the top bar.
function renderChips(st, search) {
  const row = document.getElementById('chiprow');
  if (st.view !== 'results' || isMessage(search) || layout() !== 'narrow') { row.hidden = true; row.innerHTML = ''; return; }
  const nf = activeFilters(st).length;
  const sel = (id, label, key, opts, d) => `<span class="cchip cchip-${key}" data-d="${d}"><span class="chl" aria-hidden="true">${label}</span>`
    + `<select id="${id}" data-chip="${key}" aria-label="${label}">`
    + opts.map(([v, t]) => `<option value="${v}"${st[key] === v ? ' selected' : ''}>${t}</option>`).join('') + '</select></span>';
  row.innerHTML = `<button type="button" class="cchip" id="chip-filters" aria-label="Filters, ${nf ? nf + ' on' : 'none'}"><span class="chl">Filters</span><span class="chv">${nf ? nf + ' on' : 'none'}</span></button>`
    // The chips hold the narrow forms of the D2 part sorts and the D3 one list.
    + sel('chip-sort', 'Sort', 'sort', Object.keys(SORT_NAME).map((k) => [k, SORT_NAME[k]]), 'D2')
    + sel('chip-group', 'Group', 'group', [['kind', 'By kind'], ['none', 'One list']], 'D3')
    + '<button type="button" class="cchip" id="chip-about" aria-label="About this search"><span class="chl">About</span><span class="chv">this search</span></button>';
  row.hidden = false;
}

/* ======================================================================
   Render: the filter rail (docked at wide, or inside the Filters sheet)
   ====================================================================== */
// Counts follow the filter-count rule: rows the list would show with that choice made and
// every other active filter kept, so a zero is visible before it is pressed.
function countWith(all, st, patch) {
  const t = Object.assign({}, st, patch);
  return all.filter((vm) => passes(vm, t)).length;
}

function railCheck(p, rk, value, label, opts) {
  const o = opts || {};
  const id = `${p}rk-${rk}-${value}`;
  return `<label class="rchk" for="${id}"${o.title ? ` title="${esc(o.title)}"` : ''}${o.d ? ` data-d="${o.d}"` : ''}>`
    + `<input type="checkbox" id="${id}" data-rk="${rk}" value="${value}"${o.checked ? ' checked' : ''}${o.off ? ' disabled' : ''}>`
    + `<span class="rt">${esc(label)}</span>`
    + (o.count != null ? `<span class="rn">${o.count}</span>` : '') + '</label>';
}

function railSelect(p, rk, label, options, value, opts) {
  const o = opts || {};
  const id = `${p}rk-${rk}`;
  const cur = options.find(([v]) => v === value);
  // A chosen option can be wider than the closed select; its title carries the full words.
  return `<div class="rfield"${o.d ? ` data-d="${o.d}"` : ''}><label class="rflab" for="${id}">${esc(label)}</label>`
    + `<select class="rsel" id="${id}" data-rk="${rk}"${o.off ? ' disabled' : ''}${cur ? ` title="${esc(cur[1])}"` : ''}>`
    + options.map(([v, t]) => `<option value="${v}"${v === value ? ' selected' : ''}>${esc(t)}</option>`).join('')
    + '</select></div>';
}

// p prefixes every id so the docked rail and the sheet never share one.
function railHtml(st, search, p) {
  // Counts and the plot need shops; a message state keeps the controls, as the start view does.
  const live = st.view === 'results' && search && search.response && !isMessage(search);
  const off = st.view === 'searching';
  // With no rows a filter changes nothing, so only Group and Show, which carry into the next search, stay live.
  const noRows = off || (st.view === 'results' && !live);
  const all = live ? shopsOf(search) : [];
  const cnt = (patch) => (live ? countWith(all, st, patch) : null);
  const kindCount = (sec) => (live ? all.filter((vm) => vm.sec === sec
    && passes(vm, Object.assign({}, st, { kind: ALL_KINDS.slice() }))).length : null);
  const fOn = (f) => st.f.includes(f);
  const fBox = (f, opts) => railCheck(p, 'f', f, F_LABEL[f], Object.assign({ checked: fOn(f), off: noRows,
    count: cnt({ f: fOn(f) ? st.f : st.f.concat(f) }) }, opts || {}));

  let html = '';
  if (st.view === 'start') html += '<p class="rnote">Set what matters before you search. These carry into your results.</p>';

  html += `<fieldset class="rset"><legend>Group</legend><div class="rseg" role="radiogroup" aria-label="Group">`
    + [['kind', 'By kind'], ['none', 'One list']].map(([v, t]) => {
      const id = `${p}rk-group-${v}`;
      return `<label for="${id}" class="${st.group === v ? 'on' : ''}"${v === 'none' ? ' data-d="D3"' : ''}>`
        + `<input type="radio" id="${id}" name="${p}group" data-rk="group" value="${v}"${st.group === v ? ' checked' : ''}${off ? ' disabled' : ''}>${t}</label>`;
    }).join('') + '</div></fieldset>';

  html += '<fieldset class="rset"><legend>Show</legend>'
    + ALL_KINDS.map((k) => railCheck(p, 'kind', k, SEC_LABEL[k], { checked: st.kind.includes(k), off, count: kindCount(k) })).join('')
    + '</fieldset>';

  // The side-effect note: ticking "Not on the chain list" can also empty every finding from the list.
  let chainNote = '';
  if (fOn('nochain') && live) {
    const withFinding = all.filter((vm) => vm.finds.length);
    if (withFinding.length && withFinding.every((vm) => vm.chain)) {
      chainNote = withFinding.length === 1
        ? 'This also hides the one shop with a finding here: it is on the chain list.'
        : `This also hides every shop with a finding here: all ${withFinding.length} are on the chain list.`;
    }
  }
  html += '<fieldset class="rset"><legend>Record</legend>'
    + fBox('record', { d: 'D2', title: 'Has a certification or a finding. A chain fact or a retailer association membership is not a record.' })
    + fBox('cert', { title: 'Counts the five scored kinds. Retailer association membership is not counted.' })
    + fBox('finding', { d: 'D2' }) + fBox('nofinding', { d: 'D2' })
    + fBox('chain', { d: 'D2' }) + fBox('nochain', { d: 'D2' })
    + (chainNote ? `<p class="rsub">${esc(chainNote)}</p>` : '')
    + '</fieldset>';

  html += '<fieldset class="rset"><legend>Sells it</legend>'
    + fBox('sure', { d: 'D2', title: "Judged likely, or named in the shop's listing" }) + '</fieldset>';

  let withinNote = '';
  if (st.within !== 'any') {
    withinNote = 'Online shops have no distance and stay unless Online is off.';
    const noDist = live ? all.filter((vm) => vm.sec !== 'online' && vm.km == null).length : 0;
    if (noDist) withinNote += ` ${noDist} ${plural(noDist, 'shop with no distance given is', 'shops with no distance given are')} hidden.`;
  }
  html += '<fieldset class="rset"><legend>Distance</legend>'
    + railSelect(p, 'within', 'Within', [['any', 'Any distance']].concat(['1', '3', '5', '10', '25'].map((m) => [m, m + ' mi'])), st.within, { d: 'D2', off: noRows })
    + (withinNote ? `<p class="rsub">${esc(withinNote)}</p>` : '') + '</fieldset>';

  // Short words fit the 150 px select; the key above them names each mark the rows draw.
  const partOpts = (part) => [['any', 'Any']].concat(['up', 'down'].map((v) => {
    const n = cnt({ [part]: v });
    const t = v === 'up' ? 'Raised' : 'Lowered';
    return [v, n == null ? t : `${t} (${n})`];
  }));
  html += '<fieldset class="rset"><legend>People and Planet</legend>'
    + '<p class="mkey" title="In the People and Planet columns: a ring on the middle tick is unknown and counts as 0.50; a solid bar is raised by a certification; a hatched bar is lowered by a finding.">'
    + '<span><i class="mk ring" aria-hidden="true"></i>unknown</span><span><i class="mk up" aria-hidden="true"></i>raised</span>'
    + '<span><i class="mk dn" aria-hidden="true"></i>lowered</span></p>'
    + railSelect(p, 'people', 'People', partOpts('people'), st.people, { d: 'D2', off: noRows })
    + railSelect(p, 'planet', 'Planet', partOpts('planet'), st.planet, { d: 'D2', off: noRows })
    + '</fieldset>';

  const nActive = activeFilters(st).length;
  html += `<div class="rclear"><button type="button" class="btn small" data-act="clearfilters"${noRows || !nActive ? ' disabled' : ''}>Clear filters</button></div>`;

  if (live) {
    const r = search.response.query.near_radius_mi;
    const shown = all.filter((vm) => passes(vm, st));
    html += `<div class="rplot" data-d="D4"><p class="rlab">Where · not to scale past ${r} mi</p>`
      + `<div class="plot">${plotSvg(search, 152, (st.panel === 'shop' || st.panel === 'chosen') ? st.shop : '', shown)}</div></div>`;
  }
  return `<div class="rail-in">${html}</div>`;
}

function renderRail(st, search) {
  const rail = document.getElementById('rail');
  // On Start the rail follows the form in the page order, so Tab reaches the product field first;
  // the grid keeps it in the left column either way.
  const before = document.getElementById(st.view === 'start' ? 'panel' : 'col');
  if (rail.nextElementSibling !== before) rail.parentNode.insertBefore(rail, before);
  // About puts its section index in the rail's place.
  rail.setAttribute('aria-label', st.view === 'about' ? 'Section index' : 'Filters');
  if (st.view === 'about') { rail.innerHTML = aboutIndex(st); return; }
  const keep = rail.scrollTop;
  rail.innerHTML = railHtml(st, search, '');
  rail.scrollTop = keep;
}

/* ======================================================================
   Render: the Filters sheet (the rail, wherever it is folded)
   ====================================================================== */
function sheetVisible() {
  const sh = document.getElementById('sheet');
  return !sh.hidden && getComputedStyle(sh).display !== 'none';
}

function renderSheet(st, search) {
  const sh = document.getElementById('sheet');
  const kind = st.sheet === 'filters' && (st.view === 'results' || st.view === 'start') ? 'filters'
    : st.sheet === 'edit' && (st.view === 'results' || st.view === 'searching') ? 'edit' : '';
  if (!kind) {
    sh.hidden = true; sh.innerHTML = ''; sh.className = 'sheet'; sh.dataset.kind = '';
    document.documentElement.classList.remove('sheet-open');
    return;
  }
  // The frame is built once per opening so the slide-in does not replay on every redraw.
  if (sh.hidden || sh.dataset.kind !== kind || !sh.querySelector('.sheetbody')) {
    sh.innerHTML = '<div class="scrim" data-act="sheetclose"></div>'
      + '<div class="sheetbox" role="dialog" aria-modal="true" aria-labelledby="sheet-h">'
      + `<div class="sheethead"><h2 id="sheet-h" tabindex="-1">${kind === 'edit' ? 'Search' : 'Filters'}</h2>`
      + '<button type="button" class="btn small" data-act="sheetclose">Close</button></div>'
      + '<div class="sheetbody"></div>'
      + (kind === 'filters' ? '<div class="sheetfoot"></div>' : '') + '</div>';
    sh.dataset.kind = kind;
    // The form's inputs are built once per opening, so a redraw never wipes what is typed.
    if (kind === 'edit') sh.querySelector('.sheetbody').innerHTML = editForm(search);
  }
  if (kind === 'filters') {
    const body = sh.querySelector('.sheetbody');
    const keep = body.scrollTop;
    body.innerHTML = railHtml(st, search, 's-');
    body.scrollTop = keep;
    // A thumb-height bar: what the list will show, which also closes the sheet, and Clear.
    const live = st.view === 'results' && search.response && !isMessage(search);
    const all = live ? shopsOf(search) : [];
    const shown = all.filter((vm) => passes(vm, st)).length;
    const nActive = activeFilters(st).length;
    sh.querySelector('.sheetfoot').innerHTML =
      `<button type="button" class="btn primary" data-act="sheetclose">${live ? `Show ${shown} of ${all.length} shops` : 'Done'}</button>`
      + `<button type="button" class="btn" data-act="clearfilters"${nActive ? '' : ' disabled'}>Clear</button>`;
  } else {
    const b = document.getElementById('esearch');
    const paused = search.state === 'budget';
    b.textContent = paused ? 'Search (paused)' : 'Search';
    b.disabled = paused || st.view === 'searching';
  }
  sh.className = 'sheet sheet-' + kind;
  sh.hidden = false;
  document.documentElement.classList.toggle('sheet-open', sheetVisible());
}

// The search form as a sheet at narrow: full labels above 44 px fields, no name attributes,
// so neither the product nor the zip can reach a URL.
function editForm(search) {
  return '<form class="eform" id="eform" novalidate role="search">'
    + '<div class="field"><label for="eq">What are you looking for</label>'
    + `<input id="eq" type="text" maxlength="120" autocomplete="off" spellcheck="false" value="${esc(form.q || search.query.product)}">`
    + '<p class="ferr" id="eq-err" hidden></p></div>'
    + '<div class="field"><label for="ez">Zip code</label>'
    + `<input id="ez" type="text" inputmode="numeric" maxlength="5" autocomplete="off" value="${esc(form.z)}">`
    + '<p class="ferr" id="ez-err" hidden></p></div>'
    + '<p class="note">Your zip stays in this browser. Sent instead: city, state, the center of your zip area and how rural it is.</p>'
    + '<button class="btn primary big" id="esearch" type="submit">Search</button>'
    + '</form>';
}

/* ======================================================================
   Render: the drawn plot (D4)
   Straight lines from the zip-area center: near shops to scale inside the inner ring,
   farther shops between the rings at their direction, not to scale. Nothing is fetched.
   ====================================================================== */
// list: the shops to draw (default every shop of the search). focusId: the shop drawn in accent.
function plotSvg(search, size, focusId, list) {
  const S = size;
  const c = S / 2;
  const small = S < 120;
  const ro = c - (small ? 11 : 14);
  // With no farther shop the band between the rings would stay empty, so the near ring takes it
  // and the 100 mi ring is left as a thin edge.
  const noFar = !shopsOf(search).some((vm) => vm.sec === 'far');
  const ri = noFar ? ro - (small ? 3 : 4) : Math.round(ro * 0.66);
  const r = search.response.query.near_radius_mi;
  const center = search.request;
  const shops = (list || shopsOf(search)).filter((vm) => vm.sec !== 'online');
  const focus = focusId ? byIdOf(search)[focusId] : null;
  if (focus && focus.sec !== 'online' && !shops.includes(focus)) shops.push(focus);
  const placed = shops.filter((vm) => vm.km != null && vm.res.lat != null && vm.res.lon != null);
  const missing = shops.filter((vm) => !placed.includes(vm));

  const pts = placed.map((vm) => {
    const mi = milesOf(vm.km);
    const rr = mi <= r ? ri * mi / r : ri + (ro - ri) * Math.min(1, (mi - r) / (100 - r));
    const dy = vm.res.lat - center.lat;
    const dx = (vm.res.lon - center.lon) * Math.cos(center.lat * Math.PI / 180);
    const a = Math.atan2(dx, dy);
    return { vm, a, x: c + rr * Math.sin(a), y: c - rr * Math.cos(a) };
  });
  // Dots closer than 7 px are pushed apart along the line between them, so each stays its own mark,
  // and none sits on the center square: a dot that does moves out along its own bearing.
  const GAP = 7, CLEAR = 6;
  for (let pass = 0; pass < 24; pass++) {
    let moved = false;
    pts.forEach((p) => {
      const d = Math.hypot(p.x - c, p.y - c);
      if (d >= CLEAR) return;
      p.x = c + CLEAR * Math.sin(p.a); p.y = c - CLEAR * Math.cos(p.a);
      moved = true;
    });
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        let dx = pts[j].x - pts[i].x, dy = pts[j].y - pts[i].y;
        let d = Math.hypot(dx, dy);
        if (d >= GAP) continue;
        if (d < 0.01) { dx = Math.cos(j); dy = Math.sin(j); d = 1; }
        const push = (GAP - d) / 2 + 0.05;
        pts[i].x -= dx / d * push; pts[i].y -= dy / d * push;
        pts[j].x += dx / d * push; pts[j].y += dy / d * push;
        moved = true;
      }
    }
    if (!moved) break;
  }
  // A label goes to whichever side of its dot covers the fewest other dots and stays in the box.
  const labelAt = (p) => {
    const w = 7 * p.vm.id.length + 2;
    const sides = [
      { x: p.x + 8, y: p.y + 4, anchor: 'start', box: [p.x + 8, p.y - 6, p.x + 8 + w, p.y + 6] },
      { x: p.x - 8, y: p.y + 4, anchor: 'end', box: [p.x - 8 - w, p.y - 6, p.x - 8, p.y + 6] },
      { x: p.x, y: p.y - 8, anchor: 'middle', box: [p.x - w / 2, p.y - 18, p.x + w / 2, p.y - 6] },
      { x: p.x, y: p.y + 16, anchor: 'middle', box: [p.x - w / 2, p.y + 5, p.x + w / 2, p.y + 17] },
    ];
    const cost = (s) => {
      const [x1, y1, x2, y2] = s.box;
      const out = x1 < 1 || y1 < 1 || x2 > S - 1 || y2 > S - 1 ? 100 : 0;
      const hits = pts.filter((q) => q !== p && q.x > x1 - 3 && q.x < x2 + 3 && q.y > y1 - 3 && q.y < y2 + 3).length;
      const onCenter = c > x1 - 2 && c < x2 + 2 && c > y1 - 2 && c < y2 + 2 ? 1 : 0;
      return out + hits * 2 + onCenter;
    };
    return sides.reduce((best, s) => (cost(s) < cost(best) ? s : best));
  };
  const dots = pts.map((p) => {
    const isFocus = focus && p.vm.id === focus.id;
    const l = labelAt(p);
    return `<g class="dot${isFocus ? ' focus' : ''}" data-id="${p.vm.id}">`
      + `<circle class="halo" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6"/>`
      + `<circle class="d" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3"/>`
      + `<text class="plot-txt dl" x="${l.x.toFixed(1)}" y="${l.y.toFixed(1)}" text-anchor="${l.anchor}">${p.vm.id.toUpperCase()}</text></g>`;
  });
  // Focus last so its dot and label sit on top.
  dots.sort((a, b) => (a.includes('dot focus') ? 1 : 0) - (b.includes('dot focus') ? 1 : 0));

  // Ring labels sit north-west, the direction the made-up shops use least, so dots rarely cover them.
  // With the rings 4 px apart the 100 mi label moves to the box's lower right corner, outside both.
  const nw = (rad) => [(c - rad * 0.7071).toFixed(1), (c - rad * 0.7071 + 4).toFixed(1)];
  const ringLabels = small ? '' :
    `<text class="plot-txt ringl" x="${nw(ri)[0]}" y="${nw(ri)[1]}" text-anchor="middle">${r} mi</text>`
    + (noFar ? `<text class="plot-txt ringl" x="${S - 4}" y="${S - 5}" text-anchor="end">100 mi</text>`
      : `<text class="plot-txt ringl" x="${nw(ro)[0]}" y="${nw(ro)[1]}" text-anchor="middle">100 mi</text>`);
  const desc = 'Where the shops are. Straight lines from the center of your zip area, not from you. Not a street map.'
    + ` The inner ring is ${r} mi, drawn to scale; the dashed ring is 100 mi, and shops between the rings are not to scale.`;
  const svg = `<svg class="plotsvg" viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img" aria-label="${esc(desc)}">`
    + `<rect class="plot-bg" x="0.5" y="0.5" width="${S - 1}" height="${S - 1}" rx="3"/>`
    + `<circle class="plot-ring far" cx="${c}" cy="${c}" r="${ro}"/>`
    + `<circle class="plot-ring" cx="${c}" cy="${c}" r="${ri}"/>`
    + ringLabels
    + `<text class="plot-txt plot-n" x="${c}" y="${small ? 10 : 11}" text-anchor="middle">N</text>`
    + `<rect class="plot-c" x="${c - 2}" y="${c - 2}" width="4" height="4"/>`
    + dots.join('') + '</svg>';

  let cap = '';
  // Only the opened shop's own Where plot speaks about that shop; the rail keeps the count.
  if (small && focus && missing.includes(focus)) cap = 'This shop has no position, so it is not drawn.';
  else if (!small && missing.length) {
    cap = missing.length === 1 ? '1 shop without a position is not drawn.' : `${missing.length} shops without a position are not drawn.`;
  }
  return svg + (cap ? `<p class="plotcap">${esc(cap)}</p>` : '');
}

// Rings the plot dot of the row under the pointer or holding focus.
function ringDot(id) {
  document.querySelectorAll('.rplot .dot.on').forEach((g) => { if (g.dataset.id !== id) g.classList.remove('on'); });
  if (id) document.querySelectorAll(`.rplot .dot[data-id="${id}"]`).forEach((g) => g.classList.add('on'));
}

/* ======================================================================
   Panel: About this search
   ====================================================================== */
const LEFT_OUT = [
  ['sells_product', 'does not sell it', 'do not sell it'],
  ['site_type', 'not a shop', 'not a shop'],
  ['place_category', 'the wrong kind of place', 'the wrong kind of place'],
  ['editorial_url', 'an article, not a shop', 'articles, not shops'],
  ['below_top_10', 'not in the top 10', 'not in the top 10'],
  ['branch_cap', 'more branch of a company already shown', 'more branches of companies already shown'],
  ['too_far', 'more than 100 mi away', 'more than 100 mi away'],
];
const ACCURACY_FULL = 'In tests, about 62 to 64% of nearby shops shown really sold the product, and 98% of online shops. '
  + 'Measured 2026-09-26 on 20 graded searches, each run twice. No separate figure exists for farther shops.';

function searchPanel(st, search) {
  const resp = search.response;
  if (!resp) return '';
  const q = resp.query;
  const u = resp.usage;
  const quoted = (arr) => arr.map((s) => `“${esc(s)}”`).join(', ');
  const nNear = resp.local.length, nFar = (resp.local_farther || []).length, nOn = resp.online.length;
  const dropped = resp.dropped || [];
  const notJudged = u.unclassified_shown ? (u.unclassified_shown.online || 0) + (u.unclassified_shown.local || 0) : 0;
  const reasonRows = LEFT_OUT.map(([key, one, many]) => {
    const ds = dropped.filter((d) => d.reason === key);
    if (!ds.length) return '';
    return `<tr role="row"><th role="rowheader" scope="row"><span class="lon">${ds.length}</span> ${esc(ds.length === 1 ? one : many)}</th>`
      + `<td role="cell">${ds.map((d) => `<span class="ldom">${esc(d.domain)}</span>`).join(' ')}</td></tr>`;
  }).join('');
  const line = (lead, body) => `<p class="aline"><b>${lead}:</b> ${body}</p>`;
  return '<div class="pnav"><h2 id="panel-h" tabindex="-1">About this search</h2>'
    + closeBtn() + '</div>'
    + '<div class="pbody asearch">'
    + (search.state === 'thin' ? '<section class="ablock thinfirst" aria-labelledby="h-thin"><h3 id="h-thin">Why so few nearby?</h3>'
      + thinLines(search).map(([b, t]) => `<p class="aline"><b>${b}:</b> ${esc(t)}</p>`).join('') + '</section>' : '')
    + '<section class="ablock" aria-label="How the search read your words">'
    + line('Read as', `${esc(q.canonical_name)} (${esc(q.category)}).`)
    + `<p class="aline"><b>Searched online for:</b> ${quoted(q.online_queries)}. <b>Nearby for:</b> ${quoted(q.local_queries)}.</p>`
    + '</section>'
    + '<section class="ablock" aria-label="What it found">'
    + line('Found', `${nNear} near you (within ${q.near_radius_mi} mi of the center of your zip area), ${nFar} farther, ${nOn} online.`)
    + `<p class="aline muted">${ACCURACY_FULL}</p></section>`
    + '<section class="ablock" aria-label="What was left out">'
    + line('Left out', `${dropped.length} ${plural(dropped.length, 'site')}.`)

    + (notJudged ? line('Not judged', `${notJudged}.`) : '')
    + '</section>'
    + '<section class="ablock" aria-label="Cost">'

    + '</section>'
    + `<section class="ablock" aria-labelledby="h-aplot" data-d="D4"><h3 class="rlab" id="h-aplot">Where · not to scale past ${q.near_radius_mi} mi</h3>`
    + `<div class="plot plot296">${plotSvg(search, 296, '')}</div>`
    + '<p class="plotdesc">Straight lines from the center of your zip area, not from you. Not a street map.</p></section>'
    + '</div>';
}

/* ======================================================================
   Panel: shared text (sum line, gap sentence, part reasons)
   Pure functions of the data, checked against the spec's worked strings at boot.
   ====================================================================== */
const SELLS_WORDS = { likely: 'likely sells it', may: 'may sell it', named: 'named in listing', category: 'category only', unconfirmed: 'not confirmed' };
const SELLS_SHORT = { likely: 'Likely', may: 'May', named: 'Named', category: 'Category only', unconfirmed: 'Not confirmed' };
const SELLS_KNOWN = { likely: 'Likely sells it, a guess', may: 'May sell it, a guess', named: 'Listing names the product',
  category: 'Listing names only the category', unconfirmed: 'Not confirmed' };
const SORT_WORD = { score: 'score', distance: 'distance', name: 'name', sells: 'sells it', people: 'people', planet: 'planet' };
const SEC_PHRASE = { near: 'near you', far: 'farther away', online: 'online' };
const PART_DATA = { people: 'ethics', planet: 'env' };

function rankLabel(vm) { return vm.id.toUpperCase() + ' ' + vm.name; }
function hl(x) { return x > 0 ? 'higher' : 'lower'; }

function sumLine(vm) { return sumParts(vm).join(''); }
// [the four parts added, the rest]; at narrow the parts sit in their own rows above, so only the rest shows.
function sumParts(vm) {
  const cs = PART_KEYS.map((k) => vm.parts[k].contribution);
  const sum = round3(cs.reduce((a, b) => a + b, 0));
  const left = cs.map(fmt3).join(' + ') + ' ';
  if (th(sum - vm.score) === 0) return [left, `= ${fmt3(sum)}, shown as ${fmt2(vm.score)}.`];
  return [left, `= ${fmt3(sum)}. The score is ${fmt3(vm.score)}, shown as ${fmt2(vm.score)}: each part is rounded, `
    + `so the sum misses by ${fmt3(Math.abs(sum - vm.score))}.`];
}
function sumLineHtml(vm) { const [l, r] = sumParts(vm); return `<span class="slp">${esc(l)}</span>${esc(r)}`; }

// The facts that move People or Planet, keyed so the same fact on two shops matches.
function partFacts(vm, part) {
  const p = PART_DATA[part];
  const m = new Map();
  vm.certs.filter((c) => CERT_PART[c.kind] === p).forEach((c) => m.set('c:' + c.kind, { cert: true, clause: CERT_CLAUSE[c.kind] }));
  vm.finds.filter((f) => FIND_PART[f.kind] === p).forEach((f) => m.set('f:' + f.kind + ':' + f.action_date,
    { cert: false, clause: `has ${f.kind === 'environmental' ? 'an' : 'a'} ${FIND_KIND[f.kind]} finding` }));
  return m;
}
// One cert or finding reads as a clause; a shop is never described by a fact another shop holds.
const CERT_CLAUSE = { b_corp: 'is a B Corp', fair_trade: 'sells Fair Trade Certified products', worker_coop: 'is a worker co-op',
  one_percent_planet: 'is a 1% for the Planet member', climate_neutral: 'is Climate Label certified' };
function ownerClause(vm, facts) {
  const id = vm.id.toUpperCase();
  if (facts.length === 1) return `${id} ${facts[0].clause}`;
  const c = facts.filter((f) => f.cert).length, f = facts.length - c;
  const bits = [];
  if (c) bits.push(`${c} ${plural(c, 'certification')}`);
  if (f) bits.push(`${f} ${plural(f, 'finding')}`);
  return `${id} has ${bits.join(' and ')}`;
}

function fmtMileGap(x) { return x < 9.95 ? x.toFixed(1) : String(Math.round(x)); }

// The words in brackets after a part's difference: what about the two shops makes it.
function partReason(part, shop, ref) {
  if (part === 'sells') {
    if (shop.sells === ref.sells) return '';
    const sg = shop.sec !== 'online', rg = ref.sec !== 'online';
    // A nearby level is a guess and a listing check is not; the words say which side is which.
    if (sg && rg) return `${SELLS_WORDS[shop.sells]} against ${SELLS_WORDS[ref.sells]}, both guesses`;
    return `${SELLS_WORDS[shop.sells]}${sg ? ', a guess,' : ''} against ${SELLS_WORDS[ref.sells]}${rg ? ', a guess' : ''}`;
  }
  if (part === 'dist') {
    const so = shop.sec === 'online', ro = ref.sec === 'online';
    if (so && ro) return '';
    if (so) return ref.km == null ? 'online against distance not given' : `online against ${fmtMilesNum(ref.km)} mi`;
    if (ro) return shop.km == null ? 'distance not given against online' : `${fmtMilesNum(shop.km)} mi against online`;
    if (shop.km == null || ref.km == null) return 'distance not given';
    const d = Number(fmtMilesNum(shop.km)) - Number(fmtMilesNum(ref.km));
    if (Math.abs(d) < 0.05) return '';
    return `${fmtMileGap(Math.abs(d))} mi ${d > 0 ? 'farther' : 'closer'}`;
  }
  const a = partFacts(shop, part), b = partFacts(ref, part);
  const onlyA = [], onlyB = [];
  a.forEach((v, k) => { if (!b.has(k)) onlyA.push(v); });
  b.forEach((v, k) => { if (!a.has(k)) onlyB.push(v); });
  const out = [];
  if (onlyA.length) out.push(ownerClause(shop, onlyA));
  if (onlyB.length) out.push(ownerClause(ref, onlyB));
  return out.join(', ');
}

function partPhrase(k, g, shop, ref) {
  const r = partReason(k, shop, ref);
  return `${PART_NAMES[k]} ${fmt3(Math.abs(g[k]))} ${hl(g[k])}${r ? ` (${r})` : ''}`;
}

// Rule 3 of the gap sentence: the two largest parts pull opposite ways and nearly cancel.
function cancels(g) {
  const [A, B] = rankParts(g);
  return th(g[B]) > 0 && Math.sign(g[A]) !== Math.sign(g[B]) && th(g[A] + g[B]) * 5 <= th(g[A]);
}

// Section 6: the sentence about the picked shop farthest by score from the reference.
function gapSentence(picks, ref) {
  const others = picks.filter((v) => v.id !== ref.id);
  if (!others.length) return '';
  let pick = others[0], g = gap(pick, ref);
  others.slice(1).forEach((v) => { const gv = gap(v, ref); if (th(gv.score) > th(g.score)) { pick = v; g = gv; } });
  const shop = rankLabel(pick), refL = rankLabel(ref);
  const M = PART_KEYS.reduce((a, k) => a + th(g[k]), 0);
  if (M === 0) return `${shop} has the same score and the same four parts as ${refL}.`;
  const opening = (picks.length >= 3 ? 'Largest gap from ' : 'Against ') + refL + ': ';
  const order = rankParts(g);
  const A = order[0], B = order[1];
  const amt = fmt3(Math.abs(g.score));
  if (th(g[A]) * 5 >= M * 4) {
    const only = PART_KEYS.filter((k) => th(g[k]) > 0).length === 1;
    const r = partReason(A, pick, ref);
    return `${opening}${shop} is ${amt} ${hl(g.score)}, ${only ? 'all' : 'nearly all'} of it ${PART_NAMES[A]}${r ? ` (${r})` : ''}.`;
  }
  if (cancels(g)) {
    const pair = `${partPhrase(A, g, pick, ref)} and ${partPhrase(B, g, pick, ref)}`;
    // The equal-score form names the reference itself, so it takes no opening, like the M = 0 form.
    if (th(g.score) === 0) return `${shop} has the same score as ${refL}. ${pair} cancel.`;
    const verb = th(g[A] + g[B]) === 0 ? 'cancel' : 'nearly cancel';
    // When A and B cancel, the gap itself comes from what is left; name it, or the sentence explains nothing.
    const C = order.slice(2).find((k) => th(g[k]) > 0);
    if (!C) return `${opening}${shop} is ${amt} ${hl(g.score)}. ${pair} ${verb}.`;
    const r = partReason(C, pick, ref);
    const all = verb === 'cancel' && order.slice(2).filter((k) => th(g[k]) > 0).length === 1;
    return `${opening}${shop} is ${amt} ${hl(g.score)}. ${pair} ${verb}; the ${amt} is ${all ? '' : 'mostly '}${PART_NAMES[C]}${r ? ` (${r})` : ''}.`;
  }
  const mid = (k) => {
    const r = partReason(k, pick, ref);
    return `${PART_NAMES[k]} (${fmt3(Math.abs(g[k]))} ${hl(g[k])}${r ? ': ' + r : ''})`;
  };
  return `${opening}${shop} is ${amt} ${hl(g.score)}, mostly ${mid(A)}, then ${mid(B)}.`;
}

function unknownSentence(picks, ref) {
  if (!picks.every((v) => v.unknown)) return '';
  const n = picks.length;
  const allSame = picks.every((v) => { const g = gap(v, ref); return PART_KEYS.every((k) => th(g[k]) === 0); });
  if (allSame) return `Nothing is on file for people or planet for any of these ${n}.`;
  return `Nothing is on file for people or planet for any of these ${n}, so they differ only in sells-it level and distance.`;
}

function sameCompanyLine(picks) {
  const seen = {};
  const shared = picks.some((v) => { if (seen[v.domain]) return true; seen[v.domain] = 1; return false; });
  return shared ? 'Same company: 2 branches. Same record, different distance.' : '';
}

// "Why here" line 2: against one neighbor in the shop's own band as shown.
function whyHereLine2(st, search, vm) {
  let set, where, only;
  if (st.group === 'none') {
    set = getRows(st, search).filter((b) => b.key !== 'cmp').reduce((a, b) => a.concat(b.ordered), []);
    where = 'this list'; only = 'The only shop shown.';
  } else {
    const band = getRows(st, search).find((b) => b.sec === vm.sec);
    set = band ? band.ordered : [];
    where = SEC_LABEL[vm.sec]; only = `The only shop shown in ${SEC_LABEL[vm.sec]}.`;
  }
  let prefix = '';
  if (!set.some((v) => v.id === vm.id)) {
    // Hidden by filters: compare within its band (or the one list) as it would be with filters off.
    set = sortRows(shopsOf(search).filter((v) => st.group === 'none' || v.sec === vm.sec), st);
    if (st.group !== 'none') { where = SEC_LABEL[vm.sec]; only = `The only shop shown in ${SEC_LABEL[vm.sec]}.`; }
    prefix = 'With filters off: ';
  }
  if (set.length <= 1) return prefix + only;
  const i = set.findIndex((v) => v.id === vm.id);
  const above = i > 0;
  const nb = above ? set[i - 1] : set[i + 1];
  const g = gap(vm, nb);
  const first = (nb.sec === vm.sec ? nb.rank < vm.rank : ['near', 'far', 'online'].indexOf(nb.sec) < ['near', 'far', 'online'].indexOf(vm.sec)) ? nb : vm;
  if (th(g.score) === 0 && PART_KEYS.every((k) => th(g[k]) === 0)) {
    return prefix + `Same score and the same four parts as ${rankLabel(nb)}. The search's own order puts ${rankLabel(first)} first.`;
  }
  const head = `Against ${rankLabel(nb)}, the shop ${above ? 'above' : 'below'} in ${where} (sorted by ${SORT_WORD[st.sort]}): `;
  const sc = th(g.score) === 0 ? 'the same score.' : `score ${fmt3(Math.abs(g.score))} ${hl(g.score)}.`;
  const parts = rankParts(g).filter((k) => th(g[k]) > 0).map((k) => partPhrase(k, g, vm, nb) + '.');
  const tail = th(g.score) === 0 ? ` The search's own order puts ${first.id.toUpperCase()} first.` : '';
  return prefix + head + [sc].concat(parts).join(' ') + tail;
}

/* ======================================================================
   Panel: small parts (links out, dispute, icons, toast)
   ====================================================================== */
const DISPUTE_HOST = 'project-repo.example';
const DISPUTE_URL = WEB + DISPUTE_HOST + '/disputes/new';
const DISPUTE_NOTE = 'Disputes are filed on a public form on GitHub. It needs an account there, and what you file is public. '
  + 'Anyone can file, including the shop. How disputes are reviewed is not decided, and no response time is promised. Until then this stays as shown.';
const NOT_KNOWN = 'This site does not know stock, price, opening hours or delivery.';
const ICON_PREV = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
const ICON_NEXT = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
const ICON_CLOSE = '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';

// At narrow the panel is the page, so its way out reads as going back to the list.
function closeBtn() {
  return layout() === 'narrow'
    ? `<button type="button" class="btn small pclose" data-act="close" aria-label="Back to the list">${ICON_PREV}List</button>`
    : '<button type="button" class="btn small pclose" data-act="close">Close</button>';
}

function hostOf(url) { return String(url).replace(WEB, '').split('/')[0]; }

// Every link out is made up. It is a button that keeps its address in data-href, never an href,
// so no click, middle click or "open in new tab" can leave the page; activating it shows the toast.
function outLink(url, text, cls) {
  if (!url) return '';
  if (url.charAt(0) === '#') return `<a href="${esc(url)}"${cls ? ` class="${cls}"` : ''}>${esc(text)}</a>`;
  return `<button type="button" class="out${cls ? ' ' + cls : ''}" data-href="${esc(url)}">${esc(text)}</button>`;
}

function disputeBtn(st, key, label) {
  const open = st.dispute === key;
  return `<button type="button" class="tbtn" data-act="dispute" data-key="${key}" aria-expanded="${open}"${open ? ` aria-controls="dn-${key}"` : ''}>${label || 'Dispute'}</button>`;
}

function disputeNote(st, key) {
  if (st.dispute !== key) return '';
  return `<div class="dnote" id="dn-${key}"><p>${DISPUTE_NOTE}</p>${outLink(DISPUTE_URL, 'Open the dispute form', 'btn small linkbtn')}</div>`;
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  announce(msg);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 3200);
}
function hideToast() { document.getElementById('toast').classList.remove('on'); }
function toastOn() { return document.getElementById('toast').classList.contains('on'); }

function whereShort(vm) {
  if (vm.sec === 'online') return 'online';
  if (vm.km == null) return 'distance not given';
  return fmtMiles(vm.km) + (vm.dir ? ' ' + vm.dir : '');
}

/* ======================================================================
   Panel: an opened shop (section 5, blocks 1 to 9)
   ====================================================================== */
function tookOf(vm, part) {
  const p = PART_DATA[part];
  if (!vm.finds.some((f) => FIND_PART[f.kind] === p)) return 0;
  const base = Math.min(1, 0.5 + 0.25 * vm.certs.filter((c) => CERT_PART[c.kind] === p).length);
  return round4(base - vm.parts[part].value);
}

// The words in a part row: short for the common cases, so each row stays one line; the full rule is
// the words' title, and About sets it out.
function knownText(vm, k) {
  const c = vm.parts[k];
  if ((k === 'people' || k === 'planet') && !partFacts(vm, k).size) return 'unknown, counts as 0.50';
  if (k === 'dist' && vm.sec === 'online') return 'Online: 0.50 for all';
  if (k === 'dist' && vm.km != null && c.value > 0) return whereShort(vm);
  return knownLong(vm, k);
}
function knownLong(vm, k) {
  const c = vm.parts[k];
  if (k === 'sells') return SELLS_KNOWN[vm.sells];
  if (k === 'dist') {
    if (vm.sec === 'online') return 'Online: a fixed middle value, 0.50, the same for every online shop';
    if (vm.km == null) return 'Distance not given: adds 0. Missing data about position, not a finding about the shop.';
    if (c.value === 0) return `${fmtMilesNum(vm.km)} mi: past 25 mi, so this part adds 0. That is distance, not a finding.`;
    return `${fmtMilesNum(vm.km)} mi: 1.00 at the center of your zip area, falling to 0 at 25 mi`;
  }
  const p = PART_DATA[k];
  const certs = vm.certs.filter((x) => CERT_PART[x.kind] === p);
  const finds = vm.finds.filter((f) => FIND_PART[f.kind] === p);
  if (!certs.length && !finds.length) return 'unknown: nothing on file, counts as the middle (0.50)';
  const bits = certs.map((x) => `${CERT_LABEL[x.kind]} (+0.25)`);
  const byKind = {};
  finds.forEach((f) => { (byKind[f.kind] = byKind[f.kind] || []).push(f); });
  Object.keys(byKind).forEach((kind) => {
    const fs = byKind[kind];
    let cost = fs.reduce((a, f) => a + f.cost, 0);
    if (c.minor_cap_applied) cost = Math.min(cost, 0.25);
    bits.push(fs.length === 1 ? `${FIND_KIND[kind]} finding (-${fmtVal(cost)})` : `${fs.length} ${FIND_KIND[kind]} findings (-${fmtVal(cost)})`);
  });
  return bits.join(', ');
}

function partSources(vm, k) {
  const c = vm.parts[k];
  if (layout() === 'narrow') {
    // 44 px targets leave room for one link; more than one jumps to the Record block, where each fact links its own.
    if (!c.sources.length) return '';
    if (c.sources.length === 1) return outLink(c.sources[0].url, 'Source');
    return `<button type="button" class="tbtn" data-act="sources">${c.sources.length} sources</button>`;
  }
  return '';
}

// From 600 px the words are their own source link, so a part row is one line. People and Planet
// link each fact; their "Starts at 0.50" baseline is the link on the part's name.
function knownHtml(vm, k) {
  const c = vm.parts[k];
  const words = knownText(vm, k);
  const title = knownLong(vm, k);
  const tl = title !== words ? ` title="${esc(title)}"` : '';
  if (k === 'sells' || k === 'dist') {
    const s = c.sources[0];
    // An online shop's Sells it source label is the listing page's own title: page text, never printed.
    const t = s && k === 'dist' ? `${title}. Source: ${s.label}` : title;
    return s ? `<span class="kt" title="${esc(t)}">${outLink(s.url, words)}</span>` : `<span class="kt"${tl}>${esc(words)}</span>`;
  }
  const p = PART_DATA[k];
  const certs = vm.certs.filter((x) => CERT_PART[x.kind] === p);
  const finds = vm.finds.filter((f) => FIND_PART[f.kind] === p);
  if (!certs.length && !finds.length) return `<span class="kt"${tl}>${esc(words)}</span>`;
  const bits = certs.map((x) => outLink(x.source_url, `${CERT_LABEL[x.kind]} (+0.25)`));
  const byKind = {};
  finds.forEach((f) => { (byKind[f.kind] = byKind[f.kind] || []).push(f); });
  Object.keys(byKind).forEach((kind) => {
    const fs = byKind[kind];
    let cost = fs.reduce((a, f) => a + f.cost, 0);
    if (c.minor_cap_applied) cost = Math.min(cost, 0.25);
    // Several findings of one kind have a source each; the Record block lists them.
    bits.push(fs.length === 1 ? outLink(fs[0].source_url, `${FIND_KIND[kind]} finding (-${fmtVal(cost)})`)
      : `<button type="button" class="out" data-act="sources">${fs.length} ${FIND_KIND[kind]} findings (-${fmtVal(cost)})</button>`);
  });
  return `<span class="kt">${bits.join('<span class="muted">, </span>')}</span>`;
}

function whyScoreBlock(st, vm) {
  let segs = '', labs = '', x = 0;
  PART_KEYS.forEach((k) => {
    const w = vm.parts[k].contribution;
    segs += `<i class="seg-${k}" style="width:${(w * 100).toFixed(2)}%"></i>`;
    x += w;
    if (k === 'people' || k === 'planet') {
      const took = round3(tookOf(vm, k) * vm.parts[k].weight);
      if (took > 0) {
        segs += `<i class="took" style="width:${(took * 100).toFixed(2)}%"></i>`;
        labs += `<span style="left:${(x * 100).toFixed(2)}%">-${fmt3(took)}</span>`;
        x += took;
      }
    }
  });
  const tookText = ['people', 'planet'].map((k) => { const t = round3(tookOf(vm, k) * vm.parts[k].weight); return t > 0 ? ` A finding took ${fmt3(t)} from ${PART_NAMES[k]}.` : ''; }).join('');
  const narrow = layout() === 'narrow';
  const rows = PART_KEYS.map((k) => {
    const c = vm.parts[k];
    const dk = k === 'dist' ? 'distance' : k;
    const srcs = partSources(vm, k);
    const kt = narrow ? `<span class="kt">${esc(knownText(vm, k))}</span>${srcs ? `<span class="srcs">${srcs}</span>` : ''}` : knownHtml(vm, k);
    const name = !narrow && (k === 'people' || k === 'planet')
      ? `<a href="${ABOUT_ORDER}" title="Starts at 0.50. How the order works">${PART_NAMES[k]}</a>` : PART_NAMES[k];
    return `<tr class="prow" role="row"><th class="pp" scope="row" role="rowheader"><i class="sw seg-${k}" aria-hidden="true"></i>${name}</th>`
      + `<td class="known" role="cell">${kt}</td>`
      + `<td class="calc" role="cell"><span class="vw">${fmtVal(c.value)} × ${c.weight.toFixed(2)}<span class="eq"> = </span></span><b>${fmt3(c.contribution)}</b>`
      + `<span class="dline">${disputeBtn(st, dk)}</span></td></tr>`
      + (st.dispute === dk ? `<tr class="dnrow" role="row"><td colspan="3" role="cell">${disputeNote(st, dk)}</td></tr>` : '');
  }).join('');
  return `<section class="pblock" id="p-score" aria-labelledby="h-score"><h3><span id="h-score">Why this score</span><a class="hlink" href="${ABOUT_ORDER}">How the order works</a></h3>`
    + `<div class="pbar" data-d="D1"><div class="pbar-track" role="img" aria-label="${esc(scoreText(vm) + '.' + tookText)}">${segs}</div>`
    + (labs ? `<div class="pbar-lab" aria-hidden="true">${labs}</div>` : '') + '</div>'
    + `<table class="ptab" role="table" data-d="D1"><caption class="vh">The four parts of the score</caption>`
    + '<thead role="rowgroup"><tr role="row"><th class="pp" role="columnheader" scope="col">Part</th><th role="columnheader" scope="col">What is known</th>'
    + '<th class="calc" role="columnheader" scope="col">Value × weight = adds<span class="vh">, and Dispute</span></th></tr></thead>'
    + `<tbody role="rowgroup">${rows}</tbody></table>`
    + `<p class="sumline" title="The order uses the full value.">${sumLineHtml(vm)}</p></section>`;
}

const RELATION_TEXT = { self: 'Names this shop', related: 'About a related company (counted at half)',
  'related-at-shop': 'About a related company, at this shop (counted in full)' };

function findingCard(st, vm, f, i) {
  const key = 'finding' + (i + 1);
  const part = FIND_PART[f.kind] === 'ethics' ? 'people' : 'planet';
  const pen = f.penalty_usd != null ? `Penalty $${fmtInt(f.penalty_usd)} (${f.band})` : `Amount not stated (${f.band})`;
  const status = f.status === 'open' ? 'Case still open, counted as minor' : 'Case closed';
  return `<div class="fcard" id="p-${key}"><p class="fk">${FIND_KIND[f.kind]} · ${esc(f.action_date)}</p>`
    + `<p class="fq">“${esc(f.claim)}”</p>`
    + `<p class="fm">${esc(pen)} · ${esc(RELATION_TEXT[f.relation] || RELATION_TEXT.self)} · ${status}</p>`
    + `<p class="fm">Took ${fmtVal(f.cost)} from ${PART_NAMES[part]}, ${fmt3(f.cost * vm.parts[part].weight)} off the score.</p>`
    + `<div class="factline">${outLink(f.source_url, SOURCE_NAME[hostOf(f.source_url)] || hostOf(f.source_url))}${disputeBtn(st, key, 'Dispute this')}</div>`
    + disputeNote(st, key) + '</div>';
}

function certCard(st, vm, c, i) {
  const key = 'cert' + (i + 1);
  const assoc = c.kind === 'independent_retailer_assoc';
  const p = CERT_PART[c.kind] === 'ethics' ? 'People' : 'Planet';
  const effect = assoc ? 'Member of a retailer association. No score effect.' : `Adds 0.25 to ${p}`;
  return `<div class="ccard${assoc ? ' assoc' : ''}" id="p-${key}"><p class="cl">${esc(CERT_LABEL[c.kind])}</p>`
    + `<p class="fm">${effect}</p>`
    + `<div class="factline">${outLink(c.source_url, 'Source')}<span>Checked ${esc(c.checked)}</span>${disputeBtn(st, key)}</div>`
    + disputeNote(st, key) + '</div>';
}

function recordBlock(st, vm) {
  let html = '';
  const certs = vm.res.certifications;
  if (vm.unknown) {
    html += '<p>People and planet: unknown. No certification or finding is on file for this shop, and this search found none. Nothing on file does not mean the shop was checked.</p>';
  } else if (vm.finds.length) {
    html += vm.finds.map((f, i) => findingCard(st, vm, f, i)).join('');
    if (vm.parts.people.minor_cap_applied || vm.parts.planet.minor_cap_applied) {
      html += '<p class="capnote">Small findings together take at most 0.25; the cap applied here.</p>';
    }
  } else {
    html += '<p>Findings: none on file. The set is small and hand-built from 14 accepted sources. Nothing on file does not mean the shop was checked.</p>';
  }
  if (!vm.unknown && !vm.certs.length) html += '<p>Certifications: none on file.</p>';
  // Certification blocks follow the data's own order so cert1, cert2 in the hash stay stable.
  html += certs.map((c, i) => certCard(st, vm, c, i)).join('');
  return `<section class="pblock" id="p-record" aria-labelledby="h-record"><h3 id="h-record">Record</h3>${html}</section>`;
}

function chainBlock(st, vm) {
  const ch = vm.chain;
  const body = ch
    ? `<div class="chainbox"><p>${esc(ch.label)}. A fact about size. No score effect.</p>`
      + `<div class="factline">${outLink(ch.source_url, 'Source')}<span>Checked ${esc(ch.checked)}</span>${disputeBtn(st, 'chain')}</div>${disputeNote(st, 'chain')}</div>`
    : '<p>Not on the chain list (41 chains). That does not show what kind of business it is.</p>';
  return `<section class="pblock" id="p-chain" aria-labelledby="h-chain"><h3 id="h-chain">Chain</h3>${body}</section>`;
}

function websiteLines(vm) {
  const label = vm.sec === 'online' ? 'Open the listing' : 'Website';
  return `<div class="webline">${outLink(vm.res.retailer.url, label, 'btn small linkbtn')}<span class="dom">${esc(vm.domain)}</span></div>`
    + '<p class="muted">The shop is not told you came from here.</p>';
}

function addressLine(vm) {
  if (vm.sec === 'online') return '';
  if (!vm.res.address) return '<p>Address not given.</p>';
  return `<p class="addr"><span>${esc(vm.res.address)}</span>`
    + `<button type="button" class="btn small" data-act="copy" data-addr="${esc(vm.res.address)}">Copy address</button></p>`;
}

function whereBlock(st, vm, search) {
  let text = '';
  if (vm.sec === 'online') text += '<p>Online: no address and no distance.</p>';
  else if (vm.km == null) text += '<p>Distance not given. The search returned no position for this shop, so it is not on the plot.</p>';
  else {
    const dirWord = vm.dir ? ' ' + COMPASS_WORDS[vm.dir] : '';
    text += `<p>${fmtMilesNum(vm.km)} mi${dirWord} in a straight line from the center of your zip area, not from you. The road is longer.</p>`;
  }
  text += `<div id="p-where">${addressLine(vm)}</div>` + websiteLines(vm);
  if (vm.branches.length) {
    const ids = byIdOf(search);
    const b = ids[vm.branches[0]];
    const where = b.id.toUpperCase() + ', ' + whereShort(b);
    text += `<p>Another branch of this company is in this list: <button type="button" class="branch" data-act="open" data-id="${b.id}" aria-label="Open ${esc(b.name)}, ${esc(whereShort(b))}">${esc(where)}</button></p>`;
  }
  const plot = vm.sec === 'online' ? '' : plotSvg(search, 88, vm.id);
  return `<section class="pblock" aria-labelledby="h-where"><h3 id="h-where">Where</h3>`
    + `<div class="where">${plot ? `<div class="plot88" data-d="D4">${plot}</div>` : ''}<div class="wtext">${text}</div></div></section>`;
}

function sellsSentence(vm, search) {
  // Only nearby shops were measured, so a farther shop gets the nearby figure as a reference, never as its own.
  if (vm.sec === 'far') {
    const [word, pct] = vm.sells === 'likely' ? ['Likely sells it', 80] : ['May sell it', 40];
    return `${word}. A guess from the shop's name and type, not a stock check. No figure was measured for farther shops; for nearby shops at this level it was ${pct}%. Call before you go.`;
  }
  switch (vm.sells) {
    case 'likely': return "Likely sells it. A guess from the shop's name and type, not a stock check. In tests 80% of nearby shops at this level really sold the product (53 of 66). Call before you go.";
    case 'may': return "May sell it. A guess from the shop's name and type, not a stock check. In tests 40% of nearby shops at this level really sold the product (58 of 146). Call before you go.";
    case 'named': return `Its listing names the product: “${vm.res.matched_product}”. In tests 98% of online shops shown really sold the product or a close equivalent.`;
    case 'category': return `Its listing names only the category (${search.response.query.category}).`;
    default: return "Not confirmed: the shop's page did not name the product or its category, so this counts at the lowest level.";
  }
}

function metaLine(vm) {
  const bits = [vm.id.toUpperCase(), SEC_LABEL[vm.sec]];
  if (vm.sec !== 'online') bits.push(vm.km == null ? 'Distance not given' : whereShort(vm));
  bits.push('Score ' + fmt2(vm.score));
  return bits.join(' · ');
}

function shopNav(st, search, vm) {
  const flat = flatRows(st, search);
  const i = flat.findIndex((v) => v.id === vm.id);
  let prev = i > 0 ? flat[i - 1] : null;
  let next = i >= 0 && i < flat.length - 1 ? flat[i + 1] : null;
  if (i < 0) {
    // Hidden by a filter: step to the nearest shown shops on either side of where it would sit.
    const full = flatRows(Object.assign({}, st, CLEAR_FILTERS), search);
    const at = full.findIndex((v) => v.id === vm.id);
    const shown = new Set(flat.map((v) => v.id));
    prev = full.slice(0, at).reverse().find((v) => shown.has(v.id)) || null;
    next = full.slice(at + 1).find((v) => shown.has(v.id)) || null;
  }
  const count = i >= 0 ? `${i + 1} of ${flat.length}` : `${flat.length} shown`;
  // At narrow the shop is the page and the chip row is gone, so the filters come along in its bar.
  const filt = layout() === 'narrow' && !isMessage(search)
    ? `<button type="button" class="btn small pfilt" data-act="filters" aria-label="Filters, ${activeFilters(st).length ? activeFilters(st).length + ' on' : 'none'}">Filters</button>` : '';
  return '<div class="pnav">' + filt
    + `<button type="button" class="ibtn" data-act="go" data-dir="prev" data-id="${prev ? prev.id : ''}" aria-label="Previous shop" title="Previous shop"${prev ? '' : ' disabled'}>${ICON_PREV}</button>`
    + `<span class="pcount">${count}</span>`
    + `<button type="button" class="ibtn" data-act="go" data-dir="next" data-id="${next ? next.id : ''}" aria-label="Next shop" title="Next shop"${next ? '' : ' disabled'}>${ICON_NEXT}</button>`
    + `<span class="pnname" aria-hidden="true">${esc(rankLabel(vm))}</span>`
    + `<button type="button" class="btn small pnchoose" data-act="choose" data-id="${vm.id}" aria-label="Choose ${esc(accName(vm))}">Choose</button>`
    + closeBtn() + '</div>';
}

function shopPanel(st, search) {
  const vm = byIdOf(search)[st.shop];
  const picked = st.cmp.includes(vm.id);
  const hidden = !passes(vm, st);
  // At narrow the list and its "To compare" band are off screen, so the sheet shows the count and the way to compare.
  const nar = layout() === 'narrow';
  const nPick = st.cmp.length;
  const cmpBtn = picked
    ? `<button type="button" class="btn" data-act="togglecmp" data-id="${vm.id}" aria-label="In compare${nar ? `, ${nPick} of 4` : ''}. Remove ${esc(vm.name)} from compare">In compare${nar && nPick >= 2 ? ` (${nPick})` : ''} · Remove</button>`
    : `<button type="button" class="btn" data-act="togglecmp" data-id="${vm.id}"${nPick >= 4 ? ` title="${CMP_FULL}"` : ''}>Add to compare</button>`;
  const goCmp = nar && nPick >= 2 ? `<button type="button" class="btn" data-act="cmpopen">Compare ${nPick}</button>` : '';
  const hs = histState();
  const back = hs && hs.from === 'compare' && st.cmp.length >= 2
    ? `<p class="pback"><button type="button" class="btn small" data-act="tocompare">${ICON_PREV}Back to compare</button></p>` : '';
  return shopNav(st, search, vm)
    + '<div class="pbody">' + back
    + `<h2 class="ptitle" id="panel-h" tabindex="-1">${esc(vm.name)}</h2>`
    + `<p class="pmeta">${esc(metaLine(vm))}</p>`
    + (hidden ? '<p class="pwarn">Hidden in the list by your filters.</p>' : '')
    + `<div class="pactions"><button type="button" class="btn primary" data-act="choose" data-id="${vm.id}">Choose this shop</button>${cmpBtn}${goCmp}</div>`
    + whyScoreBlock(st, vm)
    // The sourced facts come right after the score they move, so they reach the first screen.
    + recordBlock(st, vm)
    + `<section class="pblock" aria-labelledby="h-here"><h3 id="h-here">Why here</h3>`
    + `<p>Place ${vm.place} of ${vm.secTotal} ${SEC_PHRASE[vm.sec]} by score.</p><p>${esc(whyHereLine2(st, search, vm))}</p></section>`
    + `<section class="pblock" aria-labelledby="h-sells"><h3 id="h-sells">Sells it</h3><p>${esc(sellsSentence(vm, search))}</p></section>`
    + chainBlock(st, vm)
    + whereBlock(st, vm, search)
    + `<section class="pblock" aria-labelledby="h-nk"><h3 id="h-nk">Not known here</h3><p>${NOT_KNOWN}</p></section>`
    + '</div>';
}

/* ======================================================================
   Panel: the chosen shop
   ====================================================================== */
function fallbackShop(st, search, vm) {
  const ids = byIdOf(search);
  const others = st.cmp.filter((id) => id !== vm.id);
  if (others.length) {
    const at = st.cmp.indexOf(vm.id);
    const after = at < 0 ? others : st.cmp.slice(at + 1).concat(st.cmp.slice(0, at)).filter((id) => id !== vm.id);
    return ids[after[0]];
  }
  const all = flatRows(st, search);
  const i = all.findIndex((v) => v.id === vm.id);
  if (i >= 0 && i < all.length - 1) return all[i + 1];
  return all.find((v) => v.id !== vm.id) || null;
}

function chosenPanel(st, search) {
  const vm = byIdOf(search)[st.shop];
  const fb = fallbackShop(st, search, vm);
  let where = '';
  if (vm.sec !== 'online') {
    where = vm.km == null ? '<p>Distance not given.</p>'
      : `<p>${fmtMilesNum(vm.km)} mi${vm.dir ? ' ' + COMPASS_WORDS[vm.dir] : ''} in a straight line from the center of your zip area. The road is longer.</p>`;
  }
  return '<div class="pnav">' + closeBtn() + '</div>'
    + '<div class="pbody chosen">'
    + `<h2 class="ptitle" id="panel-h" tabindex="-1">You chose ${esc(vm.name)}.</h2>`
    + `<p class="pmeta">${esc(metaLine(vm))}</p>`
    + '<section class="pblock" aria-label="Address and website">'
    + (vm.sec === 'online' ? '<p>Online: no address.</p>' : addressLine(vm))
    + websiteLines(vm) + where + '</section>'
    + `<section class="pblock" aria-label="Sells it"><p>${esc(sellsSentence(vm, search))}</p>`
    + `<p>${NOT_KNOWN}${vm.sec === 'online' ? " Delivery and shipping are on the shop's page." : ''}</p></section>`
    + '<section class="pblock" aria-label="Next steps"><div class="stack">'
    + (fb ? `<p>If it does not work out: <button type="button" class="branch" data-act="open" data-id="${fb.id}">${esc(rankLabel(fb))}</button></p>` : '')
    + '<button type="button" class="btn" data-act="back">Back to the list</button>'
    + '<button type="button" class="btn" data-act="newsearch">Search for something else</button>'
    + '</div></section></div>';
}

/* ======================================================================
   Panel: compare (section 6)
   ====================================================================== */
// Compare's Sells it cell: a nearby or farther level keeps its guess label beside a listing check.
function partWord(vm, k) {
  if (k === 'sells') {
    if (vm.sec === 'online') return SELLS_SHORT[vm.sells];
    return SELLS_SHORT[vm.sells] + (layout() === 'narrow' ? ' (guess)' : ', a guess');
  }
  if (k === 'dist') return vm.sec === 'online' ? 'online' : vm.km == null ? 'not given' : fmtMiles(vm.km);
  return partFacts(vm, k).size ? fmtVal(vm.parts[k].value) : 'unknown';
}

function kindLine(vm) {
  if (vm.sec === 'online') return 'Online';
  const k = vm.sec === 'near' ? 'Near' : 'Farther';
  return `${k}, ${vm.km == null ? 'distance not given' : whereShort(vm)}`;
}

function cmpBar(vm) {
  const segs = PART_KEYS.map((k) => `<i class="seg-${k}" style="width:${(vm.parts[k].contribution * 100).toFixed(2)}%"></i>`).join('');
  return `<span class="cbar" role="img" aria-label="${esc(scoreText(vm))}">${segs}</span>`;
}

function comparePanel(st, search) {
  const ids = byIdOf(search);
  const picked = st.cmp.map((id) => ids[id]);
  const ref = ids[st.ref];
  const narrow = layout() === 'narrow';
  // At narrow the compared-to column comes first and sticks beside the labels, so every
  // difference is read against a shop that stays on screen while the others scroll sideways.
  const picks = narrow ? [ref].concat(picked.filter((v) => v !== ref)) : picked;
  const n = picks.length;
  const REF = ref.id.toUpperCase();
  const diffOf = (v, k) => (k === 'score' ? round3(v.score - ref.score) : gap(v, ref)[k]);
  const diffStr = (d) => (th(d) === 0 ? '=' : (d > 0 ? '+' : '-') + fmt3(Math.abs(d)));

  // Each row: label, cells [{html, text, state}], fold text when equal across all shops.
  const rows = [];
  const num = (key, label, cellFn, foldFn) => rows.push({ key, label, cells: picks.map(cellFn), fold: foldFn, d: true });

  num('score', 'Score', (v) => {
    const d = diffOf(v, 'score');
    const partSum = PART_KEYS.reduce((a, k) => a + gap(v, ref)[k], 0);
    const rounded = th(partSum - d) !== 0 ? ', parts are rounded' : '';
    const title = v === ref ? 'The others are compared to this shop' : th(d) === 0 ? `The same score as ${REF}${rounded}` : `${fmt3(Math.abs(d))} ${hl(d)} than ${REF}${rounded}`;
    return { text: fmt3(v.score), state: v === ref ? 'ref' : th(d) ? 'dif' : 'eq', title,
      html: `<div class="cv"><span>${fmt3(v.score)}</span><span class="cn"><span class="cdf">${v === ref ? '' : diffStr(d)}</span></span></div>` };
  }, (c) => `Score ${c.text}`);
  num('parts', 'Four parts', (v) => {
    const g = gap(v, ref);
    const same = PART_KEYS.every((k) => th(g[k]) === 0);
    return { text: PART_KEYS.map((k) => fmt3(v.parts[k].contribution)).join('|'), state: v === ref ? 'ref' : same ? 'eq' : 'dif', html: cmpBar(v) };
  }, () => 'Four parts: the same');
  PART_KEYS.forEach((k) => {
    num(k, `<i class="sw seg-${k}" aria-hidden="true"></i>${PART_NAMES[k]}`, (v) => {
      const d = diffOf(v, k);
      const word = partWord(v, k);
      const title = `Adds ${fmt3(v.parts[k].contribution)}` + (v === ref ? ''
        : th(d) === 0 ? `, the same as ${REF}` : `, ${fmt3(Math.abs(d))} ${hl(d)} than ${REF}`);
      return { text: word + ' ' + fmt3(v.parts[k].contribution), state: v === ref ? 'ref' : th(d) ? 'dif' : 'eq', title,
        html: `<div class="cv"><span>${esc(word)}</span><span class="cn"><span class="cc">${fmt3(v.parts[k].contribution)}</span><span class="cdf">${v === ref ? '' : diffStr(d)}</span></span></div>` };
    // In the comma list of the fold line the guess label takes brackets.
    }, (c) => `${PART_NAMES[k]} ${c.text.split(' ').slice(0, -1).join(' ').replace(', a guess', ' (guess)')}`);
  });
  // An absence ("none on file", "not on the list") is never marked as a difference: only the cell
  // that holds a fact is, so an absence never weighs as much as a fact.
  const ABSENT = ['none on file', 'not on the list'];
  const textRow = (key, label, fn) => num(key, label, (v) => {
    const r = fn(v);
    const rr = fn(ref);
    const state = v === ref ? 'ref' : r.text === rr.text || ABSENT.includes(r.text) ? 'eq' : 'dif';
    return { text: r.text, html: r.html, state };
  }, (c) => `${label}: ${c.text}`);
  // Each fact chip in compare opens its own source, so a shopper can check it without leaving compare.
  const srcChip = (url, cls, text, pre) => `<button type="button" class="out chip ${cls}" data-href="${esc(url)}" title="Source: ${esc(hostOf(url))}">${pre || ''}${esc(text)}</button>`;
  textRow('certs', 'Certifications', (v) => {
    const names = v.certs.map((c) => CERT_LABEL[c.kind]);
    // Three or more read as a count, as in the Record cell; the opened shop lists them with sources.
    const chips = v.certs.length > 2
      ? [`<span class="chip cert" title="${esc(names.join(', '))}">${v.certs.length} certifications</span>`]
      : v.certs.map((c) => srcChip(c.source_url, 'cert', CERT_LABEL[c.kind]));
    if (v.assoc) chips.push('<span class="chip assoc">Retailer association</span>');
    const text = names.concat(v.assoc ? ['Retailer association'] : []).join(', ') || 'none on file';
    return { text, html: (v.certs.length ? '' : 'none on file') + (chips.length ? `<div class="chips">${chips.join('')}</div>` : '') };
  });
  textRow('finds', 'Findings', (v) => {
    const text = v.finds.length ? v.finds.map((f) => FIND_KIND[f.kind] + ' ' + yearOf(f.action_date)).join(', ') : 'none on file';
    return { text, html: v.finds.length
      ? `<div class="chips">${v.finds.map((f) => srcChip(f.source_url, 'find', `${FIND_KIND_BREAK[f.kind]} ${yearOf(f.action_date)}`, '<span class="vh">Finding: </span>')).join('')}</div>`
      : 'none on file' };
  });
  textRow('chain', 'Chain list', (v) => (v.chain
    ? { text: v.chain.label, html: `<div class="chips"><span class="chip chain">${esc(v.chain.label)}</span></div>` }
    : { text: 'not on the list', html: 'not on the list' }));
  rows.push({ key: 'tests', label: 'Sold it in tests', fold: (c) => `Sold it in tests: ${c.text}`, cells: picks.map((v) => {
    // Only nearby shops were measured; a farther shop gets the nearby figure as a reference, never as its own.
    const pct = v.sells === 'likely' ? 80 : 40;
    const of = `${pct}% of “${v.sells}” shops`;
    const t = v.sec === 'online' ? '98% of online shops' : v.sec === 'far' ? `no figure (nearby: ${of})` : of;
    return { text: t, html: t, state: v === ref ? 'ref' : '' };
  }) });
  rows.push({ key: 'addr', label: 'Address', cells: picks.map((v) => {
    let html;
    if (v.sec === 'online') html = 'online';
    else if (!v.res.address) html = 'not given';
    else html = `<span class="caddr"><span class="street">${esc(v.res.address.split(',')[0])}</span>`
      + `<button type="button" class="btn small copyw" data-act="copy" data-addr="${esc(v.res.address)}" aria-label="Copy address of ${esc(accName(v))}">Copy</button></span>`;
    return { html, state: v === ref ? 'ref' : '' };
  }) });
  // A domain breaks only after a dot or a hyphen, never inside a word.
  const webLink = (v) => `<button type="button" class="out" data-href="${esc(v.res.retailer.url)}">${esc(v.domain).replace(/([.-])/g, '$1<wbr>')}</button>`;
  rows.push({ key: 'web', label: 'Website', cells: picks.map((v) => ({ html: webLink(v), state: v === ref ? 'ref' : '' })) });

  const foldOn = st.only === 'diff';
  const folded = [];
  // Names the numbers in a part cell once, above the first part row shown.
  const subRow = `<tr role="row" class="csub"><th role="rowheader" scope="row"><span class="vh">In each part cell</span></th>`
    + picks.map((v) => `<td role="cell"${v === ref ? ' class="refcol"' : ''}><div class="cv"><span>value</span>`
      + `<span class="cn"><span class="cc">adds</span><span class="cdf">${v === ref ? '' : `<span class="sub-n">adds </span>vs ${REF}`}</span></span></div></td>`).join('') + '</tr>';
  // At narrow the Four parts row carries that key under its bars, which saves a row on the first screen.
  const foldsAway = (r) => foldOn && r.fold && r.cells.every((c) => c.text === r.cells[0].text);
  const partsRow = rows.find((r) => r.key === 'parts');
  let subDone = false;
  if (narrow && !foldsAway(partsRow)) {
    subDone = true;
    partsRow.cells.forEach((c, i) => {
      c.html += `<span class="pkey">value / adds${picks[i] === ref ? '' : ` vs ${REF}`}</span>`;
    });
  }
  const body = rows.map((r) => {
    if (foldsAway(r)) { folded.push(r.fold(r.cells[0])); return ''; }
    const sub = !subDone && PART_KEYS.includes(r.key) ? subRow : '';
    if (sub) subDone = true;
    const tds = r.cells.map((c) => {
      const cls = c.state === 'ref' ? 'refcol' : r.d ? c.state : '';
      return `<td role="cell"${cls ? ` class="${cls}"` : ''}${c.title ? ` title="${esc(c.title)}"` : ''}>${c.html}</td>`;
    }).join('');
    const dd = ['score', 'parts', 'sells', 'people', 'planet', 'dist'].includes(r.key) ? ' data-d="D1"' : '';
    // "Certif." is the one label short enough for the 76 px label column at narrow; the full word stays its name.
    const label = r.key === 'certs' ? '<span class="nw-w">Certifications</span><span class="nw-n" aria-hidden="true">Certif.</span>' : r.label;
    return `${sub}<tr role="row"${dd}><th role="rowheader" scope="row">${label}</th>${tds}</tr>`;
  }).join('');
  const foldRow = folded.length
    ? `<tr role="row" class="fold"><td role="cell" colspan="${n + 1}">Same for all ${n}: ${esc(folded.join(', '))}.</td></tr>` : '';
  const merged = `<tr role="row" class="merged"><td role="cell" colspan="${n + 1}">Not known here: stock, price, opening hours, delivery</td></tr>`;
  const actRow = (label, cls, fn) => `<tr role="row" class="${cls}"><th role="rowheader" scope="row">${narrow && cls === 'remove' ? label : `<span class="vh">${label}</span>`}</th>`
    + picks.map((v) => `<td role="cell"${v === ref ? ' class="refcol"' : ''}>${fn(v)}</td>`).join('') + '</tr>';
  const choose = actRow('Choose', 'choose', (v) => `<button type="button" class="btn small primary" data-act="choose" data-id="${v.id}" aria-label="Choose ${esc(accName(v))}">`
    + '<span class="nw-w">Choose this shop</span><span class="nw-n">Choose</span></button>');
  const remove = actRow('Remove', 'remove', (v) => `<button type="button" class="btn small" data-act="remove" data-id="${v.id}" aria-label="Remove ${esc(accName(v))} from compare">Remove</button>`);
  // The Choose bar sticks to the bottom; at narrow Remove is the row before it, elsewhere a mark in each head.
  const actions = narrow ? remove + choose : choose;

  const heads = picks.map((v) => {
    const hid = hiddenBy(v, st);
    // The name opens the shop in full; its panel offers the way back to this compare.
    return `<th role="columnheader" scope="col"${v === ref ? ' class="refcol"' : ''}>`
      + `<button type="button" class="chnb" data-act="open" data-id="${v.id}" data-from="compare" aria-label="Open ${esc(accName(v))}">`
      + `<span class="chn"><span class="rk">${v.id.toUpperCase()}</span> ${esc(v.name)}</span></button>`
      + `<button type="button" class="ibtn chrm" data-act="remove" data-id="${v.id}" aria-label="Remove ${esc(accName(v))} from compare" title="Remove from compare">${ICON_CLOSE}</button>`
      + `<span class="chk2">${esc(kindLine(v))}</span>`
      + (v === ref ? '<span class="reftag">Others compared to this</span>'
        : `<button type="button" class="btn small" data-act="setref" data-id="${v.id}" aria-label="Compare the others to ${esc(accName(v))}">Compare to this</button>`)
      + (hid.length ? `<span class="pwarn" style="display:block">Hidden in the list by: ${esc(hid.join(', '))}</span>` : '')
      + '</th>';
  }).join('');

  const gapText = [gapSentence(picked, ref), unknownSentence(picked, ref)].filter(Boolean).join(' ');
  const same = sameCompanyLine(picks);
  return '<div class="pnav">'
    + `<h2 id="panel-h" tabindex="-1">Compare ${n} shops</h2>`
    + `<label class="chk" style="margin-left:16px"><input type="checkbox" data-act="only"${foldOn ? ' checked' : ''}> Only rows that differ</label>`
    + closeBtn() + '</div>'
    + '<div class="pbody">'
    + `<p class="gapline${narrow && !gapOpen ? ' clamp' : ''}"><span class="gtext" tabindex="-1">${esc(gapText)}</span>${same ? `<span class="gsame">${esc(same)}</span>` : ''}`
    + (narrow && !gapOpen ? '<button type="button" class="gapmore" data-act="gapmore" aria-label="Show the whole sentence">More</button>' : '') + '</p>'
    + `<div class="cwrap"><table class="ctable" role="table" style="--n:${n}"><caption class="vh">Compare ${n} shops, each against ${esc(rankLabel(ref))}</caption>`
    + `<colgroup><col class="lab">${picks.map(() => '<col>').join('')}</colgroup>`
    + `<thead role="rowgroup"><tr role="row"><th role="columnheader" scope="col"><span class="vh">Shop</span></th>${heads}</tr></thead>`
    + `<tbody role="rowgroup">${foldRow}${body}${merged}${actions}</tbody></table></div>`
    + '</div>';
}

/* ======================================================================
   Panel: the one entry point
   ====================================================================== */
let panelKey = '';
function renderPanel(st, search) {
  const panel = document.getElementById('panel');
  let html = '';
  if (st.view === 'results' && search.response) {
    if (st.panel === 'shop') html = shopPanel(st, search);
    else if (st.panel === 'compare') html = comparePanel(st, search);
    else if (st.panel === 'chosen') html = chosenPanel(st, search);
    else if (st.panel === 'search') html = searchPanel(st, search);
  }
  const key = st.panel + '|' + st.shop + '|' + search.key;
  // Keep the reader's place when the same panel redraws (a dispute note opening, a pick changing).
  const keep = !panel.hidden && key === panelKey ? panel.scrollTop : 0;
  panel.innerHTML = html;
  panel.hidden = !html;
  panel.classList.toggle('pcompare', !!html && st.panel === 'compare');
  panel.scrollTop = keep;
  panelKey = html ? key : '';
  return !!html;
}

// Brings a panel element into view: inside the panel where it scrolls, else on the page.
function scrollPanelTo(el, toTop) {
  const panel = document.getElementById('panel');
  const nav = panel.querySelector('.pnav');
  const navH = nav ? nav.offsetHeight : 0;
  const ownScroll = panel.scrollHeight > panel.clientHeight + 1 && getComputedStyle(panel).overflowY !== 'visible';
  const r = el.getBoundingClientRect();
  if (ownScroll) {
    const pr = panel.getBoundingClientRect();
    const top = r.top - pr.top + panel.scrollTop - navH - 8;
    if (toTop) panel.scrollTop = top;
    else if (r.bottom > pr.bottom) panel.scrollTop += Math.min(r.bottom - pr.bottom + 16, r.top - pr.top - navH - 8);
  } else {
    const bar = document.getElementById('topbar').offsetHeight;
    if (toTop || r.bottom > window.innerHeight) window.scrollTo(0, Math.max(0, r.top + window.scrollY - bar - navH - 8));
  }
}

/* ======================================================================
   Render: canned states on the start view
   ====================================================================== */
function renderStartState(st, search) {
  const q = search.query;
  const typing = document.getElementById('typing');
  if (st.state === 'typing') {
    typing.innerHTML = '<p class="ptagline"><span class="ptagbox">Prototype: shown without a zip</span></p>'
      + `<p class="note">${esc(q.city)}, ${esc(q.state)}. Nearby means within ${q.near_radius_mi} miles here.</p>`
      + `<p class="note">Pressing Search sends: the product, ${esc(sentLine(search))}</p>`;
    typing.hidden = false;
  } else {
    typing.hidden = true;
    typing.innerHTML = '';
  }
  document.getElementById('cost-note').textContent =
    `A search takes about 3 seconds and costs the project ${fmtCents(search.response.usage.estimated_cost_usd)}. Nobody pays to be placed.`;
  document.getElementById('sample').innerHTML = sampleHtml(search);
  // The typing lines say what is sent more exactly, so the general note steps aside while they show.
  document.getElementById('sent-note').hidden = st.state === 'typing';
  // Fields and errors are set once per state, so typing over them is never undone by a redraw.
  if (st.state === lastStartState) return;
  lastStartState = st.state;
  if (!st.state) return;
  const sq = document.getElementById('sq'), sz = document.getElementById('sz');
  clearErrors();
  if (st.state === 'err-product') sq.value = '';
  else if (!sq.value) sq.value = q.product;
  if (st.state === 'typing' || st.state === 'err-zip') sz.value = '';
  if (st.state === 'err-zip-unknown') sz.value = '00000';
  form.q = sq.value;
  form.z = sz.value;
  const err = { 'err-product': ['sq', ERR.product], 'err-zip': ['sz', ERR.zip], 'err-zip-unknown': ['sz', ERR.zipUnknown] }[st.state];
  if (err) {
    const el = document.getElementById(err[0]);
    setFieldError(el, document.getElementById(err[0] + '-err'), err[1]);
    el.focus();
  }
}

// Start, from 1024 px: one nearby and one online shop of the current made-up search, drawn with the
// row's own bars and chips. Plain text, not rows: nothing here opens a panel or takes a pick.
const SELLS_ROW = { likely: 'Likely, a guess', may: 'May, a guess', named: 'Named in listing', category: 'Category only', unconfirmed: 'Not confirmed' };
function sampleHtml(search) {
  const all = shopsOf(search);
  const pick = (sec) => all.find((vm) => vm.sec === sec && (!vm.unknown || vm.chain)) || all.find((vm) => vm.sec === sec);
  const one = (vm) => (vm ? '<div class="smp">'
    + `<span class="smp-r">${vm.id.toUpperCase()}</span><span class="smp-n">${esc(vm.name)}</span>`
    + `<span class="scorewrap">${scoreBar(vm)}<span class="snum" aria-hidden="true">${fmt2(vm.score)}</span></span>`
    + `<div class="smp-b">${vm.sec === 'online' ? 'online' : esc(whereShort(vm))} · ${SELLS_ROW[vm.sells]}</div>`
    + `<div class="smp-b"><span class="smp-k">People</span>${microBar('People', vm.parts.people.value, vm.peopleUp, vm.peopleDown)}`
    + `<span class="smp-k">Planet</span>${microBar('Planet', vm.parts.planet.value, vm.planetUp, vm.planetDown)}</div>`
    + `<div class="smp-b">${recordChips(vm)}</div></div>` : '');
  return '<h2 class="rlab" id="sample-h">Example results</h2>'
    + `<div class="sbox">${one(pick('near'))}${one(pick('online'))}</div>`
    + '<p class="skey"><span>Score parts:</span>' + PART_KEYS.map((k) => `<span><i class="sw seg-${k}" aria-hidden="true"></i>${PART_NAMES[k]}</span>`).join('')
    + '</p>';
}

/* ======================================================================
   Render: message blocks in place of the table (nothing found, no search came back)
   ====================================================================== */
function renderMessage(st, search) {
  const q = search.query;
  const u = search.response ? search.response.usage : null;
  const retry = '<button type="button" class="btn primary" data-act="retry">Try again</button>';
  let head = '', body = '', act = '', tag = '';
  switch (search.state) {
    case 'empty':
      head = `Nothing matched “${esc(q.product)}”, nearby or online.`;
      body = '<p>Try a shorter or more general name.</p>'
        + `<p class="muted">The search ran: ${u.brave_calls} web lookups, ${fmtCents(u.estimated_cost_usd)}. A shop may still sell it: searches find about a third of the shops that do.</p>`;
      break;
    case 'failed':
      head = "The search didn't complete.";
      body = '<p>Wait a moment and try again.</p>';
      act = retry;
      break;
    case 'rate':
      head = 'Too many searches from this connection (the limit is 30 a minute).';
      body = '<p>Try again in about a minute.</p>';
      act = retry;
      break;
    default:
      tag = '<p class="ptagline"><span class="ptagbox">Wording proposal, not yet ruled on</span></p>';
      head = 'No search was run: the money for searches is spent for now.';
      body = '<p>Search is paused. No date is set for searches to resume.</p>';
  }
  return `<section class="msg msg-${search.state}" aria-labelledby="msg-h">${tag}<h2 id="msg-h">${head}</h2>${body}`
    + (act ? `<div class="msgact">${act}</div>` : '') + '</section>';
}

// The "Why so few nearby?" text, shared by the box under the empty band and About this search.
function thinLines(search) {
  const q = search.query;
  return [
    ['Your place', `a ${search.area} zip area, so nearby means within ${q.near_radius_mi} miles.`],
    ["The site's reach", 'in tests it found about a third (33 to 35%) of the nearby shops that really sell it. A shop near you can exist and be missing.'],
    ['Your wording', 'a shorter or more general name may find more.'],
  ];
}
function thinRow(search) {
  const n = visCols().length;
  if (layout() === 'narrow') {
    return `<tr role="row" class="thinrow"><td role="cell" colspan="${n}"><button type="button" class="btn thinbtn" data-act="thin">Why so few nearby?</button></td></tr>`;
  }
  return `<tr role="row" class="thinrow"><td role="cell" colspan="${n}"><div class="thinbox"><h3>Why so few nearby?</h3>`
    + thinLines(search).map(([b, t]) => `<p><b>${b}:</b> ${esc(t)}</p>`).join('') + '</div></td></tr>';
}
