<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nottheriver</title>
<style>
/* ===== Tokens ===== */
:root {
  color-scheme: light;
  --bg: #F4F7F5;
  --surface: #FFFFFF;
  --ink: #17302C;
  --ink-muted: #4B605C;
  --accent: #1B6A72;
  --accent-ink: #FFFFFF;
  --badge-bg: #E3F0F0;
  --warn: #8F4A1D;
  --warn-bg: #FBF1E8;
  --rule: #CBD7D4;
  --border-input: #6F8683;
  --focus: #0F4C81;
  --shadow-popover: 0 6px 20px rgb(0 0 0 / 0.12);

  --surface-2: #E9EFEC;
  --row-hover: #EEF5F4;
  --row-sel: #E3F0F0;
  --track: #DDE5E2;
  --tick: #6F8683;
  --part-sells: #4A5FA0;
  --part-people: #7E4F93;
  --part-planet: #62702A;
  --part-distance: #56707F;
  --assoc-bg: #E6EAE9;
  --diff-ring: #17302C;
  --scrim: rgb(16 32 30 / 0.35);
  --sheet-shadow: 0 -6px 20px rgb(0 0 0 / 0.12);
  --drawer-shadow: -8px 0 20px rgb(0 0 0 / 0.14);
  --mark: #A3246F;

  --font-voice: ui-serif, "Iowan Old Style", Georgia, "Noto Serif", "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --text-xs: 0.75rem;
  --text-data: 0.8125rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-md: 1.125rem;
  --text-lg: 1.25rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --leading-ui: 1.5;
  --leading-display: 1.35;
  --leading-prose: 1.6;
  --leading-dense: 1.3;

  --space-0: 2px;
  --space-1: 0.25rem;
  --space-1h: 6px;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;
  --space-8: 4rem;
  /* The spec fixes a 16 px gutter at every width, unlike the live site's 24 px from 640 px. */
  --gutter: 1rem;
  --control-height: 2.75rem;
  --radius-control: 3px;
  --radius-panel: 6px;
  --measure: 40rem;

  --row: 32px;
  --row-2: 52px;
  --row-narrow: 70px;
  --row-narrow-2: 90px;
  --rail-w: 200px;
  --panel-w: 464px;
  --panel-w-compare: 840px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111E1C;
    --surface: #1A2B29;
    --ink: #E5EEEC;
    --ink-muted: #A6B8B4;
    --accent: #79C9D0;
    --accent-ink: #0E2224;
    --badge-bg: #213A3B;
    --warn: #E6AA72;
    --warn-bg: #2C2119;
    --rule: #33484A;
    --border-input: #7A9391;
    --focus: #9BD8E8;
    --shadow-popover: 0 6px 20px rgb(0 0 0 / 0.5);
    --surface-2: #16302D;
    --row-hover: #203634;
    --row-sel: #213A3B;
    --track: #2A3D3B;
    --tick: #7A9391;
    --part-sells: #9DB0EC;
    --part-people: #CDA3DF;
    --part-planet: #BECB7E;
    --part-distance: #A3BDCB;
    --assoc-bg: #2A3836;
    --diff-ring: #E5EEEC;
    --scrim: rgb(0 0 0 / 0.55);
    --sheet-shadow: 0 -6px 20px rgb(0 0 0 / 0.5);
    --drawer-shadow: -8px 0 20px rgb(0 0 0 / 0.5);
    --mark: #F29BD0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111E1C;
  --surface: #1A2B29;
  --ink: #E5EEEC;
  --ink-muted: #A6B8B4;
  --accent: #79C9D0;
  --accent-ink: #0E2224;
  --badge-bg: #213A3B;
  --warn: #E6AA72;
  --warn-bg: #2C2119;
  --rule: #33484A;
  --border-input: #7A9391;
  --focus: #9BD8E8;
  --shadow-popover: 0 6px 20px rgb(0 0 0 / 0.5);
  --surface-2: #16302D;
  --row-hover: #203634;
  --row-sel: #213A3B;
  --track: #2A3D3B;
  --tick: #7A9391;
  --part-sells: #9DB0EC;
  --part-people: #CDA3DF;
  --part-planet: #BECB7E;
  --part-distance: #A3BDCB;
  --assoc-bg: #2A3836;
  --diff-ring: #E5EEEC;
  --scrim: rgb(0 0 0 / 0.55);
  --sheet-shadow: 0 -6px 20px rgb(0 0 0 / 0.5);
  --drawer-shadow: -8px 0 20px rgb(0 0 0 / 0.5);
  --mark: #F29BD0;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { font-family: var(--font-ui); font-size: 100%; line-height: var(--leading-ui); }
body { margin: 0; background: var(--bg); color: var(--ink); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
a { color: var(--accent); text-underline-offset: 0.15em; }
/* A link out is a button drawn as a link (see outLink). */
.out:not(.btn):not(.chip) {
  display: inline-flex; align-items: center; min-height: 24px; margin: 0; padding: 0; border: 0; background: none; color: var(--accent);
  text-decoration: underline; text-underline-offset: 0.15em; text-align: left; cursor: pointer;
}
.muted { color: var(--ink-muted); }

/* ===== Shell ===== */
.app { display: grid; grid-template-rows: 44px auto minmax(0, 1fr); height: 100vh; height: 100dvh; }
.topbar {
  display: flex; align-items: center; height: 44px; padding: 0 var(--gutter); gap: 16px;
  background: var(--surface-2); border-bottom: 1px solid var(--rule); min-width: 0;
}
.wordmark {
  display: inline-flex; align-items: center; gap: 8px; flex: none; width: 152px;
  color: var(--ink); text-decoration: none; font-family: var(--font-voice); font-size: var(--text-lg); line-height: 1;
}
.wordmark svg { flex: none; color: var(--accent); }
.wordmark:focus-visible { outline-offset: 2px; }
.tform { display: flex; align-items: center; flex: 0 1 auto; min-width: 0; }
.tl { font-size: var(--text-xs); color: var(--ink-muted); margin-right: 6px; white-space: nowrap; }
.tl-z { margin-left: 12px; }
.tfield { position: relative; display: inline-flex; }
.tfield-q { flex: 1 1 264px; width: 264px; min-width: 200px; max-width: 280px; }
.tform input {
  width: 100%; height: 32px; padding: 0 8px; font-size: var(--text-base);
  border: 1px solid var(--border-input); border-radius: var(--radius-control); background: var(--surface); color: var(--ink);
}
.tfield-z { width: 72px; flex: none; }
.tform .btn { margin-left: 8px; width: 72px; }
.tip {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: max-content; max-width: 280px;
  padding: 6px 8px; font-size: var(--text-xs); line-height: var(--leading-dense); color: var(--warn);
  background: var(--surface); border: 1px solid var(--warn); border-radius: var(--radius-control); box-shadow: var(--shadow-popover);
}
.tspacer { flex: 1 1 0; min-width: 0; }
.proto:empty { display: none; }
.proto { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; height: 32px; border: 1px dashed var(--mark); border-radius: var(--radius-control); }
.aboutlink { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 32px; font-size: var(--text-data); color: var(--ink); }
.input-invalid, input[aria-invalid="true"] { border: 2px solid var(--warn) !important; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 12px;
  border: 1px solid var(--border-input); border-radius: var(--radius-control); background: var(--surface); color: var(--ink);
  font-size: var(--text-data); font-weight: 600; line-height: 1; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--row-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.6; cursor: default; filter: none; }
.btn.small { height: 24px; padding: 0 8px; font-size: var(--text-xs); }
.btn.big { height: 44px; padding: 0 24px; font-size: var(--text-base); }

.facts {
  display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 var(--gutter);
  background: var(--surface-2); border-bottom: 1px solid var(--rule);
  font-size: var(--text-data); color: var(--ink-muted); white-space: nowrap; min-width: 0;
}
.facts .ftext { flex: 1 1 auto; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; }
.facts strong { color: var(--ink); font-weight: 600; }
.fsep { color: var(--ink-muted); padding: 0 2px; }

.shell {
  display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); column-gap: 16px;
  padding: 0 var(--gutter); min-height: 0;
}
.shell.with-panel { grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--panel-w); }
@media (min-width: 1280px) {
  .view-start .rail { grid-column: 1; grid-row: 1; }
  .view-start .col { grid-column: 2; grid-row: 1; }
}
.rail { min-height: 0; overflow: auto; }
.col {
  min-height: 0; min-width: 0; overflow: auto; display: flex; flex-direction: column;
  background: var(--surface); border-inline: 1px solid var(--rule);
  /* Keeps visually hidden text in cells inside this scroll box instead of widening the page. */
  position: relative;
}
.col > main { flex: none; }
.panel { min-height: 0; overflow: auto; background: var(--surface); border-inline: 1px solid var(--rule); }

.footer {
  display: block; min-height: 28px; padding: 6px 8px 5px;
  font-size: var(--text-xs); line-height: var(--leading-dense); color: var(--ink-muted); flex: none;
}
.footer .fsep { padding: 0 6px; }
/* 24 px tall on a 15 px line: the negative margin keeps the 28 px footer line. */
.footer .flink { display: inline-flex; align-items: center; min-height: 24px; margin-block: -5px; color: var(--ink); }

/* ===== Results table ===== */
.grid {
  width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0;
  font-size: var(--text-data); line-height: var(--leading-dense); font-variant-numeric: tabular-nums;
}
.grid col.c-cmp { width: 32px; }
.grid col.c-rank { width: 32px; }
.grid col.c-sells { width: 120px; }
.grid col.c-dist { width: 80px; }
/* 70 px holds the head note "11 unknown" on one line. */
.grid col.c-people, .grid col.c-planet { width: 70px; }
.grid col.c-score { width: 144px; }
.grid col.c-record { width: 298px; }
.grid thead th {
  position: sticky; top: 0; z-index: 3; height: 36px; padding: 0 6px;
  background: var(--surface-2); border-bottom: 1px solid var(--rule);
  text-align: left; vertical-align: middle; font-weight: 600; color: var(--ink); white-space: nowrap;
}
.grid thead th.c-people, .grid thead th.c-planet { text-align: center; padding: 0 2px; }
/* One step smaller, so the two neighboring notes ("18 unknown", "17 unknown") do not touch. */
.grid thead th.c-people .hnote, .grid thead th.c-planet .hnote { font-size: 0.6875rem; }
/* Each part column's head carries its segment color, in the bar's own order, so the head row is the bar's key. */
.grid thead th.c-sells { box-shadow: inset 0 -3px 0 var(--part-sells); }
.grid thead th.c-people { box-shadow: inset 0 -3px 0 var(--part-people); }
.grid thead th.c-planet { box-shadow: inset 0 -3px 0 var(--part-planet); }
.grid thead th.c-dist { box-shadow: inset 0 -3px 0 var(--part-distance); }
.hname { display: inline-flex; align-items: center; gap: 3px; }
.hname .arrow { color: var(--ink-muted); }
.hnote { display: block; font-size: var(--text-xs); font-weight: 400; color: var(--ink-muted); line-height: 1.2; }
.hnote:empty { display: none; }
.grid td, .grid tbody th {
  height: 32px; padding: 0 6px; border-bottom: 1px solid var(--rule);
  vertical-align: middle; text-align: left; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.grid :focus-visible { outline-offset: -3px; }
/* An inset ring on a filled button would sit on the fill at about 1.3:1; a light inner ring on the
   fill and the focus ring just outside it keep both edges visible, and stay inside the cell's clip. */
.grid .btn.primary:focus-visible, .ctable .btn.primary:focus-visible {
  outline: 2px solid var(--accent-ink); outline-offset: -4px; box-shadow: 0 0 0 3px var(--focus);
}
.rseg label:has(input:focus-visible), .pseg label:has(input:focus-visible) { box-shadow: 0 0 0 2px var(--surface); }
.grid .c-record { white-space: normal; overflow: visible; }
.grid .c-cmp { text-align: center; padding: 0; }
.grid .c-people, .grid .c-planet { text-align: center; padding: 0; }
.grid .c-rank { font-size: var(--text-xs); color: var(--ink-muted); letter-spacing: 0.02em; }
.grid td.c-rank, .grid thead th.c-rank { padding: 0 2px 0 4px; }
.cmpbox { width: 16px; height: 16px; margin: 0; vertical-align: middle; accent-color: var(--accent); cursor: pointer; }
.name {
  display: block; max-width: 100%; padding: 0; border: 0; background: none; color: var(--ink);
  font-size: var(--text-data); font-weight: 600; text-align: left; cursor: pointer;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
/* The name button reaches 4 px into the cell's padding on each side, so its focus ring clears the
   first and last letters and the text stays lined up with the Shop head. */
@media (min-width: 1024px) {
  .grid .name { max-width: calc(100% + 8px); margin: 0 -4px; padding: 0 4px; }
  .grid .name:focus-visible { outline-offset: -1px; }
}
.srow { cursor: pointer; }
.srow:hover > td, .srow:hover > th, .srow:focus-within > td, .srow:focus-within > th { background: var(--row-hover); }
.srow.sel > td, .srow.sel > th { background: var(--row-sel); }
.srow.sel > td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.srow:hover .name { text-decoration: underline; text-underline-offset: 0.15em; }
.dir { color: var(--ink-muted); }
/* A band header wraps rather than cut, since its tail ("call first") is the part a shopper must not lose. */
.grid .bandhead th {
  height: 24px; padding: 3px 6px 3px 38px; background: var(--surface-2); border-bottom: 1px solid var(--rule);
  font-size: var(--text-xs); line-height: 17px; font-weight: 400; color: var(--ink-muted); text-align: left;
  white-space: normal; overflow: visible;
}
.bandhead .bname { font-family: var(--font-voice); font-size: var(--text-sm); color: var(--ink); font-weight: 600; }
.bandhead .bclear { margin-left: 8px; vertical-align: middle; }
tbody.band + tbody.band .bandhead th { border-top: 0; }

/* Score cell */
.c-score { position: relative; }
.scorewrap { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
.grid td.c-score, .grid thead th.c-score { overflow: visible; padding-left: 8px; padding-right: 8px; }
.sbar { display: inline-flex; flex: none; width: 72px; height: 10px; background: var(--track); overflow: hidden; }
.sbar .seg { display: block; height: 100%; flex: none; border-right: 1px solid transparent; background-clip: padding-box; }
.sbar .seg:last-child { border-right: 0; }
.seg-sells { background-color: var(--part-sells); }
.seg-people { background-color: var(--part-people); }
.seg-planet { background-color: var(--part-planet); }
.seg-dist { background-color: var(--part-distance); }
.snum { font-weight: 600; }
.tiemark { margin-left: -2px; font-size: var(--text-xs); color: var(--ink-muted); cursor: help; }
.c-score.tie-start::before, .c-score.tie-mid::before, .c-score.tie-end::before {
  content: ""; position: absolute; left: 1px; width: 2px; background: var(--tick);
}
.c-score.tie-start::before { top: 10px; bottom: 0; }
.c-score.tie-mid::before { top: 0; bottom: 0; }
.c-score.tie-end::before { top: 0; bottom: 10px; }
.c-score.tie-start::after, .c-score.tie-end::after {
  content: ""; position: absolute; left: 1px; width: 5px; height: 2px; background: var(--tick);
}
.c-score.tie-start::after { top: 10px; }
.c-score.tie-end::after { bottom: 10px; }

/* People and Planet micro-bars */
.mbar { position: relative; display: inline-block; width: 44px; height: 10px; background: var(--track); vertical-align: middle; }
.mbar::before { content: ""; position: absolute; left: 21.5px; top: -2px; bottom: -2px; width: 1px; background: var(--tick); }
.mbar i { position: absolute; display: block; }
.mbar .ring { left: 19px; top: 2px; width: 6px; height: 6px; border: 1.5px solid var(--tick); border-radius: 50%; background: var(--track); }
.mbar .up { left: 22px; top: 0; bottom: 0; background: var(--accent); }
.mbar .up::after { content: ""; position: absolute; right: -1px; top: -2px; bottom: -2px; width: 2px; background: var(--accent); }
.mbar .dn {
  right: 22px; top: 0; bottom: 0; box-shadow: inset 0 0 0 1px var(--warn);
  background: repeating-linear-gradient(-45deg, var(--warn) 0 1.5px, transparent 1.5px 3.5px);
}
.mbar .capR { left: 22px; top: -2px; bottom: -2px; width: 2px; background: var(--accent); }
.mbar .notchL { right: 22px; top: -2px; bottom: -2px; width: 2px; background: var(--warn); }
/* The rail's key draws each mark the way the micro-bars do, so a mark seen in a row can be looked up. */
.mkey { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; margin: 0 0 4px; font-size: var(--text-xs); line-height: 16px; color: var(--ink-muted); }
.mkey span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.mk { display: inline-block; flex: none; width: 10px; height: 8px; }
.mk.ring { width: 8px; height: 8px; border: 1.5px solid var(--tick); border-radius: 50%; }
.mk.up { background: var(--accent); }
.mk.dn { box-shadow: inset 0 0 0 1px var(--warn); background: repeating-linear-gradient(-45deg, var(--warn) 0 1.5px, transparent 1.5px 3.5px); }

/* Record chips */
/* 3 + 20 + 4 + 20 + 4 + the 1 px rule = the 52 px wrapped row. */
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 3px 0 4px; }
.chip {
  display: inline-flex; align-items: center; height: 20px; padding: 0 6px; white-space: nowrap;
  font-size: var(--text-xs); line-height: 1; border: 1px solid transparent;
}
.chip.cert { border-radius: 999px; background: var(--badge-bg); color: var(--accent); border-color: var(--accent); }
.chip.find { border: 0; border-left: 3px solid var(--warn); border-radius: 0; background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.chip.chain { border: 1px dashed var(--tick); border-radius: 0; background: none; color: var(--ink); }
.chip.assoc { border-radius: 999px; border-color: var(--tick); background: var(--assoc-bg); color: var(--ink-muted); }
.unk { color: var(--ink-muted); font-size: var(--text-data); line-height: 20px; }
.unk2 { display: none; }

/* ===== Searching ===== */
.grid.searching .bandhead th { color: var(--ink-muted); }
.qcard {
  width: 480px; max-width: calc(100% - 32px); margin: 16px 0 24px 38px; padding: 16px 20px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-panel);
  font-size: var(--text-sm); line-height: var(--leading-ui);
}
.qcard h2 { margin: 0 0 8px; font-family: var(--font-voice); font-size: var(--text-md); font-weight: 600; }
.steps { margin: 0 0 12px; padding-left: 1.4em; }
.steps li { padding: 2px 0; }
.steps li::marker { font-variant-numeric: tabular-nums; color: var(--ink-muted); }
.qcard p { margin: 0 0 8px; color: var(--ink-muted); }
.qcard .sent { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--rule); color: var(--ink); }

/* ===== Start ===== */
.view-start .col, .view-about .col { background: transparent; border-inline: 0; }
.start { padding: 32px 0 24px; }
.start-main { max-width: 640px; }
/* Two sample rows beside the form, so the first screen shows what a search returns. */
.sample { display: none; }
@media (min-width: 1024px) {
  .start { display: flex; align-items: flex-start; gap: 32px; }
  .start-main { flex: 0 1 640px; min-width: 0; }
  .sample { display: block; flex: 0 1 360px; min-width: 296px; margin-top: 8px; }
}
.sample .rlab { margin: 0 0 4px; }
.sbox { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-panel); font-size: var(--text-data); line-height: var(--leading-dense); font-variant-numeric: tabular-nums; }
.smp { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; row-gap: 4px; align-items: center; padding: 8px 12px 10px; }
.smp + .smp { border-top: 1px solid var(--rule); }
.smp-b { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; }
.smp-r { font-size: var(--text-xs); color: var(--ink-muted); }
.smp-n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.smp-k { font-size: var(--text-xs); color: var(--ink-muted); }
.smp-k + .mbar { margin-right: 10px; }
.smp .chips { padding: 0; }
.skey { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 8px 0 0; font-size: var(--text-xs); color: var(--ink-muted); }
.skey .sw { margin-right: 4px; }
.headline {
  margin: 0 0 24px; font-family: var(--font-voice); font-weight: 400;
  font-size: var(--text-2xl); line-height: var(--leading-display); color: var(--ink);
}
.sform { display: grid; grid-template-columns: 1fr 8rem auto; column-gap: 16px; align-items: start; }
.field label { display: block; font-size: var(--text-sm); line-height: 21px; margin-bottom: 4px; }
.field input {
  width: 100%; height: 44px; padding: 0 12px; font-size: var(--text-base);
  border: 1px solid var(--border-input); border-radius: var(--radius-control); background: var(--surface); color: var(--ink);
}
.f-b { padding-top: 25px; }
.f-n { grid-column: 1 / -1; }
.ferr { margin: 4px 0 0; font-size: var(--text-sm); line-height: 21px; color: var(--warn); }
/* The zip column is 8rem; its error may run past it under the button so the common case stays one line. */
.f-z .ferr { width: max-content; max-width: 15rem; }
@media (max-width: 767.98px) { .f-z .ferr { width: auto; max-width: none; } }
.note { margin: 8px 0 0; font-size: var(--text-sm); line-height: 21px; color: var(--ink-muted); }
.view-start .footer { max-width: 640px; padding: 12px 0; }

/* ===== Narrowed table beside a panel ===== */
.grid col.c-against { width: 104px; }
.sacc { display: none; }
.agn { white-space: nowrap; }
.atag { font-size: var(--text-xs); color: var(--ink-muted); margin-left: 3px; }
.grid .cmphead th {
  position: sticky; top: 36px; z-index: 2; height: 32px; padding: 0 6px 0 38px;
  background: var(--surface-2); border-bottom: 1px solid var(--rule); box-shadow: inset 0 -2px 0 var(--accent);
  font-size: var(--text-xs); font-weight: 400; color: var(--ink-muted); text-align: left; white-space: nowrap;
}
.cmphead .bname { font-family: var(--font-voice); font-size: var(--text-sm); color: var(--ink); font-weight: 600; }
.cmphead .btn { margin-left: 8px; vertical-align: middle; }
.grid .hidnote { font-size: var(--text-xs); color: var(--warn); white-space: nowrap; }

/* ===== Side panel ===== */
/* Positioned so visually hidden text inside stays in this box instead of widening the page. */
.panel { position: relative; font-size: var(--text-data); line-height: var(--leading-dense); }
.pnav {
  position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 4px;
  height: 40px; padding: 0 12px 0 16px; background: var(--surface); border-bottom: 1px solid var(--rule);
}
.pnav h2 { margin: 0; font-family: var(--font-voice); font-size: var(--text-md); font-weight: 600; white-space: nowrap; }
.pcount { min-width: 64px; text-align: center; font-size: var(--text-xs); color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ibtn {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0;
  border: 1px solid var(--border-input); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); cursor: pointer;
}
.ibtn:hover { background: var(--row-hover); }
.ibtn:disabled { opacity: 0.45; cursor: default; background: var(--surface); }
.pnav .pclose { margin-left: auto; }
/* Once the shop's own heading scrolls under the bar, the bar names the shop and keeps Choose in reach. */
.pnname, .pnchoose { display: none; }
@media (min-width: 1024px) {
  .pnav.stuck .pnname {
    display: block; flex: 1 1 auto; min-width: 0; margin: 0 4px 0 8px;
    font-size: var(--text-data); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pnav.stuck .pnchoose { display: inline-flex; flex: none; }
  .pnav.stuck .pclose { margin-left: 4px; }
}
.pbody { padding: 14px 16px 24px; }
.pback { margin: 0 0 10px; }
.pback .btn { gap: 4px; padding-left: 8px; }
.ptitle { margin: 0; font-family: var(--font-voice); font-size: var(--text-lg); font-weight: 600; line-height: 1.25; }
.pmeta { margin: 4px 0 0; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.pwarn { margin: 6px 0 0; font-size: var(--text-xs); color: var(--warn); }
.pactions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pblock { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
.pblock > h3 { margin: 0 0 8px; font-size: var(--text-data); font-weight: 600; color: var(--ink); }
.pblock p { margin: 0 0 6px; }
.pblock p:last-child { margin-bottom: 0; }
.tbtn {
  display: inline-flex; align-items: center; min-height: 24px; padding: 0 4px; border: 0; background: none;
  color: var(--accent); font-size: var(--text-xs); text-decoration: underline; text-underline-offset: 0.15em; cursor: pointer; white-space: nowrap;
}
.tbtn[aria-expanded="true"] { font-weight: 600; text-decoration-thickness: 2px; }
.srcs { display: flex; flex-wrap: wrap; gap: 0 10px; margin-top: 2px; font-size: var(--text-xs); }
/* "{n} sources" is a button; without its side padding it lines up with a "Source" link. */
.srcs .tbtn { padding-inline: 0; }
.dnote {
  margin: 6px 0 4px; padding: 10px 12px; background: var(--surface-2); border-left: 3px solid var(--tick);
  font-size: var(--text-data); line-height: 1.45; color: var(--ink);
}
.dnote p { margin: 0 0 8px; }

/* Why this score */
.pbar { max-width: 400px; margin: 2px 0 0; }
.pbar-track { display: flex; height: 14px; background: var(--track); }
.pbar-track > i { display: block; height: 100%; flex: none; border-right: 2px solid transparent; background-clip: padding-box; }
.pbar-track > i:last-child { border-right: 0; }
.pbar-track > i.took {
  background: repeating-linear-gradient(-45deg, var(--warn) 0 1.5px, transparent 1.5px 4px);
  box-shadow: inset 0 0 0 1px var(--warn); background-clip: border-box; border-right-color: var(--surface);
}
.pbar-lab { position: relative; height: 16px; font-size: var(--text-xs); line-height: 16px; color: var(--warn); font-variant-numeric: tabular-nums; }
.pbar-lab span { position: absolute; top: 0; white-space: nowrap; }
.ptab { width: 100%; border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums; }
.ptab th, .ptab td { padding: 6px 4px; border-bottom: 1px solid var(--rule); vertical-align: top; text-align: left; font-weight: 400; }
.ptab thead th { padding-top: 0; font-size: var(--text-xs); color: var(--ink-muted); white-space: nowrap; }
.ptab th:first-child, .ptab td:first-child { padding-left: 0; }
.ptab th:last-child, .ptab td:last-child { padding-right: 0; }
.ptab .pp { width: 70px; font-weight: 600; white-space: nowrap; }
.ptab thead .pp { font-weight: 400; }
.sw { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 0; }
.ptab .calc { text-align: right; white-space: nowrap; }
.ptab .calc b { font-weight: 600; }
.ptab .dline { display: block; margin: 1px -4px 0 0; }
.ptab tr.dnrow td { padding-top: 0; }
.sumline { margin: 8px 0 0; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.pblock > h3 .hlink { margin-left: 8px; font-size: var(--text-xs); font-weight: 400; }
/* From 600 px each part row is one line: the words are the source link, and Dispute follows the sum. */
@media (min-width: 600px) {
  .ptab th, .ptab td { padding-top: 3px; padding-bottom: 3px; vertical-align: middle; }
  .ptab thead th { padding-top: 0; }
  .ptab .dline { display: inline-block; margin: 0 -4px 0 4px; }
  .ptab .kt .out { display: inline; min-height: 0; }
}

/* Record, chain, where */
.fcard { margin: 0 0 8px; padding: 8px 12px; background: var(--warn-bg); border-left: 3px solid var(--warn); }
.fcard .fk { margin: 0 0 2px; color: var(--warn); font-weight: 600; font-variant-numeric: tabular-nums; }
.fcard .fq { margin: 0 0 4px; }
.fcard .fm { margin: 0; color: var(--ink-muted); }
.factline { display: flex; align-items: center; flex-wrap: wrap; gap: 0 12px; margin-top: 4px; font-size: var(--text-xs); color: var(--ink-muted); }
.factline .tbtn { margin-left: auto; }
.ccard { margin: 0 0 8px; padding: 8px 12px; border: 1px solid var(--accent); border-radius: var(--radius-panel); background: var(--badge-bg); }
.ccard .cl { margin: 0; font-weight: 600; color: var(--accent); }
.ccard.assoc { border-color: var(--tick); background: var(--assoc-bg); }
.ccard.assoc .cl { color: var(--ink); }
.capnote { margin: 0 0 8px; font-size: var(--text-xs); color: var(--ink-muted); }
.chainbox { padding: 8px 12px; border: 1px dashed var(--tick); }
.chainbox p { margin: 0; }
.where { display: flex; gap: 12px; align-items: flex-start; }
.where .plot88 { flex: none; width: 88px; }
.where .wtext { flex: 1 1 auto; min-width: 0; }
.addr { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 8px; }
.webline { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 4px; }
.dom { font-size: var(--text-xs); color: var(--ink-muted); }
.linkbtn { text-decoration: none; }
.branch { display: inline-flex; align-items: center; min-height: 24px; padding: 0; border: 0; background: none; color: var(--accent); text-decoration: underline; text-underline-offset: 0.15em; cursor: pointer; font-variant-numeric: tabular-nums; }

/* Chosen */
.chosen p { margin: 0 0 10px; }
.chosen .pblock p { margin: 0 0 6px; }
.chosen .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }

/* ===== Compare ===== */
.panel.pcompare .pbody { padding: 0 0 24px; }
.gapline { margin: 0; padding: 10px 16px; line-height: 1.45; border-bottom: 1px solid var(--rule); }
.gapline .gsame { display: block; margin-top: 4px; color: var(--ink-muted); }
/* No scroll box of its own at wide and medium, so the Choose bar sticks to the panel's bottom edge. */
.cwrap { padding: 0 16px; position: relative; }
.ctable { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
.ctable col.lab { width: 120px; }
.ctable th, .ctable td { padding: 7px 8px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; font-weight: 400; }
.ctable tbody th { font-size: var(--text-xs); font-weight: 600; color: var(--ink-muted); padding-left: 0; }
.ctable thead th { position: relative; vertical-align: bottom; padding-top: 10px; }
.ctable thead th:not(:first-child) { padding-right: 30px; }
/* Remove sits in the head as a small close mark, so the table needs no last row for it. */
.chrm { position: absolute; top: 8px; right: 4px; width: 24px; height: 24px; }
.ctable tr.choose > td, .ctable tr.choose > th { position: sticky; bottom: 0; z-index: 4; background: var(--surface); box-shadow: 0 -1px 0 var(--rule); }
.ctable tr.choose > td.refcol { background: var(--row-sel); }
.caddr { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.ctable td.refcol, .ctable th.refcol { background: var(--row-sel); }
/* A bar on one edge only: on a full row of differences, outlines turn the table into a grid of boxes. */
.ctable td.dif { box-shadow: inset 2px 0 0 var(--diff-ring); font-weight: 600; }
.ctable td.eq { color: var(--ink-muted); }
.chnb { display: block; width: 100%; margin: 0; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.chnb:hover .chn { text-decoration: underline; text-underline-offset: 0.15em; }
.chn { display: block; font-weight: 600; color: var(--ink); }
.chn .rk { font-size: var(--text-xs); color: var(--ink-muted); font-weight: 400; }
.chk2 { display: block; margin: 2px 0 6px; font-size: var(--text-xs); color: var(--ink-muted); }
.reftag { display: inline-flex; align-items: center; min-height: 24px; font-size: var(--text-xs); font-weight: 600; line-height: 1.25; color: var(--accent); }
.ctable tr.csub th, .ctable tr.csub td { padding-top: 6px; padding-bottom: 2px; border-bottom: 0; font-size: var(--text-xs); color: var(--ink-muted); }
.ctable tbody th .sw { margin-right: 5px; }
.ctable .chip.out { cursor: pointer; font-size: var(--text-xs); text-align: left; }
.ctable .chip.out:hover { text-decoration: underline; text-underline-offset: 0.15em; }
/* Three fixed tracks: only the value wraps, so "adds" and the difference read straight down every column. */
.cv { display: grid; grid-template-columns: minmax(0, 1fr) 40px 50px; column-gap: 4px; align-items: baseline; }
.cv .cn { display: contents; white-space: nowrap; }
.cv .cc, .cv .cdf { text-align: right; white-space: nowrap; }
.cv .cc { grid-column: 2; }
.cv .cdf { grid-column: 3; }
.cbar { display: flex; width: 100%; max-width: 160px; height: 10px; background: var(--track); }
.pkey { display: block; margin-top: 4px; font-size: var(--text-xs); font-weight: 400; line-height: 1.25; color: var(--ink-muted); }
.cbar i { display: block; height: 100%; flex: none; border-right: 1px solid transparent; background-clip: padding-box; }
.ctable .chips { padding: 0; }
/* One line of chip text is the 20 px chip of the rows; a label too long for the column wraps under it. */
.ctable .chip { white-space: normal; height: auto; min-height: 20px; padding: 1px 6px; line-height: 1.25; }
.ctable .chip.cert { border-radius: 10px; }
.ctable .street { display: block; overflow-wrap: anywhere; }
.ctable .merged td { color: var(--ink-muted); }
.ctable .fold td { font-weight: 400; color: var(--ink-muted); background: var(--surface-2); }
.nw-n, .wlab, .sub-n { display: none; }
.ctable .street { margin-bottom: 4px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-data); cursor: pointer; white-space: nowrap; }
.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }

/* ===== Column header: sort buttons, sort note, filtered to nothing ===== */
/* A 24 px target in a 17 px line: the negative margins keep the 36 px two-line header. */
.sortbtn {
  display: inline-flex; align-items: center; gap: 3px; min-height: 24px; margin-block: -4px; padding: 0; border: 0; background: none;
  color: var(--ink); font: inherit; font-weight: 600; line-height: inherit; cursor: pointer; white-space: nowrap;
}
.sortbtn:hover { text-decoration: underline; text-underline-offset: 0.15em; }
.sortbtn .arrow { color: var(--accent); }
.grid thead th[aria-sort] .sortbtn { color: var(--accent); }
.grid .sortnote td {
  height: 24px; padding: 0 6px 0 38px; background: var(--surface); border-bottom: 1px solid var(--rule);
  font-size: var(--text-xs); color: var(--ink-muted);
}
.grid .nothing td { height: auto; padding: 20px 16px 20px 38px; white-space: normal; overflow: visible; }
.nothing p { margin: 0 0 10px; font-size: var(--text-sm); color: var(--ink); }
.nbtns { display: flex; flex-wrap: wrap; gap: 8px; }

/* ===== Filter rail ===== */
.rail { padding: 8px 0 4px; font-size: var(--text-data); line-height: var(--leading-dense); }
.rail-in { display: flex; flex-direction: column; gap: 6px; }
.rnote { margin: 0; padding: 8px 10px; font-size: var(--text-xs); line-height: 1.4; color: var(--ink-muted); border-left: 3px solid var(--tick); background: var(--surface-2); }
.rset { margin: 0; padding: 0; border: 0; min-width: 0; }
.rset > legend, .rlab {
  display: block; padding: 0; margin: 0; height: 18px; line-height: 18px;
  font-size: var(--text-xs); font-weight: 600; color: var(--ink-muted); letter-spacing: 0.02em;
}
.rchk { display: flex; align-items: center; gap: 8px; height: 24px; cursor: pointer; }
.rchk input { flex: none; width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.rchk .rt { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rchk .rn { flex: none; min-width: 24px; text-align: right; font-size: var(--text-xs); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.rchk:hover .rt { text-decoration: underline; text-underline-offset: 0.15em; }
.rchk:has(input:disabled) { cursor: default; color: var(--ink-muted); }
.rchk:has(input:disabled) .rt { text-decoration: none; }
.rsub { margin: 2px 0 2px 24px; font-size: var(--text-xs); line-height: 1.35; color: var(--ink-muted); }
.rfield + .rsub { margin: 4px 0 0; }
.rset .rsub:last-child { margin-bottom: 0; }
.rseg { display: flex; height: 28px; border: 1px solid var(--border-input); border-radius: var(--radius-control); background: var(--surface); }
.rseg label { position: relative; flex: 1 1 0; display: flex; align-items: center; justify-content: center; cursor: pointer; white-space: nowrap; }
.rseg label + label { border-left: 1px solid var(--border-input); }
.rseg label.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.rseg label:first-child { border-radius: 2px 0 0 2px; }
.rseg label:last-child { border-radius: 0 2px 2px 0; }
.rseg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.rseg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; z-index: 1; }
.rseg label:has(input:disabled) { cursor: default; opacity: 0.6; }
.rfield { display: flex; align-items: center; gap: 6px; }
.rfield + .rfield { margin-top: 4px; }
.rflab { flex: none; width: 44px; font-size: var(--text-data); color: var(--ink); }
.rsel {
  flex: 1 1 auto; min-width: 0; width: 100%; height: 28px; padding: 0 2px; font-size: var(--text-data);
  border: 1px solid var(--border-input); border-radius: var(--radius-control); background: var(--surface); color: var(--ink);
}
.rclear .btn { width: 100%; height: 24px; }
.rplot { padding-top: 8px; border-top: 1px solid var(--rule); }

/* ===== Plot (D4) ===== */
.plotsvg { display: block; overflow: visible; }
.plot-bg { fill: var(--surface); stroke: var(--rule); }
.plot-ring { fill: none; stroke: var(--tick); stroke-width: 1; }
.plot-ring.far { stroke-dasharray: 3 3; }
.plot-txt { font-family: var(--font-ui); font-size: 12px; fill: var(--ink-muted); font-variant-numeric: tabular-nums; }
.plot-txt.ringl { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.plot-n { font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.plot-c { fill: var(--ink); }
.dot .d { fill: var(--ink-muted); }
.dot .halo { fill: none; stroke: var(--accent); stroke-width: 1.5; display: none; }
/* The halo is the plot's own fill, so the label reads over any dot or ring under it. */
.dot .dl { display: none; fill: var(--accent); font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.dot.on .d, .dot.focus .d { fill: var(--accent); }
.dot.on .halo, .dot.focus .halo, .dot.on .dl, .dot.focus .dl { display: inline; }
/* The large plot has room to name every dot, so each can be matched to a row. */
.plot296 .dot .dl { display: inline; fill: var(--ink-muted); font-weight: 400; }
.plotcap { margin: 4px 0 0; font-size: var(--text-xs); line-height: 16px; color: var(--ink-muted); }
.plotdesc { margin: 6px 0 0; font-size: var(--text-xs); color: var(--ink-muted); }

/* ===== About this search ===== */
.asearch { padding-top: 6px; }
.ablock { padding: 10px 0; border-bottom: 1px solid var(--rule); }
.ablock:last-child { border-bottom: 0; }
.aline { margin: 0 0 6px; line-height: 1.45; }
.aline:last-child { margin-bottom: 0; }
.aline b { font-weight: 600; }
.ltab { width: 100%; margin: 2px 0 8px; border-collapse: collapse; table-layout: fixed; font-size: var(--text-xs); }
@media (max-width: 599.98px) { .ltab .ldom { white-space: normal; overflow-wrap: anywhere; } }
.ltab th, .ltab td { padding: 4px 0; border-top: 1px solid var(--rule); text-align: left; vertical-align: top; font-weight: 400; }
/* A hanging indent keeps a wrapped reason clear of its count. */
.ltab th { width: 176px; padding-right: 10px; padding-left: 22px; text-indent: -22px; color: var(--ink); }
.lon { text-indent: 0; }
@media (max-width: 599.98px) { .ltab th { width: 120px; } }
.ltab td { color: var(--ink-muted); line-height: 1.5; }
.lon { display: inline-block; min-width: 16px; font-weight: 600; text-align: right; margin-right: 4px; font-variant-numeric: tabular-nums; }
.ldom { white-space: nowrap; }
.ldom:not(:last-child)::after { content: ","; }
.plot296 { margin-top: 2px; }

/* ===== Filters button and sheet ===== */
.facts .filtersbtn { display: none; flex: none; gap: 6px; }
.fcount { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--badge-bg); color: var(--accent); font-size: var(--text-xs); line-height: 16px; text-align: center; font-variant-numeric: tabular-nums; }
@media (min-width: 1280px) { .app.has-cmp .facts .filtersbtn { display: inline-flex; } }
@media (max-width: 1279.98px) { .facts .filtersbtn { display: inline-flex; } }
.sheet { position: fixed; inset: 0; z-index: 50; }
.sheet .scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheetbox {
  position: absolute; top: 0; bottom: 0; left: 0; width: 232px; max-width: calc(100vw - 32px);
  display: flex; flex-direction: column; background: var(--bg); box-shadow: var(--sheet-shadow);
  animation: sheet-in 160ms ease-out;
}
.sheethead { display: flex; align-items: center; flex: none; height: 44px; padding: 0 12px 0 16px; background: var(--surface-2); border-bottom: 1px solid var(--rule); }
.sheethead h2 { margin: 0; font-family: var(--font-voice); font-size: var(--text-md); font-weight: 600; }
.sheethead .btn { margin-left: auto; }
/* While a sheet is open the page behind it holds still, and a fling past the sheet's end stays in it. */
html.sheet-open { overflow: hidden; }
.sheetbody { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 10px 16px 16px; font-size: var(--text-data); line-height: var(--leading-dense); }
.sheetfoot { display: flex; flex-wrap: wrap; flex: none; gap: 8px; padding: 8px 16px; background: var(--surface-2); border-top: 1px solid var(--rule); }
.sheetfoot .btn { height: var(--control-height); }
.sheetfoot .btn.primary { flex: 1 1 auto; }
/* The bar below holds Clear, so the rail's own Clear button is not drawn twice. */
.sheetbody .rclear { display: none; }
@keyframes sheet-in { from { transform: translateX(-100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheetbox { animation: none; } }
/* While the rail is docked, sheet=filters does nothing. */
@media (min-width: 1280px) { .app:not(.has-cmp) ~ .sheet-filters { display: none; } }

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translateX(-50%); max-width: calc(100vw - 32px);
  padding: 10px 14px; border-radius: var(--radius-panel); background: var(--ink); color: var(--bg);
  font-size: var(--text-data); line-height: var(--leading-dense); box-shadow: var(--shadow-popover);
  opacity: 0; visibility: hidden; transition: opacity 120ms ease-out, visibility 0s linear 120ms;
}
.toast.on { opacity: 1; visibility: visible; transition: opacity 120ms ease-out; }
@media (prefers-reduced-motion: reduce) { .toast, .toast.on { transition: none; } }
/* Compare keeps its Choose bar at the bottom at every width; the toast sits above it. */
.app.panel-compare ~ .toast { bottom: 64px; }

/* ===== Skip links ===== */
.skips { position: absolute; top: 0; left: 0; z-index: 80; }
.skip {
  position: absolute; top: -200px; left: 8px; padding: 8px 12px; white-space: nowrap; cursor: pointer;
  background: var(--surface); color: var(--accent); border: 2px solid var(--accent); border-radius: var(--radius-control);
  font-size: var(--text-data); font-weight: 600;
}
.skip:focus { top: 6px; }
#skip-filters:focus { left: 150px; }

/* ===== Prototype switches (top bar group and footer) ===== */
.proto { gap: 12px; padding: 0 10px; height: 34px; }
.ptag { font-size: var(--text-xs); font-weight: 600; color: var(--mark); }
.pfield { display: inline-flex; align-items: center; gap: 6px; }
.plab { font-size: var(--text-xs); color: var(--ink-muted); }
.pseg { display: inline-flex; height: 26px; border: 1px solid var(--border-input); border-radius: var(--radius-control); background: var(--surface); font-size: var(--text-xs); }
.pseg label { position: relative; display: inline-flex; align-items: center; padding: 0 8px; cursor: pointer; white-space: nowrap; color: var(--ink); }
.pseg label + label { border-left: 1px solid var(--border-input); }
.pseg label.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pseg label:first-child { border-radius: 2px 0 0 2px; }
.pseg label:last-child { border-radius: 0 2px 2px 0; }
.pseg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.pseg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; z-index: 1; }
.psel { height: 24px; padding: 0 2px; font-size: var(--text-xs); border: 1px solid var(--border-input); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); }
.fswitch { display: none; align-items: center; gap: 16px; }
.tsum, .tedit, .sfilters, .aselwrap { display: none; }
.ptagline { margin: 8px 0 0; }
.ptagbox { display: inline-block; padding: 1px 6px; border: 1px dashed var(--mark); border-radius: var(--radius-control); color: var(--mark); font-size: var(--text-xs); font-weight: 600; line-height: 16px; }
.f-t { grid-column: 1 / -1; }

/* ===== Message blocks in place of the table ===== */
.msg {
  max-width: 640px; margin: 24px 16px 32px 38px; padding: 20px 24px;
  background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--tick); border-radius: var(--radius-panel);
  font-size: var(--text-sm); line-height: var(--leading-ui);
}
.msg h2 { margin: 0 0 8px; font-family: var(--font-voice); font-size: var(--text-lg); font-weight: 600; line-height: 1.3; }
.msg p { margin: 0 0 6px; }
.msg .ptagline { margin: 0 0 10px; }
.msgact { margin-top: 14px; }

/* ===== Thin state: the box under the empty Near you band ===== */
.grid .thinrow td { height: auto; padding: 10px 16px 12px 38px; white-space: normal; overflow: visible; background: var(--surface); border-bottom: 1px solid var(--rule); }
.thinbox { padding-left: 12px; border-left: 3px solid var(--tick); }
.thinbox h3 { margin: 0 0 2px; font-family: var(--font-voice); font-size: var(--text-sm); font-weight: 600; }
.thinbox p { margin: 0; line-height: 1.45; }
.thinbox b, .thinfirst b { font-weight: 600; }
.thinfirst h3 { margin: 0 0 6px; font-family: var(--font-voice); font-size: var(--text-md); font-weight: 600; }
.thinbtn { width: 100%; height: 44px; justify-content: flex-start; }
.grid .tiefold td { height: auto; padding: 6px var(--gutter); background: var(--surface); border-bottom: 1px solid var(--rule); }
.tiebtn { width: 100%; height: 44px; justify-content: flex-start; font-weight: 600; }

/* ===== About ===== */
.about { max-width: 640px; padding: 8px 0 16px; }
.asec { padding: 24px 0 4px; border-bottom: 1px solid var(--rule); }
.asec:last-child { border-bottom: 0; }
.asec h2 { margin: 0 0 10px; font-family: var(--font-voice); font-size: var(--text-lg); font-weight: 600; line-height: 1.3; }
/* Headings take focus from the index and skip links; only a pointer click hides the ring. */
.asec h2:focus:not(:focus-visible) { outline: none; }
.asec p { margin: 0 0 14px; font-family: var(--font-voice); font-size: var(--text-base); line-height: 26px; }
.asec .dnote p { font-family: var(--font-ui); font-size: var(--text-data); line-height: 1.45; }
.atab { width: 100%; margin: 2px 0 18px; border-collapse: collapse; font-size: var(--text-data); line-height: var(--leading-dense); font-variant-numeric: tabular-nums; }
.atab th, .atab td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; font-weight: 400; }
.atab thead th { padding-top: 0; font-size: var(--text-xs); font-weight: 600; color: var(--ink-muted); }
.atab tbody th { width: 34%; font-weight: 600; }
.asec p.alinks { display: flex; flex-wrap: wrap; gap: 4px 20px; font-family: var(--font-ui); font-size: var(--text-sm); line-height: 1.5; }
.aindex ol { list-style: none; margin: 0; padding: 16px 0 0; }
.aindex a {
  display: flex; align-items: center; min-height: 32px; padding: 5px 10px; border-left: 3px solid transparent;
  color: var(--ink); text-decoration: none; font-size: var(--text-data); line-height: 1.3;
}
.aindex a:hover { background: var(--row-hover); }
.aindex a[aria-current] { border-left-color: var(--accent); background: var(--row-sel); color: var(--accent); font-weight: 600; }
.asel { width: 100%; height: 44px; padding: 0 10px; font-size: var(--text-base); border: 1px solid var(--border-input); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); }

/* ===== Chip row (narrow) ===== */
.chiprow { position: sticky; top: 44px; z-index: 9; display: flex; gap: 8px; padding: 0 var(--gutter); background: var(--bg); border-bottom: 1px solid var(--rule); }
.cchip {
  position: relative; flex: 1 1 auto; min-width: 0; max-width: 180px; height: 44px; margin: 0; padding: 0 8px;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1px;
  border: 1px solid var(--border-input); border-radius: var(--radius-control); background: var(--surface); color: var(--ink);
  font: inherit; line-height: 1.2; text-align: left; cursor: pointer;
}
.chl { font-size: var(--text-xs); color: var(--ink-muted); white-space: nowrap; }
.chv { max-width: 100%; font-size: var(--text-data); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
span.cchip .chl { position: absolute; top: 6px; left: 9px; pointer-events: none; }
/* A select chip has no in-flow text, so it gets the width of its widest value ("Distance",
   "One list") plus the arrow; the two button chips size to their own words. */
.cchip-sort, .cchip-group { flex: 1 1 0; min-width: 74px; }
/* The two button chips keep their words whole; the selects share what is left. */
#chip-filters, #chip-about { flex: none; }
/* Over the chip's 1 px border too, so the whole 44 px chip is the select's target. */
.cchip select {
  position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); padding: 15px 18px 0 9px; margin: 0;
  -webkit-appearance: none; appearance: none; border: 0; border-radius: var(--radius-control); background: transparent;
  color: var(--ink); font-size: var(--text-data); font-weight: 600; cursor: pointer;
}
span.cchip::after {
  content: ""; position: absolute; right: 10px; top: 24px; width: 6px; height: 6px; pointer-events: none;
  border-right: 1.5px solid var(--ink-muted); border-bottom: 1.5px solid var(--ink-muted); transform: rotate(45deg);
}

/* ===== Edit sheet (narrow) ===== */
.eform { display: flex; flex-direction: column; gap: 12px; }
.eform .ferr { margin-top: 4px; }
.eform .note { margin: 0; }
.eform .btn { width: 100%; height: 48px; }

/* ===== marks=1: outline every departure and tag it ===== */
.marks [data-d] { outline: 2px dashed var(--mark); outline-offset: 1px; }
.marks .rchk[data-d], .marks .rfield[data-d], .marks .rplot[data-d], .marks .pbar[data-d],
.marks .plot88[data-d], .marks section[data-d], .marks .ptab[data-d] { position: relative; }
/* Below 600 px the label cell is sticky, which already places its tag. */
@media (min-width: 600px) { .marks .ctable tr[data-d] > th { position: relative; } }
/* Bars in rows stay untagged: sixty tags would bury the rows, and the column header carries the tag. */
.marks th[data-d]::after, .marks .rchk[data-d]::after, .marks .rfield[data-d]::after, .marks .rseg label[data-d]::after,
.marks .rplot[data-d]::after, .marks .pbar[data-d]::after, .marks .plot88[data-d]::after, .marks section[data-d]::after,
.marks .sortbtn[data-d]::after, .marks .ptab[data-d]::after, .marks .cchip[data-d]::after, .marks .ctable tr[data-d] > th::after {
  content: attr(data-d); position: absolute; top: 0; right: 0; z-index: 6; padding: 0 3px;
  font: 600 12px/14px var(--font-ui); color: var(--bg); background: var(--mark); pointer-events: none;
}
/* A compare row carries its mark on the tr, which cannot hold a tag; its label cell shows it. */
.marks .ctable tr[data-d="D1"] > th::after { content: "D1"; top: auto; bottom: 2px; }
/* Column header tags get a band of their own above the names, so no tag covers a word. The sort
   button's tag goes to the band's left and the column's own tag to its right. */
.marks .grid thead th { padding-top: 16px; }
/* A head's outline runs inside its own cell around the name and the note, never through the note. */
.marks .grid thead th[data-d], .marks .grid thead th:has(.sortbtn[data-d]) { outline: 2px dashed var(--mark); outline-offset: -2px; }
.marks .grid thead .sortbtn[data-d] { outline: none; }
.marks .grid .cmphead th { top: 52px; }
.marks .sortbtn[data-d]::after { left: 6px; right: auto; }
.marks .rseg label[data-d]::after { top: -8px; }
/* Rail rows make room on the right for the tag, so it never covers a count, and a label that no
   longer fits beside both wraps instead of losing its last word. */
.marks .rchk[data-d], .marks .rfield[data-d] { padding-right: 24px; }
.marks .rchk[data-d] { height: auto; min-height: 24px; }
.marks .rchk[data-d] .rt { white-space: normal; }
.marks .rchk[data-d]::after, .marks .rfield[data-d]::after { top: 50%; transform: translateY(-50%); }
.marks .rplot[data-d]::after { top: auto; bottom: 0; }
/* The gap between "Part" and "What is known" is the one free spot in the parts table's header. */
.marks .ptab[data-d]::after { right: auto; left: 40px; }

/* ===== Wide: panel docked beside the list ===== */
@media (min-width: 1280px) {
  .shell.with-panel.with-compare { grid-template-columns: minmax(0, 1fr) var(--panel-w-compare); }
  .shell.with-compare .rail { display: none; }
  /* With no panel, slack past 1280 goes to Record first, up to the widest filled chip set on one
     line, then to Shop. The list is 100vw less 248 px; the other columns and Shop's 192 take 740. */
  .grid:not(.nar) col.c-record { width: clamp(292px, calc(100vw - 988px), 440px); }
  /* Slack beside a shop goes to Record first, up to the widest one-line sparse chip set, then to
     Shop. Shop keeps 184 px; a sorted column in Score's place (--sc) takes its width from Record. */
  .grid.nar-shop col.c-record { width: clamp(222px, calc(100vw - 974px - var(--sc, 48px)), 292px); }
}
@media (min-width: 1440px) { :root { --panel-w-compare: 920px; } }
/* Beside a docked panel (wide, and medium for shop, chosen and search) the table keeps fewer columns. */
@media (min-width: 1024px) {
  .grid.nar col.c-score { width: 48px; }
  .grid.nar .sbar, .grid.nar .tiemark { display: none; }
  .grid.nar .sacc { display: block; }
  /* Every name starts with "Example", so the part that tells shops apart is the part an ellipsis
     cuts. # and vs give Shop what their widest text ("O10", "-0.078 People") does not use. */
  .grid.nar col.c-rank { width: 32px; }
  .grid.nar td.c-rank, .grid.nar thead th.c-rank { padding: 0 3px; }
  .grid.nar-shop col.c-rank { width: 28px; }
  .grid.nar-shop td.c-rank, .grid.nar-shop thead th.c-rank { padding: 0 0 0 2px; letter-spacing: 0; }
  .grid.nar col.c-against { width: 96px; }
  .grid.nar td.c-against, .grid.nar thead th.c-against { padding: 0 4px; }
  .grid.nar-shop col.c-dist { width: 76px; }
  .grid.nar-shop td.c-dist, .grid.nar-shop thead th.c-dist { padding: 0 2px 0 3px; }
  .grid.nar-shop col.c-sells { width: 96px; }
  /* Rendered chips run a few px past the spec's estimate; this keeps n4's two chips on one line. */
  .grid.nar-shop td.c-record { padding: 0 2px 0 4px; }
  .grid.nar-shop .chips { column-gap: 4px; }
}

/* ===== Below wide: the rail folds into a sheet; Place and Theme move to the footer ===== */
@media (max-width: 1279.98px) {
  .rail { display: none; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .shell.with-panel { grid-template-columns: minmax(0, 1fr); }
  .proto .pf-place, .proto .pf-theme { display: none; }
  .footer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
  .fswitch { display: flex; }
  .view-start .sfilters { display: inline-flex; margin-top: 16px; }
}

/* ===== Medium: the panel is a drawer over the list from the right ===== */
@media (min-width: 1024px) and (max-width: 1279.98px) {
  .app { grid-template-rows: 44px auto auto minmax(0, 1fr); }
  .facts { height: auto; min-height: 32px; padding: 5px var(--gutter); white-space: normal; }
  .facts .ftext { overflow: visible; line-height: 1.35; }
  /* The drawer hangs from the shell, under the facts strip, so the accuracy line and "About this
     search" stay readable and clickable however many lines the strip wraps to. */
  /* Clipped sideways so the drawer's slide-in never widens the page. */
  .shell { position: relative; overflow-x: clip; }
  .panel {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 30; width: min(var(--panel-w), calc(100vw - 32px));
    border-inline: 1px solid var(--rule); box-shadow: var(--drawer-shadow); animation: drawer-in 160ms ease-out;
  }
  .app.panel-compare .panel { width: min(var(--panel-w-compare), calc(100vw - 32px)); }
  /* Shop, chosen and search dock beside the narrowed list, as at wide; only compare is too wide to dock.
     The list is 100vw less 514 px here; 244 px is the box, # and Shop's 184. */
  .shell.with-panel:not(.with-compare) { grid-template-columns: minmax(0, 1fr) var(--panel-w); column-gap: 16px; }
  .shell.with-panel:not(.with-compare) .panel { position: relative; width: auto; box-shadow: none; animation: none; }
  .grid.nar-shop col.c-record { width: clamp(200px, calc(100vw - 758px - var(--sc, 48px)), 292px); }
  .view-about .shell { grid-template-columns: var(--rail-w) minmax(0, 1fr); }
  .view-about .rail { display: block; }
}
@keyframes drawer-in { from { transform: translateX(100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none !important; } }

/* ===== Narrow: one scrolling column; each row is a three-line block ===== */
@media (max-width: 1023.98px) {
  /* A short results page (a message, the chosen shop) still ends on the list's own surface,
     not on a second color under the footer. */
  .app { display: block; height: auto; }
  .app.view-results, .app.view-searching { min-height: 100vh; min-height: 100dvh; background: var(--surface); }
  .topbar { position: sticky; top: 0; z-index: 10; gap: 8px; }
  .tform { display: none !important; }
  .wordmark { width: auto; }
  .view-results .wordmark > span, .view-searching .wordmark > span { display: none; }
  .view-results .tsum, .view-searching .tsum {
    display: block; flex: 1 1 auto; min-width: 0; margin: 0; font-size: var(--text-data); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .view-results .tedit, .view-searching .tedit { display: inline-flex; flex: none; }
  .view-results .tspacer, .view-searching .tspacer, .view-results .aboutlink, .view-searching .aboutlink { display: none; }
  .proto { padding: 0 3px; height: 32px; gap: 0; }
  .proto .ptag, .proto .plab { display: none; }
  .proto .pseg { height: 26px; }
  /* 44 px targets on top-bar controls without a taller bar: each control's own box is 44 px tall,
     and the visible part is drawn inside it (a transparent border, or an inner span). */
  .topbar .pseg label { height: 44px; margin-block: -10px; border-block: 10px solid transparent; background-clip: padding-box; }
  .tedit { min-width: 44px; height: 44px; margin: 0; padding: 0; border: 0; background: none; align-items: center; justify-content: center; cursor: pointer; }
  .tedit .btn { height: 26px; }
  .tedit:focus-visible { outline-offset: -2px; }
  .wordmark { min-width: 44px; height: 44px; }
  .aboutlink { width: auto; height: 44px; display: inline-flex; align-items: center; padding: 0 4px; }
  /* The 44 px target is drawn past the link, so the footer's first line keeps the same height as the rest. */
  .footer .flink { position: relative; }
  .footer .flink::after { content: ""; position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); }
  .msg .btn, .fswitch .pseg label { min-height: 44px; }
  .fswitch .pseg label { margin-block: -1px; }
  .view-start .sfilters { height: var(--control-height); }
  .asec p.alinks .out, .dnote .btn, .panel .branch { display: inline-flex; align-items: center; min-height: 44px; }

  .facts { height: auto; min-height: 40px; padding: 6px var(--gutter); white-space: normal; line-height: var(--leading-dense); }
  .facts .ftext { overflow: visible; }
  .fsum { display: flex; flex-direction: column; color: var(--ink); }
  .facts .filtersbtn, .facts #aboutsearch { display: none !important; }

  .shell { display: block; padding: 0; }
  .col { overflow: visible; border-inline: 0; }
  .view-start .col, .view-about .col { padding: 0 var(--gutter); }
  .footer { padding: 12px var(--gutter) 16px; }
  .view-start .footer, .view-about .footer { padding: 16px 0; }
  .fswitch .pseg, .fswitch .psel { height: 44px; }
  .fswitch .pseg label { padding: 0 14px; }
  .qcard { margin: 16px var(--gutter); width: auto; max-width: none; }
  .grid.searching { display: none; }
  .msg { margin: 16px var(--gutter) 24px; padding: 16px; }

  /* The same table markup, restacked. */
  .grid, .grid > tbody { display: block; width: 100%; }
  .grid > colgroup { display: none; }
  .grid > thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .grid tr.srow {
    display: grid; grid-template-columns: 28px auto minmax(0, 1fr) minmax(84px, auto) 44px; grid-template-rows: auto 18px auto;
    align-items: center; min-height: var(--row-narrow); padding: 6px var(--gutter);
    background: var(--surface); border-bottom: 1px solid var(--rule);
  }
  .grid tr.srow > td, .grid tr.srow > th { display: block; height: auto; min-width: 0; padding: 0; border: 0; background: none; }
  .grid tr.srow:hover, .grid tr.srow:focus-within { background: var(--row-hover); }
  .grid tr.srow.sel { background: var(--row-sel); box-shadow: inset 3px 0 0 var(--accent); }
  .grid tr.srow.sel > td:first-child { box-shadow: none; }
  .grid tr.srow > .c-rank { grid-area: 1 / 1; line-height: 20px; align-self: start; }
  .grid tr.srow > .c-shop { grid-area: 1 / 2 / 2 / 4; padding-right: 6px; }
  /* The word after "Example" is what tells shops apart, so a long name takes a second line instead of an ellipsis. */
  .grid tr.srow .name {
    font-size: var(--text-sm); line-height: 20px; white-space: normal;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  }
  .grid tr.srow > td.c-score { grid-area: 1 / 4; padding: 0; overflow: visible; align-self: start; line-height: 20px; }
  .grid tr.srow > td.c-cmp { grid-area: 1 / 5 / 4 / 6; align-self: stretch; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .grid tr.srow .cmpbox { width: 20px; height: 20px; }
  .grid tr.srow > td.c-dist { grid-area: 2 / 1 / 3 / 3; line-height: 18px; overflow: visible; }
  .grid tr.srow > td.c-sells { grid-area: 2 / 3 / 3 / 5; line-height: 18px; }
  .grid tr.srow > td.c-sells::before { content: "·"; padding: 0 6px 0 5px; color: var(--ink-muted); }
  .grid tr.srow > td.c-record { grid-area: 3 / 1 / 4 / 5; }
  .grid tr.srow > td.c-people, .grid tr.srow > td.c-planet { display: none; }
  .grid tr.srow .chips { padding: 0; gap: 2px 6px; }
  .grid tr.srow .scorewrap { gap: 6px; }
  .grid tr.srow .sbar { width: 44px; height: 8px; }
  .grid tr.srow .snum { min-width: 34px; font-size: var(--text-sm); }
  /* The tie mark sits under the number, on line 2, so every row's bar and number share one x. */
  .grid tr.srow .tiemark { position: absolute; right: 0; top: 21px; margin: 0; line-height: 16px; }
