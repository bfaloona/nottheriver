/* ======================================================================
   Data: build(spec) returns { request, response } in the live shape
   ====================================================================== */
// The one place a web scheme is written; every built link is data only and never fetched.
const WEB = 'https://';

function round3(x) { return Math.sign(x) * Math.round(Math.abs(x) * 1000 + 1e-6) / 1000; }
function round4(x) { return Math.round(x * 10000 + 1e-7) / 10000; }
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function domainOf(name) { return slug(name.replace(/^Example /, '').replace(/ - Example .*$/, '')) + '.example'; }
function titleCase(s) { return s.replace(/\b[a-z]/g, (c) => c.toUpperCase()); }

function findBand(f) {
  // Open cases count as minor whatever the amount; repeat and willful citations count as standard.
  if (f.status === 'open') return 'minor';
  if (f.citation_type === 'repeat' || f.citation_type === 'willful') return 'standard';
  if (f.usd == null) return 'standard';
  if (f.usd >= 1000000) return 'major';
  if (f.usd >= 100000) return 'standard';
  return 'minor';
}

let caseNo = 1000;
function build(spec) {
  const q = spec.query;
  const request = { product: q.product, city: q.city, state: q.state, lat: spec.at.lat, lon: spec.at.lon, ruca: spec.at.ruca };
  const out = { local: [], local_farther: [], online: [] };
  const domainCount = {};
  spec.shops.forEach((sp) => {
    const local = sp.sec !== 'online';
    const domain = domainOf(sp.name);
    domainCount[domain] = (domainCount[domain] || 0) + 1;
    const km = local && sp.mi != null ? Math.round(sp.mi / MI_PER_KM * 10) / 10 : null;
    let lat = null, lon = null;
    if (km != null) {
      const b = DIRS.indexOf(sp.dir) * 45 * Math.PI / 180;
      lat = round4(spec.at.lat + km * Math.cos(b) / 111.32);
      lon = round4(spec.at.lon + km * Math.sin(b) / (111.32 * Math.cos(spec.at.lat * Math.PI / 180)));
    }
    const url = sp.home ? WEB + domain + '/'
      : local ? WEB + domain + '/stores/' + slug(q.city) : WEB + domain + '/p/' + slug(q.product);

    const certifications = (sp.certs || []).map((kind) => ({
      kind, label: CERT_LABEL[kind],
      source_url: WEB + 'certifier-directory.example/' + (CERT_SLUG[kind] || kind.replace(/_/g, '-')) + '/' + domain.replace('.example', ''),
      checked: '2026-09-23',
    }));
    const actionIx = {};
    const signals = (sp.finds || []).map((f) => {
      const src = SOURCES[f.kind];
      actionIx[f.kind] = (actionIx[f.kind] || 0);
      const action = src.actions[actionIx[f.kind]++ % src.actions.length];
      const band = findBand(f);
      const s = {
        kind: f.kind, polarity: 'negative',
        claim: `${src.name} announces settlement with ${f.relation === 'related' ? 'the parent company of ' : ''}${sp.name} ${action}`,
        source_url: WEB + src.host + '/cases/' + (++caseNo), origin: 'curated', action_date: f.date,
        penalty_usd: f.usd, relation: f.relation, status: f.status, band,
        cost: 0.25 * BAND_WEIGHT[band] * RELATION_WEIGHT[f.relation],
      };
      if (f.citation_type) s.citation_type = f.citation_type;
      return s;
    });

    const relevance = { likely: 1, named: 1, may: 0.5, category: 0.5, unconfirmed: 0.2 }[sp.sells];
    const partOf = (part) => {
      const kinds = new Set(certifications.filter((c) => CERT_PART[c.kind] === part).map((c) => c.kind));
      let v = Math.min(1, 0.5 + 0.25 * kinds.size);
      const fs = signals.filter((s) => FIND_PART[s.kind] === part);
      const minor = fs.filter((s) => s.band === 'minor').reduce((a, s) => a + s.cost, 0);
      const other = fs.filter((s) => s.band !== 'minor').reduce((a, s) => a + s.cost, 0);
      v = Math.max(0, v - other - Math.min(0.25, minor));
      const sources = [{ label: 'Starts at 0.50', url: ABOUT_ORDER }]
        .concat(certifications.filter((c) => CERT_PART[c.kind] === part).map((c) => ({ label: c.label, url: c.source_url })))
        .concat(fs.map((s) => ({ label: `${FIND_KIND[s.kind]}: ${s.claim}`, url: s.source_url })));
      return { value: v, sources, cap: minor > 0.25 };
    };
    const ethics = partOf('ethics');
    const env = partOf('env');
    let proximity, proxSources;
    if (!local) { proximity = 0.5; proxSources = [{ label: 'Same 0.50 for every online shop', url: ABOUT_ORDER }]; }
    else if (km == null) { proximity = 0; proxSources = []; }
    else {
      proximity = Math.max(0, 1 - km / 40);
      proxSources = proximity > 0 ? [{ label: `${fmtMilesNum(km)} mi (${km} km) from your zip area`, url: ABOUT_ORDER }] : [];
    }
    const listingTitle = sp.sells === 'named' ? `${titleCase(q.product)} | ${sp.name}`
      : sp.sells === 'category' ? `${titleCase(q.category)} | ${sp.name}` : sp.name;
    const relSources = local
      ? [{ label: `Model judgment: ${sp.sells === 'likely' ? 'likely sells it' : 'may sell it'}`, url }]
      : [{ label: listingTitle, url }];
    const comp = (name, value, sources, cap) => {
      const c = { name, value: round4(value), weight: WEIGHTS[name], contribution: round3(WEIGHTS[name] * value), sources };
      if (name === 'ethics' || name === 'env') c.minor_cap_applied = !!cap;
      return c;
    };
    const raw = WEIGHTS.relevance * relevance + WEIGHTS.ethics * ethics.value + WEIGHTS.env * env.value + WEIGHTS.proximity * proximity;
    const res = {
      id: local ? `local:${domain}:${domainCount[domain] - 1}` : `online:${domain}`,
      kind: local ? 'local' : 'online', rank: sp.rank,
      retailer: { name: sp.name, domain, url },
      matched_product: sp.sells === 'named' ? q.product : '',
      snippet: sp.snippet != null ? sp.snippet : `Online shop: ${q.category}.`,
      address: local ? (sp.address != null ? sp.address : '') : null,
      distance_km: km, lat, lon, certifications, signals,
      score: round3(raw),
      components: [
        comp('relevance', relevance, relSources),
        comp('ethics', ethics.value, ethics.sources, ethics.cap),
        comp('env', env.value, env.sources, env.cap),
        comp('proximity', proximity, proxSources),
      ],
    };
    if (sp.chain) res.chain = { label: sp.chain.label, stores: sp.chain.stores, source_url: WEB + domain + '/about', checked: '2026-09-28' };
    if (sp.want != null && Math.abs(res.score - sp.want) > 1e-9) {
      console.error(`build: ${sp.sec} ${sp.rank} ${sp.name} scored ${res.score}, spec says ${sp.want}`);
    }
    (sp.sec === 'near' ? out.local : sp.sec === 'far' ? out.local_farther : out.online).push(res);
  });
  const response = {
    query: Object.assign({}, q), weights: Object.assign({}, WEIGHTS),
    local: out.local, local_farther: out.local_farther, online: out.online,
    usage: Object.assign({}, spec.usage), dropped: spec.dropped.slice(),
  };
  return { request, area: spec.at.area, response };
}

const SEARCHES = {};
Object.keys(SPECS).forEach((k) => { SEARCHES[k] = build(SPECS[k]); });

/* ======================================================================
   Formatters
   ====================================================================== */
function milesOf(km) { return km == null ? null : km * MI_PER_KM; }
// Miles to show: one decimal under 10 mi, whole miles from 10.
function fmtMilesNum(km) {
  const mi = milesOf(km);
  if (mi == null) return null;
  return mi < 9.95 ? (Math.round(mi * 10 + 1e-6) / 10).toFixed(1) : String(Math.round(mi));
}
function fmtMiles(km) { const n = fmtMilesNum(km); return n == null ? null : n + ' mi'; }
function compass(lat, lon, center) {
  if (lat == null || lon == null || !center) return null;
  const dy = lat - center.lat;
  const dx = (lon - center.lon) * Math.cos(center.lat * Math.PI / 180);
  const deg = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
  return DIRS[Math.round(deg / 45) % 8];
}
function fmt2(x) { return (Math.round(x * 100 + 1e-6) / 100).toFixed(2); }
function fmt3(x) { return round3(x).toFixed(3); }
// A part's value or a finding's size: two places, since four would claim more than a 62 to 64% accuracy supports.
// Only "adds" and the score keep three places, as the search returns them.
function fmtVal(v) { return fmt2(v); }
function fmtSigned3(x) { const r = round3(x); return (r > 0 ? '+' : r < 0 ? '-' : '') + Math.abs(r).toFixed(3); }
function fmtInt(n) { return Number(n).toLocaleString('en-US'); }
function plural(n, one, many) { return n === 1 ? one : (many || one + 's'); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function yearOf(d) { return d ? d.slice(0, 4) : ''; }
// A search's cost in whole cents: a tenth of a cent is a figure for the ledger, not for a shopper.
function fmtCents(usd) { const c = Math.max(1, Math.round(usd * 100)); return `about ${c} ${plural(c, 'cent')}`; }

/* ======================================================================
   State and hash
   The hash is the only state. Product text and zip never enter it.
   ====================================================================== */
const DEFAULTS = {
  view: 'start', data: 'sparse', place: 'metro', theme: 'auto', marks: '0', state: '',
  sort: 'score', group: 'kind', kind: ['near', 'far', 'online'], f: [], within: 'any',
  people: 'any', planet: 'any', panel: 'none', shop: '', sec: '', cmp: [], ref: '',
  only: 'all', dispute: 'none', sheet: 'none', ties: 'fold',
};
const KEY_ORDER = Object.keys(DEFAULTS);
const ENUMS = {
  view: ['start', 'searching', 'results', 'about'], data: ['sparse', 'filled'], place: ['metro', 'rural'],
  theme: ['auto', 'light', 'dark'], marks: ['0', '1'],
  sort: ['score', 'distance', 'name', 'sells', 'people', 'planet'], group: ['kind', 'none'],
  within: ['any', '1', '3', '5', '10', '25'], people: ['any', 'up', 'down'], planet: ['any', 'up', 'down'],
  panel: ['none', 'shop', 'compare', 'chosen', 'search'], only: ['all', 'diff'],
  sheet: ['none', 'filters', 'edit'], ties: ['fold', 'open'],
};
const LISTS = { kind: ['near', 'far', 'online'], f: ['record', 'cert', 'finding', 'nofinding', 'chain', 'nochain', 'sure'] };
const VIEW_STATES = {
  start: ['typing', 'err-product', 'err-zip', 'err-zip-unknown'],
  results: ['empty', 'thin', 'no-online', 'no-near', 'failed', 'rate', 'budget'],
};
const SECS = { shop: ['score', 'record', 'where'], about: ['order', 'accuracy', 'privacy', 'amazon', 'cost', 'dispute', 'credits'] };
const ID_RE = /^[nfo][1-9]\d?$/;
const DISPUTE_RE = /^(none|sells|people|planet|distance|chain|cert[1-9]\d?|finding[1-9]\d?)$/;

function parseHash(h) {
  const raw = {};
  String(h || '').replace(/^#/, '').split('&').forEach((p) => {
    if (!p) return;
    const i = p.indexOf('=');
    let k, v;
    try {
      k = decodeURIComponent(i < 0 ? p : p.slice(0, i));
      v = i < 0 ? '' : decodeURIComponent(p.slice(i + 1));
    } catch (e) { return; }
    if (Object.prototype.hasOwnProperty.call(DEFAULTS, k) && !(k in raw)) raw[k] = v;
  });
  const s = {};
  KEY_ORDER.forEach((k) => {
    const d = DEFAULTS[k];
    const v = raw[k];
    if (v === undefined) { s[k] = Array.isArray(d) ? d.slice() : d; return; }
    if (ENUMS[k]) { s[k] = ENUMS[k].includes(v) ? v : d; return; }
    if (LISTS[k]) {
      const given = v.split(',');
      const ok = LISTS[k].filter((x) => given.includes(x));
      // An empty value is a real choice (every kind off); a value with nothing valid falls back.
      s[k] = v === '' ? [] : (ok.length ? ok : d.slice());
      return;
    }
    if (k === 'cmp') {
      const outIds = [];
      v.split(',').forEach((x) => { if (ID_RE.test(x) && !outIds.includes(x) && outIds.length < 4) outIds.push(x); });
      s[k] = outIds;
      return;
    }
    if (k === 'shop' || k === 'ref') { s[k] = ID_RE.test(v) ? v : ''; return; }
    s[k] = v;
  });
  if (!(VIEW_STATES[s.view] || []).includes(s.state)) s.state = '';
  const secOk = s.view === 'about' ? SECS.about : s.panel === 'shop' ? SECS.shop : [];
  if (!secOk.includes(s.sec)) s.sec = '';
  if (!DISPUTE_RE.test(s.dispute)) s.dispute = 'none';
  return s;
}

function serialize(s) {
  const parts = [];
  KEY_ORDER.forEach((k) => {
    const d = DEFAULTS[k];
    let v = s[k];
    if (Array.isArray(d)) {
      v = (v || []).slice();
      const canon = LISTS[k] ? LISTS[k].filter((x) => v.includes(x)) : v;
      if (canon.join(',') === d.join(',')) return;
      parts.push(k + '=' + canon.join(','));
      return;
    }
    if (v == null || v === d) return;
    parts.push(k + '=' + encodeURIComponent(v));
  });
  return parts.join('&');
}

let state = parseHash(location.hash);

// History: a view change, opening a panel and opening a sheet push an entry; everything else replaces
// the current one. Each entry this page writes carries { ov, clean }: ov counts the panel and sheet
// layers pushed on top of a plain view, and clean says that view had no panel or sheet, so closing
// can step back to it instead of adding an entry. A typed hash has no such state.
function histState() { return history.state && typeof history.state.ov === 'number' ? history.state : null; }
function curOv() { const h = histState(); return h ? h.ov : 0; }
function setState(patch, push, extra) {
  const next = Object.assign({}, state, patch);
  const viewChange = 'view' in patch && patch.view !== state.view;
  if (push === undefined) {
    push = viewChange
      || ('panel' in patch && patch.panel !== state.panel && patch.panel !== 'none')
      || ('sheet' in patch && patch.sheet !== state.sheet && patch.sheet !== 'none');
  }
  const h = '#' + serialize(next);
  const here = location.hash || '#';
  if (h === here && !push) { state = parseHash(h); render(); return; }
  if (push) {
    const hs = histState();
    const ov = viewChange ? 0 : curOv() + 1;
    const clean = viewChange || !hs || hs.ov === 0 ? state.panel === 'none' && state.sheet === 'none' : !!hs.clean;
    const sheet = !viewChange && 'sheet' in patch && patch.sheet !== 'none';
    history.pushState(Object.assign({ ov, clean, sheet, from: '' }, extra || {}), '', h);
  } else {
    const plain = next.panel === 'none' && next.sheet === 'none';
    history.replaceState(Object.assign({ ov: 0, clean: true }, histState() || {},
      plain ? { ov: 0, clean: true, sheet: false, from: '' } : {}, extra || {}), '', h);
  }
  state = parseHash(h);
  render();
}

// Back and Forward step through views, panels and sheets. Picks and list settings are selections,
// not places, so an entry left by Back or Forward takes the current ones (a typed hash is taken as is).
const CARRY = ['data', 'place', 'theme', 'sort', 'group', 'kind', 'f', 'within', 'people', 'planet', 'cmp', 'ref', 'ties', 'only'];
function onHashChange() {
  const next = parseHash(location.hash);
  if (histState()) {
    const fromKey = next.data + '-' + next.place, toKey = state.data + '-' + state.place;
    if (fromKey !== toKey) Object.assign(next, carryOpen(next, fromKey, toKey));
    CARRY.forEach((k) => { next[k] = Array.isArray(state[k]) ? state[k].slice() : state[k]; });
    history.replaceState(histState(), '', '#' + serialize(next));
    // An entry this page wrote is a search under way, not a picture of one, so it moves on again.
    if (next.view === 'searching') searchStarted = true;
  }
  // A panel opened or swapped by Back or Forward takes focus at its heading, as a click open does.
  if (next.panel !== 'none' && (next.panel !== state.panel || next.shop !== state.shop)) pendingFocus = '#panel-h';
  state = parseHash(location.hash);
  render();
}

// What an open shop keeps when the data set changes under it: the same shop by domain, and a note
// open on a part or the chain. Certifications and findings are numbered within one shop's record,
// so a note on one of them would land on a different fact in the other set. Place clears both.
function carryOpen(s, fromKey, toKey) {
  const samePlace = fromKey.split('-')[1] === toKey.split('-')[1];
  return {
    shop: samePlace ? carryId(fromKey, toKey, s.shop) : '',
    dispute: samePlace && !/^(cert|finding)/.test(s.dispute) ? s.dispute : 'none',
  };
}

/* ======================================================================
   Search and rows
   ====================================================================== */
// Canned results states. Each gets one memoized response copy, because the row cache is keyed
// by the response object: a fresh copy per render would grow it without end.
const CANNED = {
  empty: { local: [], local_farther: [], online: [] },
  thin: { local: [] },
  'no-near': { local: [] },
  'no-online': { online: [] },
};
const NO_RESPONSE = ['failed', 'rate', 'budget'];
const CANNED_CACHE = new Map();
function getSearch(st) {
  const base = st.data + '-' + st.place;
  const s = SEARCHES[base];
  const canned = st.view === 'results' && st.state ? st.state : '';
  if (!canned) return { key: base, status: 'ok', state: '', request: s.request, area: s.area, query: s.response.query, response: s.response };
  const key = base + '|' + canned;
  if (!CANNED_CACHE.has(key)) {
    const response = NO_RESPONSE.includes(canned) ? null : Object.assign({}, s.response, CANNED[canned]);
    CANNED_CACHE.set(key, { key, status: response ? 'ok' : canned, state: canned, request: s.request, area: s.area, query: s.response.query, response });
  }
  return CANNED_CACHE.get(key);
}
// A message block takes the table's place: nothing found, or no search came back.
function isMessage(search) { return !search.response || search.state === 'empty'; }

// Wide docks the rail and the panel; medium folds the rail into a sheet and lays the panel over
// the list as a drawer; narrow restacks everything into one scrolling column.
const MQ_WIDE = window.matchMedia('(min-width: 1280px)');
const MQ_NARROW = window.matchMedia('(max-width: 1023.98px)');
function layout() { return MQ_WIDE.matches ? 'wide' : MQ_NARROW.matches ? 'narrow' : 'medium'; }

const VM_CACHE = new Map();
function shopsOf(search) {
  const resp = search.response;
  if (!resp) return [];
  if (VM_CACHE.has(resp)) return VM_CACHE.get(resp);
  const list = [];
  [['near', resp.local], ['far', resp.local_farther || []], ['online', resp.online]].forEach(([sec, arr]) => {
    arr.forEach((res, i) => list.push(toVM(res, sec, i, arr.length, search.request)));
  });
  const byDomain = {};
  list.forEach((vm) => { (byDomain[vm.domain] = byDomain[vm.domain] || []).push(vm); });
  list.forEach((vm) => {
    const same = byDomain[vm.domain];
    if (vm.sec !== 'online' && same.length > 1) {
      vm.street = vm.res.address ? vm.res.address.split(',')[0] : '';
      vm.branches = same.filter((o) => o !== vm).map((o) => o.id);
    }
  });
  VM_CACHE.set(resp, list);
  return list;
}

function toVM(res, sec, index, secTotal, request) {
  const comp = {};
  res.components.forEach((c) => { comp[c.name] = c; });
  const local = res.kind === 'local';
  let sells;
  if (local) sells = comp.relevance.value >= 1 ? 'likely' : 'may';
  else sells = comp.relevance.value >= 1 ? 'named' : comp.relevance.value >= 0.5 ? 'category' : 'unconfirmed';
  const scored = res.certifications.filter((c) => CERT_PART[c.kind]);
  const finds = res.signals.slice().sort((a, b) => String(b.action_date).localeCompare(String(a.action_date)));
  const count = (arr, map, part) => arr.filter((x) => map[x.kind] === part).length;
  return {
    id: SEC_LETTER[sec] + res.rank,
    sec, res, rank: res.rank, place: index + 1, secTotal,
    name: res.retailer.name, domain: res.retailer.domain,
    km: res.distance_km, mi: milesOf(res.distance_km),
    dir: compass(res.lat, res.lon, request),
    sells,
    parts: { sells: comp.relevance, people: comp.ethics, planet: comp.env, dist: comp.proximity },
    score: res.score,
    certs: scored,
    assoc: res.certifications.some((c) => c.kind === 'independent_retailer_assoc'),
    finds,
    chain: res.chain || null,
    unknown: scored.length === 0 && finds.length === 0,
    peopleUp: count(scored, CERT_PART, 'ethics'), peopleDown: count(finds, FIND_PART, 'ethics'),
    planetUp: count(scored, CERT_PART, 'env'), planetDown: count(finds, FIND_PART, 'env'),
    street: '', branches: [],
  };
}

// Ids follow rank, so one shop has a different id in each data set. Carry by domain; where a
// domain has two branches, the first by rank maps to the first. '' when the domain is missing.
function carryId(fromKey, toKey, id) {
  const from = shopsOf(SEARCHES[fromKey]);
  const to = shopsOf(SEARCHES[toKey]);
  const vm = from.find((v) => v.id === id);
  if (!vm) return '';
  const i = from.filter((v) => v.domain === vm.domain).indexOf(vm);
  const t = to.filter((v) => v.domain === vm.domain)[i];
  return t ? t.id : '';
}
function carryIds(fromKey, toKey, ids) { return ids.map((id) => carryId(fromKey, toKey, id)).filter(Boolean); }

function gap(shop, ref) {
  const d = (k) => round3(shop.parts[k].contribution - ref.parts[k].contribution);
  return { sells: d('sells'), people: d('people'), planet: d('planet'), dist: d('dist'), score: round3(shop.score - ref.score) };
}

function byIdOf(search) {
  const m = {};
  shopsOf(search).forEach((vm) => { m[vm.id] = vm; });
  return m;
}

// The dispute controls a shop's panel draws; the hash may only open one of these.
function disputeKeys(vm) {
  const keys = ['sells', 'people', 'planet', 'distance'];
  if (vm.chain) keys.push('chain');
  vm.res.certifications.forEach((c, i) => keys.push('cert' + (i + 1)));
  vm.finds.forEach((f, i) => keys.push('finding' + (i + 1)));
  return keys;
}

// Section 2 fallbacks for ids that do not fit the current search. Returns a fixed copy.
function normalize(st, search) {
  if (!search || !search.response) return st;
  const ids = byIdOf(search);
  const s = Object.assign({}, st);
  s.cmp = st.cmp.filter((id) => ids[id]);
  if ((s.panel === 'shop' || s.panel === 'chosen') && !ids[s.shop]) s.panel = 'none';
  if (s.panel === 'compare' && s.cmp.length < 2) s.panel = 'none';
  if (!s.cmp.includes(s.ref)) s.ref = s.cmp[0] || '';
  if (s.dispute !== 'none' && !(s.panel === 'shop' && disputeKeys(ids[s.shop]).includes(s.dispute))) s.dispute = 'none';
  if (s.panel !== 'shop' && SECS.shop.includes(s.sec)) s.sec = '';
  // A shop id belongs to its panel; left behind, the Data switch would carry it and a later open would differ.
  if (s.panel !== 'shop' && s.panel !== 'chosen') s.shop = '';
  return s;
}

/* ======================================================================
   Filters and sorts
   Filters only hide rows and sorts only reorder them; neither touches a score or a label.
   ====================================================================== */
const ALL_KINDS = ['near', 'far', 'online'];
const F_TEST = {
  record: (vm) => !vm.unknown,
  cert: (vm) => vm.certs.length > 0,
  finding: (vm) => vm.finds.length > 0,
  nofinding: (vm) => vm.finds.length === 0,
  chain: (vm) => !!vm.chain,
  nochain: (vm) => !vm.chain,
  sure: (vm) => vm.parts.sells.value >= 1,
};
const F_LABEL = {
  record: 'Any record on file', cert: 'Has a certification', finding: 'Has a finding', nofinding: 'No finding on file',
  chain: 'On the chain list', nochain: 'Not on the chain list', sure: 'Likely or named',
};
const PART_FILTER_LABEL = { up: 'raised by a certification', down: 'lowered by a finding' };

// Within compares the miles a shopper sees, so a row reading "3.0 mi" stays under "3 mi".
function withinOk(vm, within) {
  if (within === 'any' || vm.sec === 'online') return true;
  if (vm.km == null) return false;
  return Number(fmtMilesNum(vm.km)) <= Number(within);
}
function partOk(vm, part, want) {
  if (want === 'any') return true;
  const up = part === 'people' ? vm.peopleUp : vm.planetUp;
  const down = part === 'people' ? vm.peopleDown : vm.planetDown;
  return want === 'up' ? up > 0 : down > 0;
}
function passes(vm, st) {
  if (!st.kind.includes(vm.sec)) return false;
  if (!st.f.every((f) => F_TEST[f](vm))) return false;
  return withinOk(vm, st.within) && partOk(vm, 'people', st.people) && partOk(vm, 'planet', st.planet);
}

function kindLabel(kinds) {
  return kinds.length ? 'Only ' + kinds.map((k) => SEC_LABEL[k]).join(' and ') : 'No kind shown';
}
// Every active filter with the patch that removes it, in rail order.
function activeFilters(st) {
  const out = [];
  if (st.kind.length !== ALL_KINDS.length) out.push({ label: kindLabel(st.kind), patch: { kind: ALL_KINDS.slice() } });
  LISTS.f.filter((f) => st.f.includes(f)).forEach((f) => out.push({ label: F_LABEL[f], patch: { f: st.f.filter((x) => x !== f) } }));
  if (st.within !== 'any') out.push({ label: `Within ${st.within} mi`, patch: { within: 'any' } });
  ['people', 'planet'].forEach((p) => {
    if (st[p] !== 'any') out.push({ label: `${PART_NAMES[p]}: ${PART_FILTER_LABEL[st[p]]}`, patch: { [p]: 'any' } });
  });
  return out;
}
const CLEAR_FILTERS = { kind: ALL_KINDS.slice(), f: [], within: 'any', people: 'any', planet: 'any' };

// Labels of the active filters that each hide this shop on their own. Empty while no filter hides it.
function hiddenBy(vm, st) {
  if (passes(vm, st)) return [];
  const out = [];
  if (!st.kind.includes(vm.sec)) out.push(`${SEC_LABEL[vm.sec]} off`);
  st.f.forEach((f) => { if (!F_TEST[f](vm)) out.push(F_LABEL[f]); });
  if (!withinOk(vm, st.within)) out.push(`Within ${st.within} mi`);
  ['people', 'planet'].forEach((p) => { if (!partOk(vm, p, st[p])) out.push(`${PART_NAMES[p]}: ${PART_FILTER_LABEL[st[p]]}`); });
  return out;
}

const SEC_ORDER = { near: 0, far: 1, online: 2 };
const NAME_ORDER = new Intl.Collator('en', { sensitivity: 'base' });
// Score ties keep the search's own order: its rank, and near before farther before online.
function byScore(a, b) { return (b.score - a.score) || (SEC_ORDER[a.sec] - SEC_ORDER[b.sec]) || (a.rank - b.rank); }
function distGroup(vm) { return vm.sec === 'online' ? 2 : vm.km == null ? 1 : 0; }
const SORTERS = {
  score: byScore,
  distance: (a, b) => (distGroup(a) - distGroup(b)) || ((a.km || 0) - (b.km || 0)) || byScore(a, b),
  name: (a, b) => NAME_ORDER.compare(a.name, b.name) || byScore(a, b),
  sells: (a, b) => (b.parts.sells.value - a.parts.sells.value) || byScore(a, b),
  people: (a, b) => (b.parts.people.value - a.parts.people.value) || byScore(a, b),
  planet: (a, b) => (b.parts.planet.value - a.parts.planet.value) || byScore(a, b),
};
function sortRows(rows, st) { return rows.slice().sort(SORTERS[st.sort] || byScore); }

// Bands in display order. `ordered` is the band's shown shops in the current sort; `rows` wraps
// them for drawing. A picked shop keeps its row in its own band, and the "To compare" band at the
// top holds a copy of each pick (also one a filter hides).
function getRows(st, search) {
  const all = shopsOf(search);
  const ids = byIdOf(search);
  const shown = all.filter((vm) => passes(vm, st));
  const picked = st.cmp.map((id) => ids[id]).filter(Boolean);
  const tieCount = {};
  const counted = new Set();
  shown.concat(picked).forEach((vm) => {
    if (counted.has(vm.id)) return;
    counted.add(vm.id);
    const k = vm.sec + '|' + vm.score.toFixed(3); tieCount[k] = (tieCount[k] || 0) + 1;
  });
  const wrap = (vm) => ({ vm, tie: tieCount[vm.sec + '|' + vm.score.toFixed(3)] });
  let out;
  if (!shown.length && all.length) {
    // Filtered to nothing: one message band in place of the kind bands.
    out = [{ key: 'nothing', sec: 'nothing', label: '', rows: [], ordered: [], total: all.length, empty: true }];
  } else if (st.group === 'none') {
    const ordered = sortRows(shown, st);
    out = [{ key: 'all', sec: 'all', label: '', rows: ordered.map(wrap), ordered, total: all.length, empty: false }];
  } else {
    const bands = [];
    ALL_KINDS.forEach((sec) => {
      const total = all.filter((vm) => vm.sec === sec).length;
      const ordered = sortRows(shown.filter((vm) => vm.sec === sec), st);
      const rows = ordered.map(wrap);
      bands.push({ key: sec, sec, label: SEC_LABEL[sec], rows, ordered, total, empty: total === 0 });
    });
    // An empty Farther away band is left out unless Near you is empty too. A kind that is off, or
    // one the filters emptied, has no band; a kind the search returned none of keeps its "none" header.
    const near = bands[0], far = bands[1];
    out = bands.filter((b) => st.kind.includes(b.sec)
      && (b.ordered.length || b.empty)
      && !(b === far && far.empty && !near.empty));
  }
  if (picked.length) {
    out.unshift({ key: 'cmp', sec: 'cmp', label: 'To compare', rows: picked.map(wrap), ordered: picked, total: picked.length, empty: false });
  }
  return out;
}

// Every shop in the order the list shows it, each once, for Previous and Next. A pick that a filter
// hides shows only as its copy in "To compare", so it is walked there.
function flatRows(st, search) {
  const bands = getRows(st, search);
  const inBands = new Set();
  bands.forEach((b) => { if (b.key !== 'cmp') b.rows.forEach((w) => inBands.add(w.vm.id)); });
  const out = [];
  bands.forEach((b) => b.rows.forEach((w) => { if (b.key !== 'cmp' || !inBands.has(w.vm.id)) out.push(w.vm); }));
  return out;
}

/* ======================================================================
   Self-check of the made-up data against the counts the spec prints
   ====================================================================== */
const EXPECT = {
  'sparse-metro': { shops: 19, cert: 1, finding: 2, nofinding: 17, chain: 6, nochain: 13, unknown: 16, nofacts: 13,
    sure: 13, peopleValues: 2, planetValues: 3, distances: 9, sellsLevels: 4, ties: '7@0.625',
    peopleUp: 0, peopleDown: 1, planetUp: 1, planetDown: 1, dropped: 11, near: 9, far: 0, online: 10 },
  'sparse-rural': { shops: 17, cert: 1, finding: 1, chain: 4, unknown: 15, dropped: 9, near: 4, far: 3, online: 10 },
  'filled-metro': { shops: 23, cert: 11, finding: 7, chain: 13, unknown: 6, ties: '3@0.700,2@0.550', dropped: 14,
    near: 10, far: 3, online: 10 },
  'filled-rural': { shops: 16, near: 5, far: 3, online: 8 },
};
function dataCounts(key) {
  const vms = shopsOf({ response: SEARCHES[key].response, request: SEARCHES[key].request });
  const distinct = (f) => new Set(vms.map(f).filter((x) => x != null)).size;
  const tieGroups = {};
  vms.forEach((vm) => { const k = vm.sec + '|' + vm.score.toFixed(3); tieGroups[k] = (tieGroups[k] || 0) + 1; });
  const ties = Object.entries(tieGroups).filter(([, n]) => n > 1)
    .sort((a, b) => b[1] - a[1]).map(([k, n]) => n + '@' + k.split('|')[1]).join(',');
  return {
    shops: vms.length,
    near: vms.filter((v) => v.sec === 'near').length, far: vms.filter((v) => v.sec === 'far').length,
    online: vms.filter((v) => v.sec === 'online').length,
    cert: vms.filter((v) => v.certs.length).length,
    finding: vms.filter((v) => v.finds.length).length,
    nofinding: vms.filter((v) => !v.finds.length).length,
    chain: vms.filter((v) => v.chain).length,
    nochain: vms.filter((v) => !v.chain).length,
    unknown: vms.filter((v) => v.unknown).length,
    nofacts: vms.filter((v) => v.unknown && !v.chain).length,
    sure: vms.filter((v) => v.parts.sells.value >= 1).length,
    peopleValues: distinct((v) => v.parts.people.value),
    planetValues: distinct((v) => v.parts.planet.value),
    distances: distinct((v) => (v.km == null ? null : fmtMiles(v.km) + (v.dir || ''))),
    sellsLevels: distinct((v) => v.sells),
    ties,
    peopleUp: vms.filter((v) => v.peopleUp).length, peopleDown: vms.filter((v) => v.peopleDown).length,
    planetUp: vms.filter((v) => v.planetUp).length, planetDown: vms.filter((v) => v.planetDown).length,
    dropped: SEARCHES[key].response.dropped.length,
  };
}
function selfCheck() {
  Object.keys(EXPECT).forEach((key) => {
    const got = dataCounts(key);
    Object.entries(EXPECT[key]).forEach(([k, want]) => {
      if (String(got[k]) !== String(want)) console.error(`data check ${key}: ${k} is ${got[k]}, spec says ${want}`);
    });
    shopsOf({ response: SEARCHES[key].response, request: SEARCHES[key].request }).forEach((vm) => {
      const printed = ['sells', 'people', 'planet', 'dist'].reduce((a, k) => a + vm.parts[k].contribution, 0);
      const miss = Math.abs(round3(printed) - vm.score);
      if (miss > 0.0011) console.error(`data check ${key}: ${vm.id} parts sum to ${fmt3(printed)}, score ${vm.score}`);
    });
  });
}

/* ======================================================================
   Render: small pieces (bars, chips, cells)
   ====================================================================== */
const PART_NAMES = { sells: 'Sells it', people: 'People', planet: 'Planet', dist: 'Distance' };
const PART_KEYS = ['sells', 'people', 'planet', 'dist'];
const PART_TAG = { sells: 'Sells', people: 'People', planet: 'Planet', dist: 'Dist.' };
// Thousandths as integers, so size comparisons of 3-place numbers never trip on float error.
function th(x) { return Math.round(Math.abs(x) * 1000); }
// Parts ranked by the size of their difference; equal sizes keep the order Sells it, People, Planet, Distance.
function rankParts(g) {
  return PART_KEYS.slice().sort((a, b) => (th(g[b]) - th(g[a])) || (PART_KEYS.indexOf(a) - PART_KEYS.indexOf(b)));
}

function scoreText(vm) {
  return `Score ${fmt2(vm.score)}. ` + ['sells', 'people', 'planet', 'dist']
    .map((k) => `${PART_NAMES[k]} ${fmt3(vm.parts[k].contribution)}`).join(', ');
}

function scoreBar(vm) {
  const segs = ['sells', 'people', 'planet', 'dist'].map((k) =>
    `<i class="seg seg-${k}" style="width:${(vm.parts[k].contribution * 100).toFixed(2)}%"></i>`).join('');
  return `<span class="sbar" role="img" aria-label="${esc(scoreText(vm))}" title="${esc(scoreText(vm))}" data-d="D1">${segs}</span>`;
}

function microText(label, value, up, down) {
  const bits = [];
  if (up) bits.push(`raised by ${up} ${plural(up, 'certification')}`);
  if (down) bits.push(`lowered by ${down} ${plural(down, 'finding')}`);
  return `${label} ${fmtVal(value)}: ${bits.length ? bits.join(', ') : 'unknown'}`;
}

function microBar(label, value, up, down) {
  const W = 44, mid = W / 2;
  const x = value * W;
  let inner = '';
  if (!up && !down) inner = '<i class="ring"></i>';
  else {
    if (value > 0.5) inner += `<i class="up" style="width:${(x - mid).toFixed(1)}px"></i>`;
    else if (up) inner += '<i class="capR"></i>';
    if (value < 0.5) inner += `<i class="dn" style="width:${(mid - x).toFixed(1)}px"></i>`;
    else if (down) inner += '<i class="notchL"></i>';
  }
  const t = esc(microText(label, value, up, down));
  return `<span class="mbar" role="img" aria-label="${t}" title="${t}" data-d="D1">${inner}</span>`;
}

function recordChips(vm) {
  const chips = [];
  if (vm.finds.length === 1) {
    const f = vm.finds[0];
    chips.push(`<span class="chip find"><span class="vh">Finding: </span>${FIND_KIND[f.kind]} ${yearOf(f.action_date)}</span>`);
  } else if (vm.finds.length > 1) {
    const years = vm.finds.map((f) => yearOf(f.action_date)).sort();
    chips.push(`<span class="chip find" title="${esc(vm.finds.map((f) => FIND_KIND[f.kind] + ' ' + yearOf(f.action_date)).join(', '))}">`
      + `${vm.finds.length} findings, ${years[0]} to ${years[years.length - 1]}</span>`);
  }
  if (vm.certs.length && vm.certs.length <= 2) {
    vm.certs.forEach((c) => chips.push(`<span class="chip cert">${esc(CERT_LABEL[c.kind])}</span>`));
  } else if (vm.certs.length > 2) {
    chips.push(`<span class="chip cert" title="${esc(vm.certs.map((c) => CERT_LABEL[c.kind]).join(', '))}">${vm.certs.length} certifications</span>`);
  }
  if (vm.unknown) chips.unshift('<span class="unk">unknown</span>');
  if (vm.assoc) chips.push('<span class="chip assoc">Retailer association</span>');
  if (vm.chain) chips.push(`<span class="chip chain">${esc(vm.chain.label)}</span>`);
  return `<div class="chips">${chips.join('')}</div>`;
}

const SELLS_NARROW = { likely: 'Likely sells it, a guess', may: 'May sell it, a guess', named: 'Named in listing',
  category: 'Category only', unconfirmed: 'Not confirmed' };
function sellsCell(vm) {
  // Beside a panel the column is 96 px; the band header carries "a guess, call first" there.
  if (rowCtx.mode) return SELLS_SHORT[vm.sells];
  switch (vm.sells) {
    // Narrow rows have room for the tail words, and no column header to lean on.
    case 'likely': return (layout() === 'narrow' ? 'Likely sells it' : 'Likely') + '<span class="muted">, a guess</span>';
    case 'may': return (layout() === 'narrow' ? 'May sell it' : 'May') + '<span class="muted">, a guess</span>';
    case 'named': return 'Named in listing';
    case 'category': return 'Category only';
    default: return 'Not confirmed';
  }
}

function distCell(vm) {
  if (vm.sec === 'online') return '<span class="muted">online</span>';
  if (vm.km == null) return '<span class="muted">not given</span>';
  return `${fmtMilesNum(vm.km)} mi${vm.dir ? ` <span class="dir">${vm.dir}</span>` : ''}`;
}

function accName(vm) { return vm.street ? `${vm.name}, ${vm.street}` : vm.name; }

/* ======================================================================
   Render: results table
   ====================================================================== */
const COLS = [
  { key: 'cmp', label: '<span class="vh">Compare</span>' },
  { key: 'rank', label: '#', title: 'The search\'s own place for each shop in its section: N near you, F farther away, O online. Sorting never renumbers.' },
  { key: 'shop', label: 'Shop', sort: 'name' },
  // The four part columns follow the score bar's segment order, so the bar reads left to right like the heads.
  { key: 'sells', label: 'Sells it', sort: 'sells' },
  { key: 'people', label: 'People', sort: 'people', d: 'D1', title: 'How it treats people: 0.50 when nothing is on file. A certification raises it, a finding lowers it.' },
  { key: 'planet', label: 'Planet', sort: 'planet', d: 'D1', title: 'How it treats the planet: 0.50 when nothing is on file. A certification raises it, a finding lowers it.' },
  { key: 'dist', label: 'Distance', sort: 'distance' },
  { key: 'score', label: 'Score', sort: 'score', d: 'D1', title: 'The bar holds the four parts in the order and colors of the column heads: Sells it, People, Planet, Distance.' },
  { key: 'record', label: 'Record' },
  // Shown only beside the compare panel; the label gets the compared-to shop's rank at render time.
  { key: 'against', label: 'vs', d: 'D1' },
];
const SORT_DIR = { score: 'descending', distance: 'ascending', name: 'ascending', sells: 'descending', people: 'descending', planet: 'descending' };
const ARROW = '<svg class="arrow" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

const SORT_NAME = { score: 'Score', distance: 'Distance', name: 'Name', sells: 'Sells it', people: 'People', planet: 'Planet' };
const D2_SORTS = ['sells', 'people', 'planet'];

// Every shop the list shows right now, picked ones included, each once.
function shownOf(bands) {
  const seen = new Map();
  bands.forEach((b) => b.ordered.forEach((vm) => seen.set(vm.id, vm)));
  return Array.from(seen.values());
}
// The value groups of one part among shown rows, largest first: [{v, n, unknown}].
function valueGroups(rows, part) {
  const m = new Map();
  rows.forEach((vm) => {
    const v = vm.parts[part].value;
    const g = m.get(v) || { v, n: 0, unknown: true };
    g.n++;
    if (part !== 'sells' && partFacts(vm, part).size) g.unknown = false;
    m.set(v, g);
  });
  return Array.from(m.values()).sort((a, b) => (b.n - a.n) || (b.v - a.v));
}
const SELLS_VALUE_WORD = { 1: 'likely or named', 0.5: 'may, or category only', 0.2: 'not confirmed' };
const SELLS_VALUE_NOTE = { 1: 'likely or named', 0.5: 'may or category', 0.2: 'not confirmed' };
function valueWords(g, part) {
  if (part === 'sells') return `${fmtVal(g.v)}, ${SELLS_VALUE_WORD[g.v] || ''}`.replace(/, $/, '');
  return fmtVal(g.v) + (g.unknown ? ', unknown' : '');
}
function tieGroups(rows) {
  const m = new Map();
  rows.forEach((vm) => { const k = vm.sec + '|' + vm.score.toFixed(3); m.set(k, (m.get(k) || 0) + 1); });
  return Array.from(m.entries()).filter(([, n]) => n > 1)
    .map(([k, n]) => ({ n, score: Number(k.split('|')[1]) }))
    .sort((a, b) => (b.n - a.n) || (b.score - a.score));
}

// Line 2 of a column header: how much the column can tell the shown shops apart.
// Returns { text, title }; an empty text leaves the line out.
function headerNote(colKey, bands) {
  if (!bands || !bands.length) return { text: '' };
  const rows = shownOf(bands);
  const n = rows.length;
  if (!n) return { text: '' };
  const groupsTitle = (part) => valueGroups(rows, part).map((g) => `${g.n} at ${valueWords(g, part)}`).join('; ');
  switch (colKey) {
    case 'sells': {
      const g = valueGroups(rows, 'sells')[0];
      return { text: `${g.n} ${SELLS_VALUE_NOTE[g.v] || ''}`.trim(), title: `Shops shown: ${groupsTitle('sells')}.` };
    }
    case 'dist': {
      const kms = rows.filter((vm) => vm.sec !== 'online' && vm.km != null).map((vm) => vm.km).sort((a, b) => a - b);
      if (!kms.length) return { text: rows.some((vm) => vm.sec !== 'online') ? 'not given' : 'online only' };
      const lo = fmtMilesNum(kms[0]), hi = fmtMilesNum(kms[kms.length - 1]);
      return { text: lo === hi ? `${lo} mi` : `${lo} to ${hi} mi` };
    }
    case 'people': case 'planet': {
      const gs = valueGroups(rows, colKey);
      const g = gs[0];
      // The common group is nearly always the shops with nothing on file; it says so, not just its value.
      const what = g.unknown ? 'unknown' : `at ${fmtVal(g.v)}`;
      return { text: gs.length === 1 ? `all ${what}` : `${g.n} ${what}`,
        title: `Shops shown: ${groupsTitle(colKey)}.` };
    }
    case 'score': {
      const ts = tieGroups(rows);
      if (!ts.length) return { text: 'no ties' };
      const full = `${ts[0].n} tied at ${fmt2(ts[0].score)}`;
      const title = ts.length > 1 ? 'Ties among shops shown: ' + ts.map((t) => `${t.n} at ${fmt3(t.score)}`).join(', ') : '';
      // The 48 px Score column beside a panel has room for the count only.
      if (rowCtx.mode) return { text: `${ts[0].n} tied`, title: title || full };
      return { text: full, title };
    }
    case 'record': return { text: `unknown for ${rows.filter((vm) => vm.unknown).length} of ${n}` };
    default: return { text: '' };
  }
}

// The 24 px row under the header for a part sort where most shown rows share one value.
function sortNote(st, bands) {
  if (!D2_SORTS.includes(st.sort)) return '';
  const rows = shownOf(bands);
  if (!rows.length) return '';
  const g = valueGroups(rows, st.sort)[0];
  if (g.n * 5 < rows.length * 4) return '';
  const text = `Sorted by ${SORT_NAME[st.sort]}. ${g.n} of ${rows.length} shops have the same value (${valueWords(g, st.sort)}), so among them the order is by score.`;
  return `<tbody role="rowgroup" class="sortnote"><tr role="row"><td role="cell" colspan="${visCols().length}" title="${esc(text)}">${esc(text)}</td></tr></tbody>`;
}

function tableHead(st, bands) {
  const live = !!(bands && bands.length);
  const ths = visCols().map((c) => {
    const sorted = c.sort && c.sort === st.sort;
    const attrs = [`class="c-${c.key}"`, 'role="columnheader"', 'scope="col"'];
    if (c.title) attrs.push(`title="${esc(c.title)}"`);
    if (c.d) attrs.push(`data-d="${c.d}"`);
    if (sorted) attrs.push(`aria-sort="${SORT_DIR[st.sort]}"`);
    const label = c.key === 'against' && rowCtx.ref ? `vs ${rowCtx.ref.id.toUpperCase()}` : c.label;
    const note = headerNote(c.key, bands);
    // At narrow the header row is hidden from sight and the Sort chip sorts, so its buttons leave the Tab order.
    const name = c.sort && live
      ? `<button type="button" class="sortbtn" data-sort="${c.sort}" title="Sort by ${esc(SORT_NAME[c.sort].toLowerCase())}"${layout() === 'narrow' ? ' tabindex="-1"' : ''}`
        + `${D2_SORTS.includes(c.sort) ? ' data-d="D2"' : ''}>${label}${sorted ? ARROW : ''}</button>`
      : `<span class="hname">${label}${sorted ? ARROW : ''}</span>`;
    return `<th ${attrs.join(' ')}>${name}`
      + `<span class="hnote"${note.title ? ` title="${esc(note.title)}"` : ''}>${esc(note.text)}</span></th>`;
  }).join('');
  return `<thead role="rowgroup"><tr role="row">${ths}</tr></thead>`;
}

function colgroup() { return '<colgroup>' + visCols().map((c) => `<col class="c-${c.key}">`).join('') + '</colgroup>'; }

// Three lengths: wide (full columns), short (the list narrowed beside a panel, which hides the
// Sells it column, so the guess and "call first" must stay) and narrow (a phone row). Counts are
// the search's own; while filters hide some, the header says how many of them show.
function bandHeadText(band, search) {
  const r = search.response.query.near_radius_mi;
  const n = band.ordered.length;
  const nar = layout() === 'narrow';
  const short = !nar && !!rowCtx.mode;
  const part = n < band.total;
  const shops = part ? `${n} of ${band.total} shown` : nar || short ? String(n) : `${n} ${plural(n, 'shop')}`;
  const name = (t) => `<span class="bname">${t}</span>`;
  if (band.sec === 'near') {
    if (!band.total) return `${name('Near you')} · none within ${r} mi`;
    if (nar) return `${name('Near you')} · ${part ? shops : `${shops} within ${r} mi`} · sells it is a guess`;
    if (short) return `${name('Near you')} · ${shops} within ${r} mi · sells it is a guess, call first`;
    return `${name('Near you')} · ${shops} within ${r} mi of the center of your zip area · Sells it is a guess here: call first`;
  }
  if (band.sec === 'far') {
    if (!band.total) return `${name('Farther away')} · none between ${r} and 100 mi`;
    const kms = band.ordered.map((vm) => vm.km).filter((k) => k != null).sort((a, b) => a - b);
    const lo = kms.length ? fmtMilesNum(kms[0]) : null;
    const hi = kms.length ? fmtMilesNum(kms[kms.length - 1]) : null;
    const span = lo == null ? '' : lo === hi ? `, ${lo} mi` : `, ${lo} to ${hi} mi`;
    if (nar) return `${name('Farther away')} · ${shops}${span} · a guess`;
    if (short) return `${name('Farther away')} · ${shops}${span} · a guess, call first`;
    return `${name('Farther away')} · ${shops}${span} · Sells it is a guess here: call first`;
  }
  if (!band.total) return nar ? `${name('Online')} · none found` : `${name('Online')} · none found. An online shop may still sell it.`;
  return nar || short ? `${name('Online')} · ${shops} · read from the listing`
    : `${name('Online')} · ${shops} · No address or distance · Sells it is read from the shop's listing`;
}

// Set by renderResults for the row builders: the column set, the compare reference and whether compare is full.
let rowCtx = { mode: '', ref: null, full: false };
// Beside a docked panel the table keeps fewer columns: at wide, and at medium beside a shop, chosen
// or search panel (compare is a drawer there). The class on the table carries the narrowed widths.
const MODE_COLS = {
  '': ['cmp', 'rank', 'shop', 'sells', 'dist', 'people', 'planet', 'score', 'record'],
  shop: ['cmp', 'rank', 'shop', 'score', 'record'],
  cmp: ['cmp', 'rank', 'shop', 'score', 'against'],
};
// Beside a shop the list keeps the column it is sorted by, in Score's place, so its order stays readable.
const SORT_COL = { distance: 'dist', sells: 'sells', people: 'people', planet: 'planet' };
const SORT_COL_W = { dist: 76, sells: 96, people: 70, planet: 70 };
function shopSortCol() { return rowCtx.mode === 'shop' ? SORT_COL[rowCtx.sort] || '' : ''; }
function visCols() {
  const sc = shopSortCol();
  const keys = MODE_COLS[rowCtx.mode || ''].map((k) => (sc && k === 'score' ? sc : k));
  return COLS.filter((c) => keys.includes(c.key));
}
const CMP_FULL = 'Compare holds 4. Remove one first.';

function againstCell(vm, ref) {
  if (!ref) return '';
  const REF = ref.id.toUpperCase();
  if (vm.id === ref.id) return `<span class="muted" title="The others are compared to ${REF}">${REF}</span>`;
  const g = gap(vm, ref);
  if (g.score === 0 && PART_KEYS.every((k) => g[k] === 0)) {
    return '<span class="muted" title="The same score and the same four parts">=</span>';
  }
  const { tag, full } = againstTag(g);
  return `<span class="agn" title="${esc(full)}"><span aria-hidden="true">${fmtSigned3(g.score)}<span class="atag">${tag}</span></span>`
    + `<span class="vh">${esc(full)}</span></span>`;
}

function againstTag(g) {
  const lead = th(g.score) === 0 ? 'The same score' : `${fmt3(Math.abs(g.score))} ${hl(g.score)}`;
  if (cancels(g)) {
    // Two parts pulling opposite ways explain the gap together; naming one would misstate it.
    return { tag: 'mixed', full: `${lead}: ` + rankParts(g).filter((k) => th(g[k]) > 0)
      .map((k) => `${PART_NAMES[k]} ${fmt3(Math.abs(g[k]))} ${hl(g[k])}`).join(', ') };
  }
  const order = rankParts(g);
  // Two parts within 0.005 of each other explain the gap about equally; naming one would hide the other.
  if (th(g[order[1]]) > 0 && th(g[order[0]]) - th(g[order[1]]) < 5) {
    return { tag: 'mixed', full: `${lead}: ` + order.filter((k) => th(g[k]) > 0)
      .map((k) => `${PART_NAMES[k]} ${fmt3(Math.abs(g[k]))} ${hl(g[k])}`).join(', ') };
  }
  // The tag names the largest part that moved the score the way it went.
  const top = order.find((k) => th(g[k]) > 0 && Math.sign(g[k]) === Math.sign(g.score)) || order[0];
  return { tag: PART_TAG[top], full: `${lead}, mostly ${PART_NAMES[top]}` };
}

// copy: the row is a pick's copy in "To compare"; only there does it say which filter hides it.
function shopRow(w, st, tiePos, copy) {
  const vm = w.vm;
  const sel = (st.panel === 'shop' || st.panel === 'chosen') && st.shop === vm.id;
  const picked = st.cmp.includes(vm.id);
  const tieTitle = `${w.tie} shops share this score. They are listed in the search's own order.`;
  const showMark = w.tie > 1;
  const cls = ['srow'];
  if (sel) cls.push('sel');
  if (copy) cls.push('pcopy');
  // Narrow: a record that is only "unknown" ends line 2 when that line is short enough to take it.
  const lone = vm.unknown && !vm.chain && !vm.assoc;
  const line2 = (vm.sec === 'online' ? 'online' : vm.km == null ? 'not given' : whereShort(vm)) + ' · ' + SELLS_NARROW[vm.sells];
  if (lone) cls.push(line2.length <= 32 ? 'rec1' : 'rec1w');
  const off = !picked && rowCtx.full;
  const hid = picked && copy ? hiddenBy(vm, st) : [];
  const cells = {
    cmp: () => `<td class="c-cmp" role="cell"${off ? ` title="${CMP_FULL}"` : ''}><input type="checkbox" class="cmpbox" data-cmp="${vm.id}" aria-label="Compare ${esc(accName(vm))}"${picked ? ' checked' : ''}${off ? ` disabled title="${CMP_FULL}"` : ''}></td>`,
    rank: () => `<td class="c-rank" role="cell">${vm.id.toUpperCase()}</td>`,
    shop: () => `<th class="c-shop" role="rowheader" scope="row"><button type="button" class="name" data-open="${vm.id}" title="${esc(accName(vm))}" aria-label="${esc(accName(vm))}">${esc(vm.name)}</button></th>`,
    sells: () => `<td class="c-sells" role="cell">${sellsCell(vm)}${lone ? '<span class="unk2" aria-hidden="true"> · unknown</span>' : ''}</td>`,
    dist: () => `<td class="c-dist" role="cell">${distCell(vm)}</td>`,
    people: () => `<td class="c-people" role="cell">${microBar('People', vm.parts.people.value, vm.peopleUp, vm.peopleDown)}</td>`,
    planet: () => `<td class="c-planet" role="cell">${microBar('Planet', vm.parts.planet.value, vm.planetUp, vm.planetDown)}</td>`,
    score: () => `<td class="c-score${tiePos ? ' tie-' + tiePos : ''}" role="cell"><span class="scorewrap">${scoreBar(vm)}`
      + `<span class="snum" aria-hidden="true">${fmt2(vm.score)}</span>`
      + (showMark ? `<span class="tiemark" title="${esc(tieTitle)}">=${w.tie}</span>` : '')
      + `</span><span class="vh sacc">${esc(scoreText(vm))}</span></td>`,
    record: () => `<td class="c-record" role="cell">${recordChips(vm)}`
      + (hid.length ? `<span class="hidnote">Hidden in the list by: ${esc(hid.join(', '))}</span>` : '') + '</td>',
    against: () => `<td class="c-against" role="cell">${againstCell(vm, rowCtx.ref)}`
      + (hid.length ? `<span class="vh">Hidden in the list by: ${esc(hid.join(', '))}</span>` : '') + '</td>',
  };
  return `<tr role="row" class="${cls.join(' ')}" data-id="${vm.id}"${vm.street ? ` title="${esc(accName(vm))}"` : ''}>`
    + visCols().map((c) => cells[c.key]()).join('') + '</tr>';
}

function cmpBandHead(band) {
  const n = band.rows.length;
  return `<tr role="row" class="cmphead"><th role="rowheader" scope="rowgroup" colspan="${visCols().length}">`
    + `<span class="bname">To compare</span> · ${n} of 4`
    + `<button type="button" class="btn small primary" data-act="cmpopen"${n < 2 ? ' disabled title="Pick 2 to 4 shops to compare."' : ''}>Compare</button>`
    + '<button type="button" class="btn small" data-act="cmpclear">Clear</button></th></tr>';
}

// Tie bracket positions: only where tied rows sit next to each other under the score sort.
function tiePositions(rows, st) {
  const pos = rows.map(() => '');
  if (st.sort !== 'score') return pos;
  let i = 0;
  while (i < rows.length) {
    let j = i;
    while (j + 1 < rows.length && rows[j + 1].vm.sec === rows[i].vm.sec
      && rows[j + 1].vm.score.toFixed(3) === rows[i].vm.score.toFixed(3)) j++;
    if (j > i) { pos[i] = 'start'; for (let k = i + 1; k < j; k++) pos[k] = 'mid'; pos[j] = 'end'; }
    i = j + 1;
  }
  return pos;
}

// mode: '' (full columns), 'shop' (beside a shop, chosen or search panel) or 'cmp' (beside compare).
function renderResults(st, search, mode) {
  const bands = getRows(st, search);
  const q = search.response.query;
  const ids = byIdOf(search);
  rowCtx = { mode: mode || '', ref: mode === 'cmp' ? ids[st.ref] || null : null, full: st.cmp.length >= 4, sort: st.sort };
  // Narrow only: under the score sort a tie group of 4 or more shows its first 2 rows and a button.
  const foldable = layout() === 'narrow' && st.sort === 'score';
  const fold = foldable && st.ties === 'fold';
  const sameScore = (a, b) => a.vm.sec === b.vm.sec && a.vm.score.toFixed(3) === b.vm.score.toFixed(3);
  const tieKey = (vm) => vm.sec + '|' + vm.score.toFixed(3);
  const bodies = bands.map((b) => {
    if (b.key === 'nothing') return nothingBody(st, b);
    const pos = tiePositions(b.rows, st);
    let head = '';
    if (b.key === 'cmp') head = cmpBandHead(b);
    else if (b.key !== 'all') head = `<tr role="row" class="bandhead"><th role="rowheader" scope="rowgroup" colspan="${visCols().length}">${bandHeadText(b, search)}</th></tr>`;
    // One list has no band headers, so while filters hide some shops one header says how many.
    else if (b.ordered.length < b.total) {
      const hidden = b.total - b.ordered.length;
      head = `<tr role="row" class="bandhead"><th role="rowheader" scope="rowgroup" colspan="${visCols().length}">`
        + `<span class="bname">${b.ordered.length} of ${b.total} shown</span> · ${hidden} hidden by filters`
        + '<button type="button" class="btn small bclear" data-act="clearfilters">Clear filters</button></th></tr>';
    }
    if (b.key === 'near' && b.empty && search.state === 'thin') head += thinRow(search);
    let rows = '';
    for (let i = 0; i < b.rows.length;) {
      let j = i;
      while (foldable && b.key !== 'cmp' && j + 1 < b.rows.length && sameScore(b.rows[j + 1], b.rows[i])) j++;
      const tie = `data-tie="${tieKey(b.rows[i].vm)}"`;
      if (fold && j - i + 1 >= 4) {
        rows += shopRow(b.rows[i], st, pos[i]) + shopRow(b.rows[i + 1], st, pos[i + 1])
          + `<tr role="row" class="tiefold"><td role="cell" colspan="${visCols().length}"><button type="button" class="btn tiebtn" data-act="ties" ${tie}>`
          + `Show ${j - i - 1} more at ${fmt2(b.rows[i].vm.score)}</button></td></tr>`;
      } else {
        for (let k = i; k <= j; k++) rows += shopRow(b.rows[k], st, pos[k], b.key === 'cmp');
        // An opened group can be folded again from its end.
        if (foldable && j - i + 1 >= 4) {
          rows += `<tr role="row" class="tiefold"><td role="cell" colspan="${visCols().length}"><button type="button" class="btn tiebtn" data-act="tiesfold" ${tie}>`
            + `Show fewer at ${fmt2(b.rows[i].vm.score)}</button></td></tr>`;
        }
      }
      i = j + 1;
    }
    return `<tbody role="rowgroup" class="band band-${b.key}">` + head + rows + '</tbody>';
  }).join('');
  const cls = 'grid' + (mode ? ' nar nar-' + mode : '');
  const sc = shopSortCol();
  return `<table class="${cls}" role="table" id="grid"${sc ? ` style="--sc:${SORT_COL_W[sc]}px"` : ''}>`
    + `<caption class="vh">Shops for ${esc(q.product)} near ${esc(q.city)}, ${esc(q.state)}</caption>`
    + colgroup() + tableHead(st, bands) + sortNote(st, bands) + bodies + '</table>';
}

// The one message row when the filters hide every shop; the header stays above it.
function nothingBody(st, band) {
  const btns = activeFilters(st).map((a, i) =>
    `<button type="button" class="btn small" data-act="unfilter" data-idx="${i}">Remove: ${esc(a.label)}</button>`).join('');
  // Picked shops stay in "To compare" above this row whatever the filters, so the count says so.
  const hide = st.cmp.length ? 'Your filters hide every shop except the ones picked to compare.' : 'Your filters hide all of them.';

    + '</span></span>';
}
function themeSelect(st, p) {
  return `<span class="pfield pf-theme"><label class="plab" for="${p}p-theme">Theme</label>`
    + `<select class="psel" id="${p}p-theme" data-pk="theme">`
    + [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([v, t]) => `<option value="${v}"${st.theme === v ? ' selected' : ''}>${t}</option>`).join('')
    + '</select></span>';
}
const DATA_OPTS = [['sparse', 'Sparse', 'Sparse: as empty as real results.'], ['filled', 'Filled', 'Filled: as full as the fields allow.']];
const PLACE_OPTS = [['metro', 'Metro'], ['rural', 'Rural']];

  document.getElementById('proto').innerHTML = '<span class="ptag">Prototype</span>'

  document.getElementById('fswitch').innerHTML = switchSeg(st, 'f-', 'place', 'Place', PLACE_OPTS) + themeSelect(st, 'f-');
  const q = search.query;
  const product = st.view === 'searching' ? (form.q || q.product) : q.product;
  // The narrow summary line under the bar names the place, so the bar has room for the whole product.
  document.getElementById('tsum').textContent = product;

  const tb = document.getElementById('tsearch');
